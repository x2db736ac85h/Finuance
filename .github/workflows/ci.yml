name: CI

on:
  push:
    branches: [main, 'phase/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  guardrails:
    name: guardrails (secrets + private data)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks.tar.gz

      - name: gitleaks
        run: gitleaks git --no-banner --redact --verbose .

      - name: Private-data check
        run: tools/check-private.sh

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: make check
        run: make check

  db:
    name: db bootstrap (Compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Start Postgres
        run: make db-up

      - name: Roles and extensions exist
        run: |
          set -euo pipefail
          roles="$(make -s db-psql SQL="select string_agg(rolname, ',' order by rolname) from pg_roles where rolname like 'finuance%'" | tee /dev/stderr)"
          grep -q 'finuance_app,finuance_owner' <<<"$roles"
          exts="$(make -s db-psql SQL="select string_agg(extname, ',' order by extname) from pg_extension" | tee /dev/stderr)"
          grep -q 'citext' <<<"$exts"
          grep -q 'pg_trgm' <<<"$exts"
          make -s db-psql SQL='\du'

      - name: Postgres logs
        if: failure()
        run: docker compose --env-file .env -f deploy/compose/compose.yaml logs db

  backend:
    name: backend (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: golangci-lint
        run: make lint
      - name: Generated code is up to date
        run: make gen-check
      - name: Unit tests (race)
        working-directory: backend
        run: go test -race -short ./...
      - name: Integration tests (race, testcontainers)
        working-directory: backend
        run: go test -race ./...
      - name: govulncheck
        working-directory: backend
        run: go tool govulncheck ./...

  image:
    name: backend image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build
        run: make images
      - name: Size and user
        run: |
          docker image inspect finuance-backend:dev --format 'user={{.Config.User}}'
          test "$(docker image inspect finuance-backend:dev --format '{{.Config.User}}')" = "nonroot:nonroot"
          docker history --format '{{.Size}}\t{{.CreatedBy}}' finuance-backend:dev | head -10
          # Limits agreed at the Phase 2 gate: ≤ 35 MB uncompressed, ≤ 15 MB compressed.
          raw=$(docker history --format '{{.Size}}' finuance-backend:dev | python3 -c 'import re,sys; u={"B":1,"kB":1e3,"MB":1e6,"GB":1e9}; print(int(sum(float(m[1])*u[m[2]] for m in (re.match(r"([\d.]+)([kMG]?B)", l.strip()) for l in sys.stdin) if m)))')
          gz=$(docker save finuance-backend:dev | gzip -c | wc -c)
          echo "uncompressed: $raw bytes, compressed: $gz bytes"
          test "$raw" -le 35000000 || { echo "::error::image exceeds 35 MB uncompressed"; exit 1; }
          test "$gz" -le 15000000 || { echo "::error::image exceeds 15 MB compressed"; exit 1; }
      - name: Smoke test
        run: docker run --rm finuance-backend:dev version
      - name: Trivy (HIGH/CRITICAL fail the build)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.0 \
            image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress finuance-backend:dev

  oracle-fresh:
    name: legacy oracle is fresh
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/legacy-oracle/package-lock.json
      - name: Install oracle dependencies
        working-directory: tools/legacy-oracle
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Synthetic fixtures match the generator
        run: make fixtures-check
      - name: Regenerate legacy expectations
        run: make oracle
      - name: No drift
        run: |
          git add -A -N testdata
          git diff --exit-code --stat -- testdata || { echo "::error::make oracle changed testdata/ — run it locally and commit the result"; exit 1; }

  web:
    name: web (placeholder)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "Web lint, typecheck and tests arrive in Phase 8."
