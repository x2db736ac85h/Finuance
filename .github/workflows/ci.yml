name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  guardrails:
    name: guardrails (secrets + private data)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks.tar.gz

      - name: gitleaks
        run: gitleaks git --no-banner --redact --verbose .

      - name: Private-data check
        run: tools/check-private.sh

      - name: make check
        run: make check

  db:
    name: db bootstrap (Compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Start Postgres
        run: make db-up

      - name: Roles and extensions exist
        run: |
          set -euo pipefail
          roles="$(make -s db-psql SQL="select string_agg(rolname, ',' order by rolname) from pg_roles where rolname like 'finuance%'" | tee /dev/stderr)"
          grep -q 'finuance_app,finuance_owner' <<<"$roles"
          exts="$(make -s db-psql SQL="select string_agg(extname, ',' order by extname) from pg_extension" | tee /dev/stderr)"
          grep -q 'citext' <<<"$exts"
          grep -q 'pg_trgm' <<<"$exts"
          make -s db-psql SQL='\du'

      - name: Postgres logs
        if: failure()
        run: docker compose --env-file .env -f deploy/compose/compose.yaml logs db

  backend:
    name: backend (placeholder)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "Go lint, unit and integration tests arrive in Phase 2."

  web:
    name: web (placeholder)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "Web lint, typecheck and tests arrive in Phase 8."
