name: CI

on:
  push:
    branches: [main, 'phase/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=gitleaks/gitleaks
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  guardrails:
    name: guardrails (secrets + private data)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the full history

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks.tar.gz

      - name: gitleaks
        run: gitleaks git --no-banner --redact --verbose .

      - name: Private-data check
        run: tools/check-private.sh && tools/check-private-test.sh

      # The patterns of the private environment (tools/check-env-details.sh) can't be in this
      # repository, so they come from a repository secret (PLAN task 22.9). Pull requests from
      # forks get no secrets: the check says so and passes.
      - name: Environment-details check
        env:
          PATTERNS: ${{ secrets.FINUANCE_ENV_PATTERNS }}
        run: |
          if [ -z "$PATTERNS" ]; then
            echo "::notice title=check-env-details::skipped: no FINUANCE_ENV_PATTERNS secret (a pull request from a fork, or the secret is not set)"
            exit 0
          fi
          d="$RUNNER_TEMP/env"; mkdir -p "$d"
          printf '%s\n' "$PATTERNS" >"$d/private-patterns.txt"
          FINUANCE_ENV_DIR="$d" tools/check-env-details.sh

      # renovate.json is read by the hosted Renovate app, which reports errors only on its
      # dashboard; check it here (PLAN task 22.3).
      - name: Renovate configuration
        env:
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: 44.253.0
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict renovate.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: make check
        # Failing lines become annotations: job logs can't be read from the cloud sessions that
        # build this project, annotations can (as in the k8s rehearsal).
        run: |
          set -o pipefail
          make check 2>&1 | tee "$RUNNER_TEMP/check.log" || {
            grep -E -- '--- FAIL|^FAIL|_test\.go:[0-9]+:|\.go:[0-9]+:[0-9]+:|gen-check:|check-[a-z-]+:|✗|×|Error:|error TS|npm ERR|make: \*\*\*' "$RUNNER_TEMP/check.log" \
              | head -30 | sed 's/^/::error title=make check::/'
            exit 1
          }

  workflows:
    name: workflows (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned, checksum-verified binaries (tools/bin-tools.sh). zizmor runs online here: the token
      # lets it check the pinned commits against their tags and against known vulnerable actions.
      - name: actionlint and zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tools/bin-tools.sh actionlint
          tools/bin-tools.sh zizmor
          backend/bin/actionlint
          backend/bin/zizmor --format github .github/workflows

  dependency-review:
    name: dependency review (vulnerabilities, licences)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # What a pull request adds or updates: a known vulnerability of moderate or higher, or a
      # licence outside this list, fails (PLAN task 22.6). The list is the plan's plus the licences
      # already in use that the maintainer accepted on 2026-11-19; extend it only with their OK.
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          allow-licenses: >-
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, 0BSD, Unlicense, CC0-1.0, PostgreSQL,
            BlueOak-1.0.0, MIT-0, Python-2.0, BSD-2-Clause-Views, CC-BY-4.0, CC-BY-SA-4.0,
            LicenseRef-scancode-dco-1.1, LicenseRef-scancode-google-patent-license-golang

  db:
    name: db bootstrap (Compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start Postgres
        run: make db-up

      - name: Roles and extensions exist
        run: |
          set -euo pipefail
          roles="$(make -s db-psql SQL="select string_agg(rolname, ',' order by rolname) from pg_roles where rolname like 'finuance%'" | tee /dev/stderr)"
          grep -q 'finuance_app,finuance_owner' <<<"$roles"
          exts="$(make -s db-psql SQL="select string_agg(extname, ',' order by extname) from pg_extension" | tee /dev/stderr)"
          grep -q 'citext' <<<"$exts"
          grep -q 'pg_trgm' <<<"$exts"
          make -s db-psql SQL='\du'

      - name: Postgres logs
        if: failure()
        run: docker compose --env-file .env -f deploy/compose/compose.yaml logs db

  backend:
    name: backend (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: golangci-lint (+ web lint)
        run: make lint
      - name: Generated code is up to date
        run: make gen-check
      - name: Unit tests (race)
        working-directory: backend
        run: go test -race -short ./...
      - name: Integration tests (race, testcontainers)
        working-directory: backend
        run: go test -race ./...
      - name: govulncheck
        working-directory: backend
        run: go tool govulncheck ./...
      - name: No floating point in money or the fingerprint path
        run: make check-no-float
      - name: Coverage ingest + money (>= 90 %)
        run: make coverage
      - name: Fuzz smoke (10s per target)
        run: make fuzz FUZZTIME=10s
      - name: Benchmark BenchmarkParse_100k
        working-directory: backend
        run: |
          go test -short -run='^$' -bench='^BenchmarkParse_100k$' -benchmem -count=3 ./internal/ingest/ | tee bench.txt
          { echo '### BenchmarkParse_100k'; echo; echo '```'; grep -E '^(Benchmark|cpu:)' bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: images (backend + web)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # the Trivy results in code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: make images
      - name: Size and user
        run: |
          docker image inspect finuance-backend:dev --format 'user={{.Config.User}}'
          test "$(docker image inspect finuance-backend:dev --format '{{.Config.User}}')" = "nonroot:nonroot"
          docker history --format '{{.Size}}\t{{.CreatedBy}}' finuance-backend:dev | head -10
          # Limits agreed at the Phase 2 gate: ≤ 35 MB uncompressed, ≤ 15 MB compressed.
          raw=$(docker history --format '{{.Size}}' finuance-backend:dev | python3 -c 'import re,sys; u={"B":1,"kB":1e3,"MB":1e6,"GB":1e9}; print(int(sum(float(m[1])*u[m[2]] for m in (re.match(r"([\d.]+)([kMG]?B)", l.strip()) for l in sys.stdin) if m)))')
          gz=$(docker save finuance-backend:dev | gzip -c | wc -c)
          echo "uncompressed: $raw bytes, compressed: $gz bytes"
          test "$raw" -le 35000000 || { echo "::error::image exceeds 35 MB uncompressed"; exit 1; }
          test "$gz" -le 15000000 || { echo "::error::image exceeds 15 MB compressed"; exit 1; }
      - name: Smoke test
        run: docker run --rm finuance-backend:dev version
      # Trivy is the checksum-verified binary (tools/bin-tools.sh) and reads the image from a
      # tarball, without the Docker socket. Every severity goes to code scanning; HIGH and CRITICAL
      # fail the build.
      - name: Trivy api image (HIGH/CRITICAL fail the build)
        run: |
          set -euo pipefail
          tools/bin-tools.sh trivy
          docker save finuance-backend:dev -o "$RUNNER_TEMP/api.tar"
          backend/bin/trivy image --input "$RUNNER_TEMP/api.tar" --scanners vuln --format sarif --output trivy-api.sarif --no-progress
          backend/bin/trivy image --input "$RUNNER_TEMP/api.tar" --ignorefile .trivyignore --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress
      - name: Upload trivy-api.sarif to code scanning
        if: hashFiles('trivy-api.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api-image
      - name: Web image runs as non-root and serves the app with the CSP
        run: |
          set -euo pipefail
          test "$(docker image inspect finuance-web:dev --format '{{.Config.User}}')" = "101"
          docker image ls finuance-web:dev
          docker run -d --name web-smoke -p 127.0.0.1:8001:8080 -e FINUANCE_API_UPSTREAM=127.0.0.1:9 finuance-web:dev
          for i in $(seq 20); do curl -fsS http://127.0.0.1:8001/healthz && break; sleep 0.5; done
          curl -fsS -D headers.txt -o index.html http://127.0.0.1:8001/t/all
          grep -qi "^content-security-policy: default-src 'self'" headers.txt
          grep -q '<div id="root">' index.html
          docker rm -f web-smoke
      - name: Trivy web image (HIGH/CRITICAL fail the build)
        run: |
          set -euo pipefail
          docker save finuance-web:dev -o "$RUNNER_TEMP/web.tar"
          backend/bin/trivy image --input "$RUNNER_TEMP/web.tar" --scanners vuln --format sarif --output trivy-web.sarif --no-progress
          backend/bin/trivy image --input "$RUNNER_TEMP/web.tar" --ignorefile .trivyignore --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress
      - name: Upload trivy-web.sarif to code scanning
        if: hashFiles('trivy-web.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web-image

  security:
    name: security (repository scan, npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # the Trivy results in code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # PLAN 17.6 and the Phase 14 gate follow-up: no accepted findings before the public demo.
      # Go and npm dependencies (dev dependencies included), secrets, and the misconfiguration
      # checks for the Dockerfiles, Compose and Kubernetes files. The two Helm charts are rendered
      # with every values file and config-scanned by the helm job, so their sources are skipped
      # here (they don't render without the required values).
      - name: Accepted findings (.trivyignore) in the summary
        run: |
          {
            echo '### Accepted findings (`.trivyignore`)'; echo
            entries="$(grep -vE '^[[:space:]]*(#|$)' .trivyignore || true)"
            if [ -z "$entries" ]; then echo 'None.'; else echo '| Id | Expires |'; echo '|---|---|'; echo "$entries" | sed -E 's/^([^ ]+).*exp:([0-9-]+).*$/| \1 | \2 |/'; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Trivy repository scan (HIGH/CRITICAL fail the build)
        run: |
          set -euo pipefail
          tools/bin-tools.sh trivy
          skip=(--skip-dirs deploy/helm/finuance --skip-dirs deploy/k8s/db --skip-dirs backend/bin)
          backend/bin/trivy fs --scanners vuln,secret,misconfig --include-dev-deps "${skip[@]}" --format sarif --output trivy-repo.sarif --no-progress .
          backend/bin/trivy fs --ignorefile .trivyignore --scanners vuln,secret,misconfig --include-dev-deps "${skip[@]}" \
            --severity HIGH,CRITICAL --exit-code 1 --no-progress .
      - name: Upload trivy-repo.sarif to code scanning
        if: hashFiles('trivy-repo.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-repo.sarif
          category: trivy-repository
      # A second database (OSV) over the three lockfiles; any finding fails, there is no ignore list.
      - name: osv-scanner
        run: |
          tools/bin-tools.sh osv-scanner
          backend/bin/osv-scanner scan -L backend/go.mod -L web/package-lock.json -L tools/legacy-oracle/package-lock.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: npm audit (HIGH/CRITICAL fail the build)
        working-directory: web
        run: |
          npm audit --omit=dev --audit-level=high
          # every dependency: accepted findings come from .trivyignore, with an expiry
          node ../tools/npm-audit.mjs --self-test
          npm audit --json | node ../tools/npm-audit.mjs ../.trivyignore

  helm:
    name: helm (charts, Argo CD manifests, dashboards and alert rules)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # renovate: datasource=go depName=helm.sh/helm/v3
      HELM_VERSION: v3.22.1
      # renovate: datasource=go depName=github.com/yannh/kubeconform
      KUBECONFORM_VERSION: v0.7.0
      # renovate: datasource=go depName=github.com/bitnami/sealed-secrets
      KUBESEAL_VERSION: v0.40.0
      # renovate: datasource=go depName=github.com/mikefarah/yq/v4
      YQ_VERSION: v4.54.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      # Pinned versions through `go install` (verified by the Go checksum database), like cosign
      # and syft in release.yml.
      - name: Tools (helm, kubeconform, kubeseal, yq)
        run: |
          go install "github.com/mikefarah/yq/v4@${YQ_VERSION}"
          go install "helm.sh/helm/v3/cmd/helm@${HELM_VERSION}"
          go install "github.com/yannh/kubeconform/cmd/kubeconform@${KUBECONFORM_VERSION}"
          go install "github.com/bitnami/sealed-secrets/cmd/kubeseal@${KUBESEAL_VERSION}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # tools/check-observability.sh also runs promtool from the pinned prom/prometheus image.
      - name: Lint, render and validate (helm lint, kubeconform -strict with CRD schemas, promtool)
        run: RENDER_DIR="$RUNNER_TEMP/rendered" YQ="$(go env GOPATH)/bin/yq" make helm-lint
      # The rendered files exist only on the runner, so they are not uploaded to code scanning.
      - name: Trivy config scan of the rendered manifests (HIGH/CRITICAL fail the build)
        run: |
          tools/bin-tools.sh trivy
          backend/bin/trivy config --severity HIGH,CRITICAL --exit-code 1 --disable-telemetry "$RUNNER_TEMP/rendered"
      - name: GitOps bump (tools/bump-homelab-tag.sh changes only the tag line)
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/values.yaml"; cp deploy/environments/homelab/values.yaml "$f"
          YQ="$(go env GOPATH)/bin/yq" tools/bump-homelab-tag.sh 9.8.7 "$f"
          test "$(diff deploy/environments/homelab/values.yaml "$f" | grep -c '^[<>]')" -eq 2
          grep -q '^  tag: "9.8.7"$' "$f"
          if YQ="$(go env GOPATH)/bin/yq" tools/bump-homelab-tag.sh 9.8 "$f"; then exit 1; fi
      - name: Sealing round trip (tools/seal-secrets.sh with a throwaway key)
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/seal"; mkdir -p "$d/out"
          openssl req -x509 -newkey rsa:4096 -nodes -keyout "$d/key.pem" -out "$d/cert.pem" -days 1 -subj "/CN=sealed-secret/O=sealed-secret" 2>/dev/null
          export SEAL_CERT="$d/cert.pem" SECRETS_DIR="$d/out"
          tools/seal-secrets.sh homelab db
          ACCESS_KEY_ID=ak ACCESS_SECRET_KEY=sk tools/seal-secrets.sh homelab backup
          for f in "$d"/out/*.sealed.yaml; do
            # only encrypted data: a SealedSecret, no plain data/stringData
            grep -q '^kind: SealedSecret' "$f"
            if grep -qE '^ *(data|stringData):' "$f"; then echo "::error::$f holds plain data"; exit 1; fi
            kubeseal --recovery-unseal --recovery-private-key "$d/key.pem" <"$f" \
              | python3 -c 'import json,sys; s=json.load(sys.stdin); assert s["metadata"]["namespace"]=="finuance" and s["data"], s["metadata"]["name"]; print("unsealed", s["metadata"]["name"], sorted(s["data"]))'
          done
          # backup-store: one random key pair, sealed for the database (finuance) and RustFS (s3)
          mkdir -p "$d/store" "$d/store-s3"
          SECRETS_DIR="$d/store" RUSTFS_SECRETS_DIR="$d/store-s3" tools/seal-secrets.sh homelab backup-store
          unseal() { kubeseal --recovery-unseal --recovery-private-key "$d/key.pem" <"$1"; }
          python3 - <(unseal "$d/store/finuance-db-backup.sealed.yaml") <(unseal "$d/store-s3/rustfs.sealed.yaml") <<'PY'
          import json, sys
          db, fs = (json.load(open(p)) for p in sys.argv[1:3])
          assert db["metadata"]["namespace"] == "finuance" and fs["metadata"]["namespace"] == "s3"
          assert db["data"]["ACCESS_KEY_ID"] == fs["data"]["RUSTFS_ACCESS_KEY"]
          assert db["data"]["ACCESS_SECRET_KEY"] == fs["data"]["RUSTFS_SECRET_KEY"]
          assert len(db["data"]["ACCESS_SECRET_KEY"]) >= 40  # 32 random characters, base64
          print("backup-store: the same key pair in finuance-db-backup and s3/rustfs")
          PY
          # instance-key: 32 random bytes in base64 (ADR 0035)
          mkdir -p "$d/ikey"
          SECRETS_DIR="$d/ikey" tools/seal-secrets.sh homelab instance-key
          unseal "$d/ikey/finuance-instance-key.sealed.yaml" | python3 -c 'import base64,json,sys; s=json.load(sys.stdin); k=base64.b64decode(base64.b64decode(s["data"]["FINUANCE_INSTANCE_KEY"])); assert len(k)==32, len(k); print("instance-key: 32 random bytes sealed as finuance-instance-key")'
          # pull: a registry login from a token on stdin
          mkdir -p "$d/pull"
          printf 'fake-token' | SECRETS_DIR="$d/pull" tools/seal-secrets.sh homelab pull
          unseal "$d/pull/ghcr-pull.sealed.yaml" | python3 -c 'import base64,json,sys; s=json.load(sys.stdin); assert s["type"]=="kubernetes.io/dockerconfigjson"; c=json.loads(base64.b64decode(s["data"][".dockerconfigjson"])); a=base64.b64decode(c["auths"]["ghcr.io"]["auth"]).decode(); assert a.endswith(":fake-token"), "auth"; print("pull: ghcr.io login sealed as ghcr-pull")'
          # smtp: an app password on stdin (spaces removed), bound to the monitoring namespace
          mkdir -p "$d/smtp"
          printf 'abcd efgh ijkl mnop' | SMTP_SECRETS_DIR="$d/smtp" tools/seal-secrets.sh homelab smtp
          unseal "$d/smtp/finuance-alert-smtp.sealed.yaml" | python3 -c 'import base64,json,sys; s=json.load(sys.stdin); assert s["metadata"]["namespace"]=="monitoring"; assert base64.b64decode(s["data"]["password"])==b"abcdefghijklmnop"; print("smtp: app password sealed for monitoring")'
          # grafana: admin + a random password, bound to the monitoring namespace
          mkdir -p "$d/grafana"
          GRAFANA_SECRETS_DIR="$d/grafana" tools/seal-secrets.sh homelab grafana
          unseal "$d/grafana/grafana-admin.sealed.yaml" | python3 -c 'import base64,json,sys; s=json.load(sys.stdin); assert s["metadata"]["namespace"]=="monitoring"; assert base64.b64decode(s["data"]["admin-user"])==b"admin"; assert len(base64.b64decode(s["data"]["admin-password"]))==32; print("grafana: admin login sealed for monitoring")'

  oracle-fresh:
    name: legacy oracle is fresh
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/legacy-oracle/package-lock.json
      - name: Install oracle dependencies
        working-directory: tools/legacy-oracle
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Synthetic fixtures match the generator
        run: make fixtures-check
      - name: Regenerate legacy expectations
        run: make oracle
      - name: No drift
        run: |
          git add -A -N testdata
          git diff --exit-code --stat -- testdata || { echo "::error::make oracle changed testdata/ — run it locally and commit the result"; exit 1; }

  web:
    name: web (React)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint (ESLint + Prettier)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle size (initial JS ≤ 250 KB gzip, PLAN §7.12)
        run: |
          set -euo pipefail
          {
            echo '### Web bundle'; echo
            echo '| file | raw | gzip |'; echo '|---|---:|---:|'
            for f in dist/assets/*.js dist/assets/*.css; do
              echo "| $(basename "$f") | $(wc -c < "$f") | $(gzip -9c "$f" | wc -c) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          initial=0
          for f in $(grep -o 'assets/[^"]*\.js' dist/index.html); do
            initial=$((initial + $(gzip -9c "dist/$f" | wc -c)))
          done
          echo "initial JS: $initial bytes gzip" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$initial" -le 256000 || { echo "::error::initial JS exceeds 250 KB gzip"; exit 1; }

  e2e:
    name: e2e (Playwright on Compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies and Chromium
        working-directory: web
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Build, start compose.ci.yaml, run Playwright
        env:
          CI: "true"
        run: make test-e2e KEEP=1
      - name: Compose logs
        if: failure()
        run: docker compose --env-file .env -f deploy/compose/compose.yaml -f deploy/compose/compose.ci.yaml logs --tail=200
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screenshots-and-parity
          path: |
            web/screenshots
            docs/parity-report.md
          retention-days: 30
