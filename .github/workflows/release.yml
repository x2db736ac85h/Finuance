# Release (PLAN §8.5, task 14.7): a tag vX.Y.Z (or vX.Y.Z-rc.N) builds the backend and web images for
# amd64 and arm64, pushes them to GHCR, scans them with Trivy (HIGH or CRITICAL fails the release, Phase 17), attaches
# an SPDX SBOM and SLSA build provenance (Phase 22), signs images and SBOM attestations keylessly with
# cosign, and publishes a GitHub release with the notes from CHANGELOG.md, the files for
# compose.prod.yaml and the fin command line for Linux, macOS and Windows (amd64, arm64) with a
# checksum file.
#
# Only GitHub's own actions, pinned by commit SHA: buildx cross-compiles (the Dockerfiles build on
# the runner's platform, so no QEMU), Trivy is the checksum-verified binary of tools/bin-tools.sh,
# cosign and syft are installed with `go install` at pinned versions (verified by the Go checksum
# database). Each job has only the permissions it uses, and values reach the scripts through `env:`,
# never as `${{ }}` inside a script (PLAN task 22.5).
#
# The release job runs in the `release` environment: a required reviewer there (repository
# settings, register OPS-5) approves every release before anything is signed or pushed.
#
# Tag a commit whose message doesn't contain [skip ci] (or [ci skip], [no ci], …) anywhere, the body
# included: GitHub skips every push-triggered workflow for such a commit, the tag push included, so
# the release would never start.
#
# GitOps (PLAN 16.4): a final release (not an rc) then opens a pull request that sets the image tag
# in deploy/environments/homelab/values.yaml. Merging it deploys (Argo CD syncs main); reverting it
# rolls back. Needs "Allow GitHub Actions to create and approve pull requests" in the repository's
# Actions settings. A pull request opened with GITHUB_TOKEN doesn't start CI by itself; the
# description says so (close and reopen it, or push to its branch, to run the checks).
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/x2db736ac85h
  # renovate: datasource=go depName=github.com/sigstore/cosign/v3
  COSIGN_VERSION: v3.1.3
  # renovate: datasource=go depName=github.com/anchore/syft
  SYFT_VERSION: v1.54.1
  # renovate: datasource=go depName=github.com/mikefarah/yq/v4
  YQ_VERSION: v4.54.1
  # the identity that signs releases: this workflow, run for a version tag
  SIGNER: ^https://github\.com/x2db736ac85h/Finuance/\.github/workflows/release\.yml@refs/tags/v[0-9]

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write # the GitHub release
      packages: write # GHCR
      id-token: write # cosign keyless signing and the provenance attestation (Sigstore OIDC)
      attestations: write # the provenance attestation
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Version
        id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "::error::tag $tag is not vX.Y.Z or vX.Y.Z-rc.N"; exit 1; }
          version="${tag#v}" prerelease=false
          [[ "$tag" == *-rc.* ]] && prerelease=true
          { echo "version=$version"; echo "prerelease=$prerelease"; } >> "$GITHUB_OUTPUT"
          { echo "VERSION=$version"; echo "PRERELEASE=$prerelease"; echo "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; } >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        run: |
          base="${VERSION%%-rc.*}"
          # the section "## [X.Y.Z]" (a release candidate uses its final version's section)
          awk -v want="## [$base]" 'index($0, want) == 1 { on = 1; next } on && /^## \[/ { exit } on { print }' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section [$base]"; exit 1; }
          cat notes.md

      - name: Tools (cosign, syft, trivy)
        run: |
          go install "github.com/sigstore/cosign/v3/cmd/cosign@${COSIGN_VERSION}"
          go install "github.com/anchore/syft/cmd/syft@${SYFT_VERSION}"
          tools/bin-tools.sh trivy
          cosign version
          syft version
          backend/bin/trivy --version

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Builder
        run: docker buildx create --name release --driver docker-container --use

      - name: Build and push (linux/amd64, linux/arm64)
        run: |
          set -euo pipefail
          latest=()
          [[ "$PRERELEASE" == "false" ]] && latest=(--tag "$REGISTRY/finuance-api:latest")
          docker buildx build --platform linux/amd64,linux/arm64 --file deploy/docker/Dockerfile.backend \
            --build-arg VERSION="$VERSION" --build-arg COMMIT="$GITHUB_SHA" --build-arg DATE="$DATE" \
            --label org.opencontainers.image.version="$VERSION" --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --tag "$REGISTRY/finuance-api:$VERSION" "${latest[@]}" --metadata-file api.json --push .
          latest=()
          [[ "$PRERELEASE" == "false" ]] && latest=(--tag "$REGISTRY/finuance-web:latest")
          docker buildx build --platform linux/amd64,linux/arm64 --file deploy/docker/Dockerfile.web \
            --label org.opencontainers.image.version="$VERSION" --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --tag "$REGISTRY/finuance-web:$VERSION" "${latest[@]}" --metadata-file web.json --push .
          api="$(jq -r '."containerimage.digest"' api.json)" web="$(jq -r '."containerimage.digest"' web.json)"
          { echo "API_DIGEST=$api"; echo "WEB_DIGEST=$web"; echo "API=$REGISTRY/finuance-api@$api"; echo "WEB=$REGISTRY/finuance-web@$web"; } >> "$GITHUB_ENV"

      # The images are public; Trivy reads them from the registry, without the Docker socket.
      - name: Trivy (HIGH/CRITICAL fail the release)
        run: |
          for img in "$API" "$WEB"; do
            for platform in linux/amd64 linux/arm64; do
              backend/bin/trivy image --ignorefile .trivyignore --platform "$platform" --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress "$img"
            done
          done

      - name: SBOM, attestation and signature
        run: |
          set -euo pipefail
          syft scan "registry:$API" -o spdx-json=finuance-api.spdx.json
          syft scan "registry:$WEB" -o spdx-json=finuance-web.spdx.json
          cosign attest --yes --type spdxjson --predicate finuance-api.spdx.json "$API"
          cosign attest --yes --type spdxjson --predicate finuance-web.spdx.json "$WEB"
          cosign sign --yes "$API"
          cosign sign --yes "$WEB"

      - name: Build provenance (api)
        id: provenance-api
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/x2db736ac85h/finuance-api
          subject-digest: ${{ env.API_DIGEST }}
          push-to-registry: true
      - name: Build provenance (web)
        id: provenance-web
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/x2db736ac85h/finuance-web
          subject-digest: ${{ env.WEB_DIGEST }}
          push-to-registry: true

      # What a user runs (SECURITY.md, docs/deploying.md): the signature by this workflow for a
      # version tag, and the provenance attestation.
      - name: Verify the signatures and the provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for img in "$API" "$WEB"; do
            cosign verify "$img" --certificate-identity-regexp "$SIGNER" --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            gh attestation verify "oci://$img" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done

      - name: Smoke test the released images with compose.prod.yaml
        run: |
          set -euo pipefail
          cd deploy/compose
          sed -e "s/^FINUANCE_VERSION=.*/FINUANCE_VERSION=$VERSION/" \
              -e "s|^FINUANCE_PUBLIC_ORIGIN=.*|FINUANCE_PUBLIC_ORIGIN=http://localhost:8000|" \
              -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" \
              -e "s/^FINUANCE_OWNER_PASSWORD=.*/FINUANCE_OWNER_PASSWORD=$(openssl rand -hex 24)/" \
              -e "s/^FINUANCE_APP_PASSWORD=.*/FINUANCE_APP_PASSWORD=$(openssl rand -hex 24)/" .env.prod.example > .env
          docker compose --env-file .env -f compose.prod.yaml up -d --wait
          curl -fsS http://localhost:8000/healthz
          # the api answers through nginx: an unknown login is a 401 problem
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/api/v1/auth/login -H 'Content-Type: application/json' \
            -H 'X-Finuance-Client: web' -d '{"email":"nobody@example.com","password":"wrong password here"}' || true)
          if [ "$code" != 401 ]; then docker compose --env-file .env -f compose.prod.yaml logs; echo "::error::login answered $code"; exit 1; fi
          docker compose --env-file .env -f compose.prod.yaml down -v

      - name: fin binaries (Linux, macOS, Windows; amd64, arm64) with checksums
        working-directory: backend
        run: |
          set -euo pipefail
          v="$VERSION"
          mkdir -p ../dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              name="fin_${v}_${os}_${arch}" ext=""
              [ "$os" = windows ] && ext=.exe
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$v" -o "../dist/$name/fin$ext" ./cmd/fin
              cp ../LICENSE "../dist/$name/"
              if [ "$os" = windows ]; then (cd ../dist && zip -qr "$name.zip" "$name"); else tar -C ../dist -czf "../dist/$name.tar.gz" "$name"; fi
            done
          done
          cd ../dist && sha256sum fin_*.tar.gz fin_*.zip > "fin_${v}_checksums.txt" && cat "fin_${v}_checksums.txt"
          # the checksum file is signed like the images (cosign verify-blob, SECURITY.md)
          cosign sign-blob --yes --bundle "fin_${v}_checksums.txt.sigstore.json" "fin_${v}_checksums.txt" >/dev/null
          "../dist/fin_${v}_linux_amd64/fin" version | grep -qx "fin $v"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVENANCE_API: ${{ steps.provenance-api.outputs.bundle-path }}
          PROVENANCE_WEB: ${{ steps.provenance-web.outputs.bundle-path }}
        run: |
          pre=()
          [[ "$PRERELEASE" == "true" ]] && pre=(--prerelease)
          {
            cat notes.md
            echo
            echo "### Images"
            echo
            echo "- \`$API\`"
            echo "- \`$WEB\`"
            echo
            echo "Signed with cosign (keyless) by this repository's release workflow, with an SBOM and SLSA build provenance attached. Verify with:"
            echo
            echo '```sh'
            echo "cosign verify $API --certificate-identity-regexp '$SIGNER' --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "gh attestation verify oci://$API --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml"
            echo '```'
            echo
            echo "### fin (command line)"
            echo
            echo "\`fin_${VERSION}_<os>_<arch>\` for Linux, macOS and Windows (amd64, arm64); check the download against \`fin_${VERSION}_checksums.txt\`, whose signature \`cosign verify-blob --bundle fin_${VERSION}_checksums.txt.sigstore.json --certificate-identity-regexp '$SIGNER' --certificate-oidc-issuer https://token.actions.githubusercontent.com fin_${VERSION}_checksums.txt\` checks. Make a token in Settings → Access tokens, then \`fin login --url https://…\` (docs/cli.md)."
          } > release.md
          # GitHub drops a leading dot from asset names (".env.prod.example" became "default.env.prod.example")
          cp deploy/compose/compose.prod.yaml .
          cp deploy/compose/.env.prod.example finuance.env.example
          # the provenance bundles travel with the release too, next to the SBOMs
          cp "$PROVENANCE_API" finuance-api.intoto.jsonl
          cp "$PROVENANCE_WEB" finuance-web.intoto.jsonl
          files=(compose.prod.yaml finuance.env.example finuance-api.spdx.json finuance-web.spdx.json finuance-api.intoto.jsonl finuance-web.intoto.jsonl
            dist/fin_*.tar.gz dist/fin_*.zip dist/fin_*_checksums.txt dist/fin_*_checksums.txt.sigstore.json)
          title="Finuance $VERSION"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # created by hand in the GitHub web UI (which also creates the tag), or a re-run
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file release.md \
              --prerelease="$PRERELEASE" --draft=false
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${pre[@]}" --title "$title" --notes-file release.md "${files[@]}"
          fi

  gitops-bump:
    needs: release
    if: needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the bump branch
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] this job pushes the bump branch with the checkout's credentials
          ref: main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Pull request bumping the homelab image tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          go install "github.com/mikefarah/yq/v4@${YQ_VERSION}"
          YQ="$(go env GOPATH)/bin/yq"
          export YQ
          tools/bump-homelab-tag.sh "$V"
          if git diff --quiet; then echo "homelab already runs $V"; exit 0; fi
          branch="deploy/homelab-v$V"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(deploy): homelab to v$V"
          git push -u origin "$branch"
          {
            echo "Deploys **v$V** to the homelab: Argo CD syncs \`main\` once this is merged (migrations run first)."
            echo
            echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v$V"
            echo "- Rollback: revert this pull request (docs/RUNBOOK.md \"Rollback\"; a migration is not rolled back)."
            echo
            echo "Opened by release.yml with the workflow token, so CI doesn't start on its own: close and reopen the pull request to run it."
          } > body.md
          gh pr create --base main --head "$branch" --title "chore(deploy): homelab to v$V" --body-file body.md
