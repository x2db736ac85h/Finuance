name: Weekly

# The slower checks (PLAN 17.5, 17.6, 19.1): the OWASP ZAP scans, a k6 smoke test against the SLOs
# and the demo-mode E2E. Mondays and on demand; failures are annotations on the run.
on:
  schedule:
    - cron: "41 4 * * 1" # Mondays 04:41 UTC, after the k8s rehearsal
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zap:
    name: zap (baseline + API scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      # With the mock model server, as in CI's E2E: the assistant's operations are scanned working,
      # not answering 503 "no assistant connection is configured" (2026-11-09).
      - name: Start the stack
        env:
          COMPOSE_PROFILES: ai-mock
          FINUANCE_AI_BASE_URL: http://ai-mock:11434/v1
          FINUANCE_AI_DEFAULT_MODEL: mock-tools
        run: |
          (cd web && npm ci --no-audit --no-fund)
          make up
      - name: ZAP
        run: make zap
      - name: Findings as annotations
        if: always()
        run: |
          for f in zap-reports/baseline.json zap-reports/api.json; do
            [ -f "$f" ] || continue
            jq -r --arg f "$f" '.site[].alerts[] | "::notice title=ZAP \($f | sub(".*/"; "") | sub(".json"; "")) \(.pluginid)::\(.alert) (\(.riskdesc)), \(.instances | length) instance(s), e.g. \(.instances[0].method) \(.instances[0].uri)"' "$f"
          done
      # Server errors are bugs, so each one is named (reports can't be read from every session):
      # nginx's own error lines first (why it couldn't reach the api; GitHub shows only the first 10
      # warnings of a step), ZAP's instances, nginx's status per path (502/504 = the api didn't
      # answer) and the api's error lines (route, status, error kind; never bodies). Query strings
      # are cut.
      - name: Server errors as annotations
        if: always()
        run: |
          docker compose --env-file .env -f deploy/compose/compose.yaml logs --no-log-prefix web 2>/dev/null \
            | grep -E '\[(emerg|alert|crit|error)\]' | sed -E 's/^.*\[([a-z]+)\] [0-9#]+: (\*[0-9]+ )?/\1 /; s/, client:.*//; s/ to [0-9.:]+ / /' \
            | sort | uniq -c | sort -rn | head -10 | sed 's/^ */::error title=nginx error::/'
          for f in zap-reports/baseline.json zap-reports/api.json; do
            [ -f "$f" ] || continue
            jq -r '.site[].alerts[] | select(.alert | test("Server Error")) | .instances[] | "\(.method) \(.uri | sub("\\?.*"; ""))"' "$f"
          done | sort | uniq -c | sort -rn | head -30 | sed 's/^ */::warning title=ZAP 5xx::/'
          docker compose --env-file .env -f deploy/compose/compose.yaml logs --no-log-prefix web 2>/dev/null \
            | awk '$9 ~ /^5/ { sub(/\?.*/, "", $7); print $9, $6, $7 }' | tr -d '"' | sort | uniq -c | sort -rn | head -30 \
            | sed 's/^ */::warning title=nginx 5xx::/'
          docker compose --env-file .env -f deploy/compose/compose.yaml logs --no-log-prefix api worker 2>/dev/null \
            | grep -E 'level=(ERROR|WARN)' | sed -E 's/ (request_id|trace_id|client_ip|user)=[^ ]*//g; s/^time=[^ ]* //' \
            | sort | uniq -c | sort -rn | head -30 | sed 's/^ */::warning title=api log::/'
          docker compose --env-file .env -f deploy/compose/compose.yaml ps -a --format '{{.Service}} {{.State}} {{.Status}}' \
            | sed 's/^/::notice title=containers::/'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: zap-reports
          path: zap-reports
          retention-days: 30

  k6-smoke:
    name: k6 smoke (SLO thresholds)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      # finuance-sim seeds the animals the load test signs in as (ADR 0044)
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # a lab, so the load test's users are the simulator's animals (ADR 0044)
      - name: Start the stack as a lab and give 5 animals their history
        env:
          FINUANCE_SIMULATION: "true"
        run: |
          (cd web && npm ci --no-audit --no-fund)
          make up
          make loadtest-seed LOADTEST_USERS=5 LOADTEST_ROWS=5000
      - name: k6 (profile smoke)
        run: make loadtest PROFILE=smoke LOADTEST_USERS=5
      - name: Summary
        if: always()
        run: |
          f=loadtest/results/summary-smoke.json
          [ -f "$f" ] || exit 0
          jq -r '"p95 of the SLO routes: \(.metrics["http_req_duration{slo:latency}"]["p(95)"] | floor) ms, failed: \(.metrics["http_req_failed{slo:latency}"].value * 100) %"' "$f" | tee -a "$GITHUB_STEP_SUMMARY" | sed 's/^/::notice title=k6 smoke::/'

  demo-e2e:
    name: demo-mode E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 22, not 26: Playwright 1.56.1's browser install hangs under Node 26 (microsoft/playwright#40724;
          # running it works). Until Playwright moves (docs/PROGRESS.md, Follow-ups).
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies and Chromium
        working-directory: web
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Build, start compose.ci.yaml + compose.demo.yaml, run the demo specs
        env:
          CI: "true"
        run: make test-e2e-demo
