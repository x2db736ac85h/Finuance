# gitleaks: the default rules, plus one allowlisted file.
title = "Finuance"

[extend]
useDefault = true

[[allowlists]]
description = "Generated OpenAPI server: oapi-codegen embeds the spec as gzip+base64 chunks, which can look like API keys. Its source, api/openapi.yaml, is scanned as usual."
paths = ['''^backend/internal/httpapi/gen/gen\.go$''']

[[allowlists]]
description = "SealedSecrets: encryptedData is ciphertext that only the cluster's controller can decrypt (docs/RUNBOOK.md \"Secrets\"). The homelab's now live in the private environment repository; the history still has them, and CI's sealing round trip writes some. tools/check-sealed.sh (make check) makes sure every file with this name is a SealedSecret without plain data."
paths = ['''\.sealed\.yaml$''']
