        bookedOn:
          type: string
          format: date
        valueOn:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/Money"
        balanceAfter:
          $ref: "#/components/schemas/Money"
        payee:
          type: string
        description:
          type: string
        reference:
          type: string
        txType:
          type: string
        bankCategory:
          type: string
        counterpartyAccount:
          type: string
    DuplicateDecision:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [prefer, keep_both]
        importId:
          type: string
          format: uuid
          description: The import to use (prefer only).
    DemoData:
      type: object
      additionalProperties: false
      required: [accountId, importId, transactions]
      properties:
        accountId:
          type: string
          format: uuid
        importId:
          type: string
          format: uuid
        transactions:
          type: integer
    InsightRequest:
      type: object
      additionalProperties: false
      required: [context]
      properties:
        context:
          $ref: "#/components/schemas/QueryContext"
    PaceRequest:
      type: object
      additionalProperties: false
      required: [context, compare]
      properties:
        context:
          $ref: "#/components/schemas/QueryContext"
        compare:
          type: string
          enum: [prev, yoy, avg3, avg6, none]
    PayeesRequest:
      type: object
      additionalProperties: false
      required: [context, top, scope]
      properties:
        context:
          $ref: "#/components/schemas/QueryContext"
        top:
          type: integer
          enum: [0, 10, 25, 50, 100]
          description: How many payees; 0 = all.
        scope:
          type: string
          enum: [period, all]
          description: "`period`: the rows shown; `all`: all time (filters still apply)."
    DailyRequest:
      type: object
      additionalProperties: false
      required: [context, range]
      properties:
        context:
          $ref: "#/components/schemas/QueryContext"
        range:
          type: string
          enum: [period, 3m, 6m, 12m, all]
    LargestExpense:
      type: object
      additionalProperties: false
      required: [id, bookedOn, amountMinor, payee]
      properties:
        id:
          type: string
          format: uuid
        bookedOn:
          type: string
          format: date
        amountMinor:
          type: integer
          format: int64
          description: Negative.
        payee:
          type: string
          description: The payee group.
    InsightSummary:
      type: object
      additionalProperties: false
      required: [currency, count, spentMinor, incomeMinor, netMinor, days, avgPerDayMinor]
      properties:
        period:
          $ref: "#/components/schemas/ResolvedPeriod"
        currency:
          type: string
          description: The most common currency of the context's accounts (empty without accounts).
        count:
          type: integer
          format: int64
        spentMinor:
          type: integer
          format: int64
          description: Sum of −amount over expenses (≥ 0).
        incomeMinor:
          type: integer
          format: int64
        netMinor:
          type: integer
          format: int64
        savingsRate:
          type: number
          format: double
          description: max(0, net / income); absent without income.
        days:
          type: integer
        avgPerDayMinor:
          type: integer
          format: int64
        largestExpense:
          $ref: "#/components/schemas/LargestExpense"
        prevSpentMinor:
          type: integer
          format: int64
          description: The previous period's spending; absent without a period.
        spentDelta:
          type: number
          format: double
          description: (spent − prev) / prev; absent without a period or previous spending.
    CategorySpend:
      type: object
      additionalProperties: false
      required: [spentMinor, share]
      properties:
        category:
          $ref: "#/components/schemas/NamedRef"
        spentMinor:
          type: integer
          format: int64
        share:
          type: number
          format: double
        colorSlot:
          type: integer
          minimum: 1
          maximum: 7
          description: Absent for categories beyond the 7 largest all-time spenders.
    InsightCategories:
      type: object
      additionalProperties: false
      required: [currency, totalMinor, categories]
      properties:
        currency:
          type: string
        totalMinor:
          type: integer
          format: int64
        categories:
          type: array
          description: Largest first; an entry without `category` is the uncategorised spending.
          items:
            $ref: "#/components/schemas/CategorySpend"
    MonthFlow:
      type: object
      additionalProperties: false
      required: [month, incomeMinor, expenseMinor, count, inPeriod]
      properties:
        month:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
        incomeMinor:
          type: integer
          format: int64
        expenseMinor:
          type: integer
          format: int64
          description: Money out as a positive number.
        count:
          type: integer
          format: int64
        inPeriod:
          type: boolean
    InsightCashflow:
      type: object
      additionalProperties: false
      required: [currency, months]
      properties:
        currency:
          type: string
        period:
          $ref: "#/components/schemas/ResolvedPeriod"
        months:
          type: array
          items:
            $ref: "#/components/schemas/MonthFlow"
    PaceCompare:
      type: object
      additionalProperties: false
      required: [mode, days, values]
      properties:
        mode:
          type: string
          enum: [prev, yoy, avg3, avg6]
        month:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
          description: prev and yoy only.
        months:
          type: integer
          description: avg3 and avg6 only; how many months the average has.
        days:
          type: integer
          description: Draw values up to this day.
        values:
          type: array
          minItems: 31
          maxItems: 31
          items:
            type: integer
            format: int64
    InsightPace:
      type: object
      additionalProperties: false
      required: [currency, current]
      properties:
        currency:
          type: string
        target:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
        daysInMonth:
          type: integer
        lastDay:
          type: integer
        current:
          type: array
          description: Cumulative spending by day of month (31 entries; empty without a target).
          items:
            type: integer
            format: int64
        compare:
          $ref: "#/components/schemas/PaceCompare"
    PayeeSpend:
      type: object
      additionalProperties: false
      required: [payee, spentMinor, count]
      properties:
        payee:
          type: string
        spentMinor:
          type: integer
          format: int64
        count:
          type: integer
          format: int64
    InsightPayees:
      type: object
      additionalProperties: false
      required: [currency, total, payees]
      properties:
        currency:
          type: string
        total:
          type: integer
          description: Payees with spending before the top-N cut.
        payees:
          type: array
          items:
            $ref: "#/components/schemas/PayeeSpend"
    DaySpend:
      type: object
      additionalProperties: false
      required: [date, spentMinor, count]
      properties:
        date:
          type: string
          format: date
        spentMinor:
          type: integer
          format: int64
        count:
          type: integer
          format: int64
    InsightDaily:
      type: object
      additionalProperties: false
      required: [currency, days]
      properties:
        currency:
          type: string
        from:
          type: string
          format: date
        to:
          type: string
          format: date
          description: Exclusive.
        days:
          type: array
          items:
            $ref: "#/components/schemas/DaySpend"
    OverviewRequest:
      type: object
      additionalProperties: false
      required: [context, months]
      properties:
        context:
          $ref: "#/components/schemas/QueryContext"
        month:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
          description: The month to show; absent = the latest month with data. A month outside the data is clamped to it.
        months:
          type: integer
          enum: [6, 12, 24, 36]
          description: How many months the cash-flow, savings-rate and balance cards cover (legacy ovMonths).
    Overview:
      type: object
      additionalProperties: false
      required: [currency]
      properties:
        currency:
          type: string
          description: The most common currency of the context's accounts.
        data:
          $ref: "#/components/schemas/OverviewData"
    MonthTotals:
      type: object
      additionalProperties: false
      required: [month, incomeMinor, expenseMinor, count]
      properties:
        month:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
        incomeMinor:
          type: integer
          format: int64
        expenseMinor:
          type: integer
          format: int64
          description: Money out as a positive number.
        count:
          type: integer
          format: int64
    OverviewData:
      type: object
      additionalProperties: false
      required: [month, prevMonth, firstMonth, lastMonth, dataMax, partial, elapsedDays, daysInMonth, current, previous,
        prevToDateMinor, avgMonths, months, categories, incomeSources, colorSlots, highlights, recurring, largest, weekday,
        balance, investment, yieldOnCost, fire]
      properties:
        month:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
        prevMonth:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
        firstMonth:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
          description: The first month with data (for the month selector).
        lastMonth:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
        dataMax:
          type: string
          format: date
          description: The latest booking date of the context's accounts.
        partial:
          type: boolean
          description: The month is the data's last and not complete (the month-in-progress flag).
        elapsedDays:
          type: integer
          description: Days of the month with data (all of them unless partial).
        daysInMonth:
          type: integer
        current:
          $ref: "#/components/schemas/MonthTotals"
        previous:
          $ref: "#/components/schemas/MonthTotals"
        prevToDateMinor:
          type: integer
          format: int64
          description: The previous month's spending up to the same day of month.
        projectedMinor:
          type: integer
          format: int64
          description: Partial months only - spending projected to the month's end.
        avgMonths:
          type: integer
          description: How many earlier months (up to 3) the averages and default budgets use.
        months:
          type: array
          description: The `months` setting's range ending at `month` (from the first month with data on), oldest first, every month listed.
          items:
            $ref: "#/components/schemas/MonthTotals"
        categories:
          type: array
          description: Budget rows in the card's order (budget, then spending, largest first).
          items:
            $ref: "#/components/schemas/BudgetRow"
        incomeSources:
          type: array
          description: The month's income per payee group, largest first.
          items:
            $ref: "#/components/schemas/PayeeSpend"
        colorSlots:
          type: array
          description: The categories owning a colour (the 7 largest all-time spenders); no `category` = uncategorised.
          items:
            $ref: "#/components/schemas/ColorSlot"
        highlights:
          type: array
          items:
            $ref: "#/components/schemas/Highlight"
        recurring:
          type: array
          description: Detected recurring payments, active first, then by yearly cost.
          items:
            $ref: "#/components/schemas/RecurringPayment"
        largest:
          type: array
          maxItems: 40
          description: The month's largest expenses, largest first.
          items:
            $ref: "#/components/schemas/OverviewExpense"
        weekday:
          type: array
          minItems: 7
          maxItems: 7
          description: Spending per weekday over the month and the two before it, Monday first.
          items:
            $ref: "#/components/schemas/WeekdaySpend"
        balance:
          $ref: "#/components/schemas/BalanceSeries"
        investment:
          $ref: "#/components/schemas/InvestmentSummary"
        yieldOnCost:
          $ref: "#/components/schemas/YieldOnCost"
        fire:
          $ref: "#/components/schemas/Fire"
    BudgetRow:
      type: object
      additionalProperties: false
      required: [name, curMinor, prevMinor, avg3Minor, budgetMinor, budgetIsDefault, status]
      properties:
        category:
          $ref: "#/components/schemas/NamedRef"
        name:
          type: string
          description: The category's name, or "(uncategorized)" (its budget is always the default).
        curMinor:
          type: integer
          format: int64
        prevMinor:
          type: integer
          format: int64
        avg3Minor:
          type: integer
          format: int64
          description: Average spending of up to three earlier months.
        budgetMinor:
          type: integer
          format: int64
        budgetIsDefault:
          type: boolean
          description: No budget set by hand; the default is the rounded 3-month average.
        status:
          type: string
          enum: [ok, ahead, over, none]
    ColorSlot:
      type: object
      additionalProperties: false
      required: [slot]
      properties:
        category:
          $ref: "#/components/schemas/NamedRef"
        slot:
          type: integer
          minimum: 1
          maximum: 7
    Highlight:
      type: object
      additionalProperties: false
      required: [kind, tone, amountMinor, otherMinor, pct, avgPct, days, of, months, count, category, payee, sameDays]
      description: One highlight sentence's facts; the client writes the sentence. Fields a kind doesn't use are 0 or empty.
      properties:
        kind:
          type: string
          enum: [projection, vsPrev, vsAverage, topCategory, categoryUp, categoryDown, savings, overspend, noIncome, noSpendDays,
            recurring, largest]
        tone:
          type: string
          enum: [info, up, down, good, warn]
        amountMinor:
          type: integer
          format: int64
        otherMinor:
          type: integer
          format: int64
        pct:
          type: number
          format: double
        avgPct:
          type: number
          format: double
        days:
          type: integer
        of:
          type: integer
        months:
          type: integer
        count:
          type: integer
        category:
          type: string
        payee:
          type: string
        month:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
          description: vsPrev only - the month compared with.
        sameDays:
          type: boolean
          description: vsPrev only - compared over the same days of month (partial months).
    RecurringPayment:
      type: object
      additionalProperties: false
      required: [payee, medianMinor, last, next, active, yearlyMinor, count, cadence]
      properties:
        payee:
          type: string
          description: The payee group.
        cadence:
          type: string
          enum: [monthly, weekly, yearly]
          description: >-
            How often it is charged. Monthly payments follow the legacy rules; weekly and yearly
            ones are found among the payee groups the monthly rules leave out.
        category:
          type: string
          description: The most frequent category; absent when uncategorised.
        medianMinor:
          type: integer
          format: int64
          description: The typical amount, positive.
        last:
          type: string
          format: date
        next:
          type: string
          format: date
        active:
          type: boolean
        yearlyMinor:
          type: integer
          format: int64
          description: The cost per year (12, 52 or 1 × the typical amount).
        count:
          type: integer
    OverviewExpense:
      type: object
      additionalProperties: false
      required: [id, bookedOn, payee, payeeGroup, amountMinor]
      properties:
        id:
          type: string
          format: uuid
        bookedOn:
          type: string
          format: date
        payee:
          type: string
          description: As the bank wrote it.
        payeeGroup:
          type: string
        category:
          $ref: "#/components/schemas/NamedRef"
        amountMinor:
          type: integer
          format: int64
          description: Negative.
    WeekdaySpend:
      type: object
      additionalProperties: false
      required: [totalMinor, days]
      properties:
        totalMinor:
          type: integer
          format: int64
        days:
          type: integer
          description: How many of these weekdays the window has (for the average).
    BalanceSeries:
      type: object
      additionalProperties: false
      required: [openingMinor, nowMinor, points]
      description: The accounts' balance (opening balances plus every transaction, filters ignored).
      properties:
        openingMinor:
          type: integer
          format: int64
        nowMinor:
          type: integer
          format: int64
          description: After the last transaction.
        points:
          type: array
          description: The balance at the end of each day with transactions in the months' range.
          items:
            $ref: "#/components/schemas/BalancePoint"
    BalancePoint:
      type: object
      additionalProperties: false
      required: [date, balanceMinor]
      properties:
        date:
          type: string
          format: date
        balanceMinor:
          type: integer
          format: int64
    InvestmentRow:
      type: object
      additionalProperties: false
      required: [name, type, ppk, investedMinor, valueMinor, incomeMinor, allocationShare]
      properties:
        id:
          type: string
          format: uuid
          description: Absent for the PPK row.
        name:
          type: string
        type:
          type: string
        ppk:
          type: boolean
        investedMinor:
          type: integer
          format: int64
        valueMinor:
          type: integer
          format: int64
        incomeMinor:
          type: integer
          format: int64
        gainPercent:
          type: number
          format: double
          description: (value − invested) / invested; absent without money invested.
        allocationShare:
          type: number
          format: double
    InvestmentSummary:
      type: object
      additionalProperties: false
      required: [rows, investedMinor, valueMinor, incomeMinor, ppkPaidInMinor, ppkGainMinor, count]
      properties:
        rows:
          type: array
          description: PPK first, then the positions.
          items:
            $ref: "#/components/schemas/InvestmentRow"
        investedMinor:
          type: integer
          format: int64
        valueMinor:
          type: integer
          format: int64
        incomeMinor:
          type: integer
          format: int64
        ppkPaidInMinor:
          type: integer
          format: int64
        ppkGainMinor:
          type: integer
          format: int64
        ppkReturnOnOwn:
          type: number
          format: double
          description: (value − own contributions) / own contributions; absent without own contributions.
        gainPercent:
          type: number
          format: double
        count:
          type: integer
          description: Positions (PPK not counted).
    YieldRow:
      type: object
      additionalProperties: false
      required: [id, name, investedMinor, incomeMinor, yield]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        investedMinor:
          type: integer
          format: int64
        incomeMinor:
          type: integer
          format: int64
        yield:
          type: number
          format: double
    YieldOnCost:
      type: object
      additionalProperties: false
      required: [positions, investedMinor, incomeMinor, detectedMinor, usesDetected]
      properties:
        positions:
          type: array
          items:
            $ref: "#/components/schemas/YieldRow"
        investedMinor:
          type: integer
          format: int64
        incomeMinor:
          type: integer
          format: int64
        detectedMinor:
          type: integer
          format: int64
          description: Dividends and interest found in the transactions of the 12 months up to the month.
        usesDetected:
          type: boolean
          description: No income entered by hand, so the detected income is used.
        total:
          type: number
          format: double
    Fire:
      type: object
      additionalProperties: false
      required: [months, annualExpensesMinor, yearlySavingsMinor, fiNumberMinor, assetsMinor, swrBp, realReturnBp, progress, years, reachable]
      properties:
        months:
          type: integer
          description: How many months (up to 12) the annual figures come from.
        annualExpensesMinor:
          type: integer
          format: int64
        yearlySavingsMinor:
          type: integer
          format: int64
        fiNumberMinor:
          type: integer
          format: int64
        assetsMinor:
          type: integer
          format: int64
        swrBp:
          type: integer
        realReturnBp:
          type: integer
        progress:
          type: number
          format: double
        years:
          type: integer
          description: Years to FI; 0 when reached.
        reachable:
          type: boolean
          description: False when FI isn't reached within 100 years.
    Budget:
      type: object
      additionalProperties: false
      required: [category, amountMinor]
      properties:
        category:
          $ref: "#/components/schemas/NamedRef"
        amountMinor:
          type: integer
          format: int64
    BudgetList:
      type: object
      additionalProperties: false
      required: [budgets]
      properties:
        budgets:
          type: array
          items:
            $ref: "#/components/schemas/Budget"
    BudgetInput:
      type: object
      additionalProperties: false
      required: [amountMinor]
      properties:
        amountMinor:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: The monthly limit; null resets to the default budget.
    PPK:
      type: object
      additionalProperties: false
      required: [employeeMinor, employerMinor, stateMinor, valueMinor]
      description: Pracownicze Plany Kapitałowe (the Polish employee capital plan).
      properties:
        employeeMinor:
          type: integer
          format: int64
          minimum: 0
        employerMinor:
          type: integer
          format: int64
          minimum: 0
        stateMinor:
          type: integer
          format: int64
          minimum: 0
        valueMinor:
          type: integer
          format: int64
          minimum: 0
    InvestmentPosition:
      type: object
      additionalProperties: false
      required: [id, name, type, investedMinor, valueMinor, annualIncomeMinor]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        type:
          type: string
          maxLength: 30
          description: Free text (suggestions ETF, stock, bond, deposit, crypto, other).
        investedMinor:
          type: integer
          format: int64
          minimum: 0
        valueMinor:
          type: integer
          format: int64
          minimum: 0
        annualIncomeMinor:
          type: integer
          format: int64
          minimum: 0
    AssistantStatus:
      type: object
      additionalProperties: false
      required: [enabled, connections, maxRowsLimit]
      properties:
        enabled:
          type: boolean
        connections:
          type: array
          items:
            $ref: "#/components/schemas/AssistantConnection"
        maxRowsLimit:
          type: integer
          description: The highest number of rows one lookup may return (legacy maxRows).
          example: 50
    AssistantConnection:
      type: object
      additionalProperties: false
      required: [name, label, api, cloud, reachable, models]
      properties:
        name:
          type: string
          example: lmstudio
        label:
          type: string
          example: LM Studio (homelab)
        api:
          type: string
          enum: [openai, anthropic]
        cloud:
          type: boolean
          description: A cloud service; the user must agree once before their data is sent to it.
        reachable:
          type: boolean
        defaultModel:
          type: string
          description: The model used when none is chosen; absent when the server offers none.
        models:
          type: array
          items:
            $ref: "#/components/schemas/AssistantModel"
        error:
          $ref: "#/components/schemas/AssistantError"
    AssistantModel:
      type: object
      additionalProperties: false
      required: [id, tools, reasoning, contextTokens]
      properties:
        id:
          type: string
          example: qwen3-14b
        tools:
          type: boolean
          description: Whether the model is sent tool definitions (otherwise plan mode).
        reasoning:
          type: string
          enum: [none, effort, budget, switch]
          description: How thinking is controlled (none = no control; the model may still reason).
        contextTokens:
          type: integer
    AssistantError:
      type: object
      additionalProperties: false
      required: [kind, message]
      properties:
        kind:
          type: string
          enum: [unreachable, auth, tools_rejected, context_too_long, rate_limited, model_not_found, timeout, bad_response, upstream]
          x-enum-varnames: [AIUnreachable, AIAuth, AIToolsRejected, AIContextTooLong, AIRateLimited, AIModelNotFound, AITimeout, AIBadResponse, AIUpstream]
        message:
          type: string
          description: A short explanation (the server's own message, clipped).
    AssistantSettings:
      type: object
      additionalProperties: false
      required: [retentionDays, cloudConsent]
      properties:
        retentionDays:
          type: integer
          nullable: true
          minimum: 1
          maximum: 7
          description: Days a chat is kept after its last message; null keeps chats until they are deleted.
        cloudConsent:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 40
          description: Names of the cloud connections the user agreed to send their data to.
    AssistantChat:
      type: object
      additionalProperties: false
      required: [id, title, connection, model, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: The first question ("" before it).
        connection:
          type: string
        model:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AssistantChatList:
      type: object
      additionalProperties: false
      required: [chats, maxChats]
      properties:
        chats:
          type: array
          items:
            $ref: "#/components/schemas/AssistantChat"
        maxChats:
          type: integer
    AssistantChatDetail:
      type: object
      additionalProperties: false
      required: [id, title, connection, model, createdAt, updatedAt, noTools, turns, appliedProposals]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        connection:
          type: string
        model:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        noTools:
          type: boolean
          description: Auto mode switched this chat to plan mode.
        turns:
          type: array
          items:
            $ref: "#/components/schemas/AssistantTurn"
        appliedProposals:
          type: array
          description: The keys of this chat's proposals the user has applied (from the activity log).
          items:
            type: string
    AssistantTurn:
      type: object
      additionalProperties: false
      required: [role, seq, content, createdAt]
      description: A question (`user`) or an answer (`assistant`) with its lookups.
      properties:
        role:
          type: string
          enum: [user, assistant]
        seq:
          type: integer
          description: The sequence number of the turn's last message.
        content:
          type: string
        reasoning:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/AssistantStep"
        meta:
          $ref: "#/components/schemas/AssistantMeta"
        error:
          $ref: "#/components/schemas/AssistantTurnError"
        createdAt:
          type: string
          format: date-time
    AssistantStep:
      type: object
      additionalProperties: false
      required: [tool, args, summary, result]
      properties:
        tool:
          type: string
        args:
          type: object
          additionalProperties: true
          description: The arguments as the model sent them.
        summary:
          type: string
        result:
          type: string
          description: The JSON the model received (cut at 6,000 characters for display).
        truncated:
          type: boolean
        matched:
          type: integer
        toolFilter:
          $ref: "#/components/schemas/ToolFilter"
        proposal:
          $ref: "#/components/schemas/ActionProposal"
    ActionProposal:
      type: object
      additionalProperties: false
      description: >-
        A change propose_action suggests (PLAN 15.7, ADR 0019). The server never applies it; the
        panel shows it with the affected rows and applies it through the normal endpoints when the
        user confirms. A missing categoryId / groupId means the category or group is created first.
      required: [key, action, matched, sample]
      properties:
        key:
          type: string
          description: >-
            Identifies the proposal within its chat (a hash of its content); sent back as
            X-Assistant-Proposal when it is applied.
        action:
          type: string
          enum: [set_category, set_group, create_rule]
        reason:
          type: string
        matched:
          type: integer
          description: The transactions it changes (set_*) or the rule matches now (create_rule).
        ids:
          type: array
          maxItems: 1000
          description: "set_*: the transactions, read when it was proposed."
          items:
            type: string
            format: uuid
        categoryName:
          type: string
        categoryId:
          type: string
          format: uuid
        groupName:
          type: string
        groupId:
          type: string
          format: uuid
        ruleName:
          type: string
        match:
          $ref: "#/components/schemas/RuleMatch"
        sample:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/ProposalRow"
        toolFilter:
          $ref: "#/components/schemas/ToolFilter"
    ProposalRow:
      type: object
      additionalProperties: false
      required: [id, bookedOn, payee, amount]
      properties:
        id:
          type: string
          format: uuid
        bookedOn:
          type: string
          format: date
        payee:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        category:
          type: string
    AssistantMeta:
      type: object
      additionalProperties: false
      required: [durationMs, approxTokensSent, lookups, rounds, connection, model, mode, scope]
      properties:
        durationMs:
          type: integer
          format: int64
        approxTokensSent:
          type: integer
        lookups:
          type: integer
        rounds:
          type: integer
        connection:
          type: string
        model:
          type: string
        mode:
          type: string
          enum: [tools, plan]
        fallback:
          type: boolean
          description: Auto mode switched to plan mode during this turn.
        stopped:
          type: boolean
        scope:
          type: string
          enum: [all, view]
        accountIds:
          type: array
          items:
            type: string
            format: uuid
        inputTokens:
          type: integer
        outputTokens:
          type: integer
    AssistantTurnError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: An assistant error kind (`unreachable`, `auth`, `tools_rejected`, `context_too_long`, `rate_limited`, `model_not_found`, `timeout`, `bad_response`, `upstream`) or `internal`.
        message:
          type: string
    AssistantMessageRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
        scope:
          type: string
          enum: [all, view]
          default: all
        context:
          $ref: "#/components/schemas/QueryContext"
        timeZone:
          type: string
          maxLength: 64
          description: The browser's IANA time zone, for "today" (default Europe/Warsaw).
          example: Europe/Warsaw
        settings:
          $ref: "#/components/schemas/AssistantRunSettings"
    AssistantRunSettings:
      type: object
      additionalProperties: false
      properties:
        connection:
          type: string
          maxLength: 40
          description: Default the chat's connection, else the first one.
        model:
          type: string
          maxLength: 200
          description: Default the chat's model, else the connection's default.
        mode:
          type: string
          enum: [auto, tools, plan]
        think:
          type: string
          enum: [off, auto, low, medium, high]
        maxRows:
          type: integer
          minimum: 1
          maximum: 50
        temperature:
          type: number
          format: double
          minimum: 0
          maximum: 2
        toolset:
          type: string
          enum: [full, compact]
    AssistantDeltaEvent:
      type: object
      required: [delta]
      properties:
        delta:
          type: string
    AssistantStepEvent:
      allOf:
        - $ref: "#/components/schemas/AssistantStep"
        - type: object
          required: [index]
          properties:
            index:
              type: integer
    AssistantModeEvent:
      type: object
      required: [mode, reason]
      properties:
        mode:
          type: string
          enum: [plan]
        reason:
          type: string
    AssistantDoneEvent:
      type: object
      required: [messageSeq, meta]
      properties:
        messageSeq:
          type: integer
        meta:
          $ref: "#/components/schemas/AssistantMeta"
    AssistantErrorEvent:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        messageSeq:
          type: integer
    Investments:
      type: object
      additionalProperties: false
      required: [version, ppk, swrBp, realReturnBp, positions]
      properties:
        version:
          type: integer
          format: int32
          minimum: 0
        ppk:
          $ref: "#/components/schemas/PPK"
        swrBp:
          type: integer
          minimum: 50
          maximum: 1000
          description: Safe withdrawal rate in basis points (400 = 4 %).
        realReturnBp:
          type: integer
          minimum: -1000
          maximum: 2000
          description: Expected real return in basis points.
        positions:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/InvestmentPosition"
    StaleInvestmentsProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [current]
          properties:
            current:
              $ref: "#/components/schemas/Investments"
    Money:
      type: object
      additionalProperties: false
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          format: int64
          description: Signed amount in minor units (grosze for PLN). Negative = money out.
          example: -4498
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 code.
          example: PLN
    LegacyImport:
      type: object
      additionalProperties: false
      required: [id, status, progress, createdAt]
      properties:
        id: {type: string, format: uuid}
        status:
          type: string
          enum: [queued, running, done, failed]
        progress:
          type: object
          additionalProperties: false
          required: [filesDone, filesTotal, step]
          x-go-type: legacyimport.Progress
          x-go-type-import:
            path: github.com/x2db736ac85h/finuance/backend/internal/legacyimport
          properties:
            filesDone: {type: integer}
            filesTotal: {type: integer}
            step: {type: string, description: "files | labels | settings | chats"}
            current: {type: string, description: The file being imported.}
        report: {$ref: "#/components/schemas/LegacyImportReport"}
        error: {type: string, description: Why a failed run stopped.}
        createdAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
    LegacyImportReport:
      type: object
      additionalProperties: false
      description: What a finished run did (PLAN §4.10 step 5).
      x-go-type: legacyimport.Report
      x-go-type-import:
        path: github.com/x2db736ac85h/finuance/backend/internal/legacyimport
      required: [files, accounts, transactions, groups, labels, overrides, budgets, investments, chats, unknownKeys]
      properties:
        files:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [legacyId, name, status, accountName, rows, new, duplicates, errors]
            properties:
              legacyId: {type: string}
              name: {type: string}
              status: {type: string, enum: [imported, reused, failed]}
              importId: {type: string, format: uuid}
              accountId: {type: string, format: uuid}
              accountName: {type: string}
              rows: {type: integer}
              new: {type: integer}
              duplicates: {type: integer, format: int64}
              errors: {type: integer, format: int64}
              message: {type: string}
        accounts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, created]
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              created: {type: boolean}
        transactions:
          type: object
          additionalProperties: false
          required: [new, duplicates, errors]
          properties:
            new: {type: integer}
            duplicates: {type: integer, format: int64}
            errors: {type: integer, format: int64}
        groups:
          type: object
          additionalProperties: false
          required: [created, reused]
          properties:
            created: {type: integer}
            reused: {type: integer}
        labels: {$ref: "#/components/schemas/LegacyMatchReport"}
        overrides: {$ref: "#/components/schemas/LegacyMatchReport"}
        budgets:
          type: object
          additionalProperties: false
          required: [set, skipped]
          properties:
            set: {type: integer}
            skipped: {type: array, items: {type: string}}
        opening:
          type: object
          additionalProperties: false
          required: [accountId, accountName, amountMinor]
          properties:
            accountId: {type: string, format: uuid}
            accountName: {type: string}
            amountMinor: {type: integer, format: int64}
        investments: {type: string, enum: [imported, kept, none]}
        chats:
          type: object
          additionalProperties: false
          required: [imported, skipped]
          properties:
            imported: {type: integer}
            skipped: {type: integer}
        unknownKeys: {type: array, items: {type: string}}
    LegacyMatchReport:
      type: object
      additionalProperties: false
      required: [matched, unmatched, examples]
      properties:
        matched: {type: integer}
        unmatched: {type: integer}
        examples:
          type: array
          description: The first 50 legacy keys that found no transaction.
          items:
            type: object
            additionalProperties: false
            required: [what, key, reason]
            properties:
              what: {type: string, description: The group, or "keep both" / "use this version".}
              key: {type: string, description: The legacy key with its date as yyyy-mm-dd.}
              reason: {type: string}
    ProblemCode:
      type: string
      description: Stable machine-readable error code.
      enum:
        - validation_failed
        - unauthenticated
        - forbidden
        - not_found
        - conflict
        - duplicate_file
        - import_not_committable
        - stale_version
        - rate_limited
        - payload_too_large
        - unsupported_file
        - not_implemented
        - consent_required
        - run_in_progress
        - assistant_busy
        - assistant_unavailable
        - migration_running
        - limit_reached
        - password_change_required
        - account_disabled
        - last_admin
        - contrast_failed
        - display_name_required
        - internal
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          description: Dotted path of the offending field, e.g. `mapping.amount`.
        message:
          type: string
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: Relative URI reference `/problems/<code>`.
          example: /problems/validation_failed
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          example: 422
        code:
          $ref: "#/components/schemas/ProblemCode"
        detail:
          type: string
        instance:
          type: string
          description: Request path.
        requestId:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        limit:
          $ref: "#/components/schemas/ProblemLimit"
        contrast:
          type: array
          description: The colour pairs below 4.5:1 (`contrast_failed`).
          items:
            $ref: "#/components/schemas/ContrastFailure"
    Features:
      type: object
      additionalProperties: false
      description: Parts of the app the instance offers (an administrator can switch them off).
      required: [overview, assistant, friends, sharedGroups]
      properties:
        overview:
          type: boolean
        assistant:
          type: boolean
        friends:
          type: boolean
        sharedGroups:
          type: boolean
    ViewDefaults:
      type: object
      additionalProperties: false
      description: |
        The preferences a view starts from; the web app applies them under the user's own saved
        preferences, so only keys the user never saved take them (names as in `Preferences.prefs`).
      properties:
        themeId:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,31}$"
        theme:
          type: string
          enum: [system, dark, light]
        ui:
          type: string
          enum: [auto, "0.9", "1", "1.1", "1.2", "1.3"]
        noViz:
          type: boolean
          description: Insights pane hidden.
        sbOpen:
          type: boolean
        cards:
          type: array
          maxItems: 6
          items:
            type: string
            enum: [sum, cat, flow, pace, payee, heat]
        cardOrder:
          type: array
          maxItems: 6
          items:
            type: string
            enum: [sum, cat, flow, pace, payee, heat]
        importFastPath:
          type: boolean
    LimitOverrides:
      type: object
      additionalProperties: false
      description: Limits; a missing value means the next level decides (user → instance → the server's bound or none).
      properties:
        maxUploadBytes:
          type: integer
          format: int64
          minimum: 1024
        importsPerDay:
          type: integer
          format: int64
          minimum: 1
        maxAccounts:
          type: integer
          format: int64
          minimum: 1
        maxGroups:
          type: integer
          format: int64
          minimum: 1
        maxSharedGroups:
          type: integer
          format: int64
          minimum: 1
          description: Shared groups the user owns (archived ones don't count).
        assistantPerHour:
          type: integer
          format: int64
          minimum: 1
    EffectiveLimits:
      type: object
      additionalProperties: false
      description: The limits that apply to the signed-in user; 0 means no limit.
      required: [maxUploadBytes, importsPerDay, maxAccounts, maxGroups, maxSharedGroups, assistantPerHour]
      properties:
        maxUploadBytes:
          type: integer
          format: int64
        importsPerDay:
          type: integer
          format: int64
        maxAccounts:
          type: integer
          format: int64
        maxGroups:
          type: integer
          format: int64
        maxSharedGroups:
          type: integer
          format: int64
        assistantPerHour:
          type: integer
          format: int64
    InstanceSettingsDoc:
      type: object
      additionalProperties: false
      required: [version, defaults, features, limits]
      properties:
        version:
          type: integer
          format: int32
          minimum: 0
        defaults:
          $ref: "#/components/schemas/ViewDefaults"
        features:
          type: object
          additionalProperties: false
          description: Switches that are off; a missing one is on.
          properties:
            overview:
              type: boolean
            assistant:
              type: boolean
            friends:
              type: boolean
            sharedGroups:
              type: boolean
        limits:
          $ref: "#/components/schemas/LimitOverrides"
        updatedAt:
          type: string
          format: date-time
    UserUsage:
      type: object
      additionalProperties: false
      description: Counts of an account's data (never the data).
      required: [accounts, transactions, imports, storedBytes, chats]
      properties:
        accounts:
          type: integer
          format: int64
        transactions:
          type: integer
          format: int64
        imports:
          type: integer
          format: int64
        storedBytes:
          type: integer
          format: int64
        chats:
          type: integer
          format: int64
        lastActivity:
          type: string
          format: date-time
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, email, displayName, isDemo, isAdmin, disabled, mustChangePassword, createdAt, limits, usage]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        isDemo:
          type: boolean
        isAdmin:
          type: boolean
        disabled:
          type: boolean
        mustChangePassword:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
        limits:
          $ref: "#/components/schemas/LimitOverrides"
        usage:
          $ref: "#/components/schemas/UserUsage"
    UserTotals:
      type: object
      additionalProperties: false
      required: [users, admins, disabled, demo, active7, active30]
      properties:
        users:
          type: integer
          format: int64
        admins:
          type: integer
          format: int64
        disabled:
          type: integer
          format: int64
        demo:
          type: integer
          format: int64
        active7:
          type: integer
          format: int64
