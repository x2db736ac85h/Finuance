        name:
          type: string
        color:
          type: integer
        kind:
          type: string
          enum: [personal, trip, household, event, other]
        currency:
          type: string
        firstOn:
          type: string
          format: date
        lastOn:
          type: string
          format: date
        days:
          type: integer
        spentMinor:
          type: integer
          format: int64
        count:
          type: integer
          format: int64
        perDayMinor:
          type: integer
          format: int64
        budgetMinor:
          type: integer
          format: int64
        topCategory:
          $ref: "#/components/schemas/NamedSpend"
        topCategoryShare:
          type: number
          format: double
    TimelineYear:
      type: object
      additionalProperties: false
      required: [year, groups, spentMinor, days]
      properties:
        year:
          type: integer
        groups:
          type: integer
