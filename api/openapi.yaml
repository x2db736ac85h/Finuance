openapi: 3.0.3
info:
  title: Finuance API
  version: 0.0.0
  description: |
    Self-hosted personal finance for European bank CSV exports.

    Conventions (docs/PLAN.md §6.1): camelCase JSON; ids are UUID strings; dates are `YYYY-MM-DD`;
    timestamps are RFC 3339 UTC; money is `{amountMinor, currency}` in integer minor units.
    Errors are RFC 9457 `application/problem+json` with a stable `code`.
  license:
    name: MIT
    url: https://opensource.org/license/mit
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /meta:
    get:
      operationId: getMeta
      summary: Public instance information
      description: Unauthenticated. The web app reads it before login to decide which screens to show.
      tags: [meta]
      security: []
      responses:
        "200":
          description: Instance information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        default:
          $ref: "#/components/responses/Problem"
  /auth/signup:
    post:
      operationId: signup
      summary: Create an account and sign in
      description: |
        Disabled (`403 forbidden`) when `FINUANCE_ALLOW_SIGNUP` is false; use `finuance admin create-user`.
        Password: at least 12 characters, no composition rules. Rate-limited per IP and per (IP, email).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created; the session cookie is set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /auth/login:
    post:
      operationId: login
      summary: Sign in
      description: |
        A wrong password and an unknown email give the same `401` in the same time. Every login starts
        a new session; a session cookie sent with the request is revoked (rotation).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in; the session cookie is set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out
      description: Deletes the current session (if any) and clears the cookie. Always succeeds.
      tags: [auth]
      security: []
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
        default:
          $ref: "#/components/responses/Problem"
  /me:
    get:
      operationId: getMe
      summary: The signed-in user
      tags: [me]
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMe
      summary: Change the display name
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteMe
      summary: Delete the account and all of its data
      description: Needs the current password. Every account, import, transaction and setting is deleted.
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteMeRequest"
      responses:
        "204":
          description: Deleted; the cookie is cleared.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /me/password:
    post:
      operationId: changePassword
      summary: Change the password
      description: |
        Needs the current password. Every session of the user is revoked, including this one, and a
        new session cookie is set for this browser.
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Changed; a new session cookie is set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /me/sessions:
    get:
      operationId: listSessions
      summary: The user's active sessions
      tags: [me]
      responses:
        "200":
          description: Sessions, most recently used first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
  /me/sessions/{id}:
    delete:
      operationId: revokeSession
      summary: Sign out one session
      tags: [me]
      parameters:
        - name: id
          in: path
          required: true
          description: Session id from the list (first 8 bytes of the token hash, hex).
          schema:
            type: string
            pattern: "^[0-9a-f]{16}$"
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Problem"
  /me/export:
    get:
      operationId: exportMe
      summary: Download all of the user's data (Phase 7)
      description: A zip of every entity and the original import files. Returns `501 not_implemented` until Phase 7.
      tags: [me]
      responses:
        "200":
          description: Zip archive.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"
  /preferences:
    get:
      operationId: getPreferences
      summary: The user's UI preferences
      tags: [preferences]
      responses:
        "200":
          description: The document; version 0 and `{}` before the first save.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putPreferences
      summary: Replace the UI preferences
      description: |
        Optimistic concurrency: send the version you read (0 for the first save). A mismatch returns
        `409 stale_version` with the current document in `current`.
      tags: [preferences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Preferences"
      responses:
        "200":
          description: Saved; `version` is the new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "409":
          description: The stored version is not the one sent.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/StalePreferencesProblem"
        default:
          $ref: "#/components/responses/Problem"
  /accounts:
    get:
      operationId: listAccounts
      summary: The user's accounts
      description: Natural Polish order of names, with transaction counts and date ranges.
      tags: [accounts]
      responses:
        "200":
          description: Accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createAccount
      summary: Create an account
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Problem"
  /accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateAccount
      summary: Change an account
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAccount
      summary: Delete an account with its imports and transactions
      tags: [accounts]
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
  /imports:
    get:
      operationId: listImports
      summary: Imports, newest first
      tags: [imports]
      parameters:
        - name: accountId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Imports.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportSummary"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: uploadImport
      summary: Upload a bank export and get a preview
      description: |
        One CSV/TSV file per request, at most `FINUANCE_MAX_UPLOAD_BYTES` (20 MiB). Files with NUL bytes
        are refused (`415 unsupported_file`); identical bytes already imported give `409 duplicate_file`.
        A remembered profile for the file's layout is applied automatically (`mappingSource: profile`).
        With `autoCommit=true` a profile-matched, error-free file with a resolved account is committed
        right away (`202`); otherwise the preview is returned as usual (`201`).
      tags: [imports]
      parameters:
        - name: autoCommit
          in: query
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                accountId:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Previewed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        "202":
          description: Auto-committed (the commit job is running).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        "409":
          description: The same file was already imported.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DuplicateFileProblem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /imports/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getImport
      summary: One import
      tags: [imports]
      responses:
        "200":
          description: The import.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportDetail"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateImport
      summary: Change the account, mapping or options of a previewed import
      description: Re-reads the stored file with the new settings, re-stages it and returns the new preview.
      tags: [imports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportChanges"
      responses:
        "200":
          description: The new preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteImport
      summary: Delete an import (cancel a preview, or remove a committed import)
      description: Transactions that another import of the account also contains are kept.
      tags: [imports]
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
  /imports/{id}/rows:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listImportRows
      summary: Staged rows of an import
      tags: [imports]
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: onlyErrors
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: A page of rows in file order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRowPage"
        default:
          $ref: "#/components/responses/Problem"
  /imports/{id}/lines:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listImportLines
      summary: Decoded records of the file with their status (header-row picker)
      tags: [imports]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 18
      responses:
        "200":
          description: The first records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportLines"
        default:
          $ref: "#/components/responses/Problem"
  /imports/{id}/file:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getImportFile
      summary: The original file
      tags: [imports]
      responses:
        "200":
          description: The uploaded bytes.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"
  /imports/{id}/commit:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: commitImport
      summary: Commit a previewed import
      description: |
        Needs an account, the required columns and at least one valid row. The commit runs as a job;
        poll `GET /imports/{id}` until `committed` or `failed`. A second call gets `409 import_not_committable`.
      tags: [imports]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitRequest"
      responses:
        "202":
          description: Committing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportDetail"
        default:
          $ref: "#/components/responses/Problem"
  /imports/{id}/reprocess:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: reprocessImport
      summary: Re-read a committed import with a new mapping or options
      description: Manual edits survive wherever a transaction's fingerprint is unchanged.
      tags: [imports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportChanges"
      responses:
        "202":
          description: Committing again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportDetail"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: finuance_session
      description: |
        HttpOnly session cookie set by signup and login. Unsafe methods also need the header
        `X-Finuance-Client: web` and, when sent, an `Origin` equal to the instance origin (CSRF, §6.1).
  headers:
    SetSessionCookie:
      description: "`finuance_session=…; Path=/; HttpOnly; SameSite=Lax` (+ `Secure` outside dev). Max-Age=0 clears it."
      schema:
        type: string
    RetryAfter:
      description: Seconds until the request may be retried.
      schema:
        type: integer
  responses:
    TooManyRequests:
      description: Rate limit exceeded (`rate_limited`).
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Meta:
      type: object
      additionalProperties: false
      required: [version, signupEnabled, demoMode]
      properties:
        version:
          type: string
          description: Build version of the server.
          example: v0.1.0
        signupEnabled:
          type: boolean
          description: Whether new accounts can be created (`FINUANCE_ALLOW_SIGNUP`).
        demoMode:
          type: boolean
          description: Whether this is the public demo instance (`FINUANCE_DEMO_MODE`).
    User:
      type: object
      additionalProperties: false
      required: [id, email, displayName, isDemo, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          example: irwin@example.com
        displayName:
          type: string
          maxLength: 80
        isDemo:
          type: boolean
        createdAt:
          type: string
          format: date-time
    SignupRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          description: At least 12 characters, at most 1024 bytes.
        displayName:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
    UpdateMeRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    DeleteMeRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
    Session:
      type: object
      additionalProperties: false
      required: [id, createdAt, lastSeenAt, expiresAt, userAgent, current]
      properties:
        id:
          type: string
          description: First 8 bytes of the token hash, hex. Not a credential.
          example: 3f2a9c0d11e4b7a5
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          description: Updated at most every 5 minutes.
        expiresAt:
          type: string
          format: date-time
          description: Absolute expiry; the idle timeout may end the session earlier.
        userAgent:
          type: string
        ip:
          type: string
        current:
          type: boolean
          description: True for the session making this request.
    Preferences:
      type: object
      additionalProperties: false
      required: [version, prefs]
      properties:
        version:
          type: integer
          format: int32
          minimum: 0
        prefs:
          type: object
          additionalProperties: true
          x-go-type: json.RawMessage # generated code already imports encoding/json
          description: UI settings document (theme, cards, per-view state, …); the web app owns its shape. At most 256 KiB.
    StalePreferencesProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [current]
          properties:
            current:
              $ref: "#/components/schemas/Preferences"
    Account:
      type: object
      additionalProperties: false
      required: [id, name, currency, openingBalance, txCount, isDemo, archived, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        currency:
          type: string
        numberHint:
          type: string
          description: Last four digits of the account number.
        openingBalance:
          $ref: "#/components/schemas/Money"
        txCount:
          type: integer
          format: int64
        firstOn:
          type: string
          format: date
        lastOn:
          type: string
          format: date
        isDemo:
          type: boolean
        archived:
          type: boolean
        createdAt:
          type: string
          format: date-time
    AccountInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 80
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: Default PLN.
        numberHint:
          type: string
          pattern: "^([0-9]{4})?$"
        openingBalanceMinor:
          type: integer
          format: int64
        archived:
          type: boolean
    ColRef:
      type: object
      additionalProperties: false
      required: [index, header]
      properties:
        index:
          type: integer
          minimum: 0
        header:
          type: string
    Mapping:
      type: object
      additionalProperties: false
      description: Columns per canonical role (PLAN §4.3). An absent role is not mapped.
      x-go-type: ledger.MappingDoc
      x-go-type-import:
        path: github.com/x2db736ac85h/finuance/backend/internal/ledger
      properties:
        bookedOn: {$ref: "#/components/schemas/ColRef"}
        amount: {$ref: "#/components/schemas/ColRef"}
        payee: {$ref: "#/components/schemas/ColRef"}
        description: {$ref: "#/components/schemas/ColRef"}
        reference: {$ref: "#/components/schemas/ColRef"}
        category: {$ref: "#/components/schemas/ColRef"}
        currency: {$ref: "#/components/schemas/ColRef"}
        valueOn: {$ref: "#/components/schemas/ColRef"}
        txType: {$ref: "#/components/schemas/ColRef"}
        counterpartyAccount: {$ref: "#/components/schemas/ColRef"}
        ownAccount: {$ref: "#/components/schemas/ColRef"}
        balance: {$ref: "#/components/schemas/ColRef"}
        ignore:
          type: array
          items: {$ref: "#/components/schemas/ColRef"}
    ImportOptions:
      type: object
      additionalProperties: false
      description: How the file is read and staged (PLAN §4.3). headerRow is "auto", "none" or a 1-based record number.
      x-go-type: ledger.OptionsDoc
      x-go-type-import:
        path: github.com/x2db736ac85h/finuance/backend/internal/ledger
      properties:
        encoding:
          type: string
          enum: [auto, utf-8, windows-1250, iso-8859-2, windows-1252]
        delimiter:
          type: string
          enum: [auto, ";", ",", "\\t", "|"]
        headerRow:
          oneOf:
            - type: string
              enum: [auto, none]
            - type: integer
              minimum: 1
        skipRows:
          type: integer
          minimum: 0
        dropShort:
          type: boolean
        dateOrder:
          type: string
          enum: [dmy, mdy]
        stripQuote:
          type: boolean
        invertSign:
          type: boolean
        amountMode:
          type: string
          enum: [single, debit_credit]
        debitColumn: {$ref: "#/components/schemas/ColRef"}
        creditColumn: {$ref: "#/components/schemas/ColRef"}
        currencyFallback:
          type: string
    RawField:
      type: object
      additionalProperties: false
      required: [header, value]
      properties:
        header:
          type: string
        value:
          type: string
    StagedRow:
      type: object
      additionalProperties: false
      required: [rowIndex, payee, description, reference, txType, bankCategory, counterpartyAccount, raw, duplicate]
      properties:
        rowIndex:
          type: integer
          description: 0-based data row of the file.
        bookedOn:
          type: string
          format: date
        valueOn:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/Money"
        balance:
          $ref: "#/components/schemas/Money"
        payee:
          type: string
        description:
          type: string
        reference:
          type: string
        txType:
          type: string
        bankCategory:
          type: string
        counterpartyAccount:
          type: string
        raw:
          type: array
          items: {$ref: "#/components/schemas/RawField"}
        error:
          type: string
          description: Why the row can't be imported (it is never committed).
        duplicate:
          type: boolean
          description: Before the commit, the account already has this transaction; after it, the row merged into another import's transaction.
        transactionId:
          type: string
          format: uuid
    ImportStats:
      type: object
      additionalProperties: false
      required: [rows, errors, duplicatesEstimate, newEstimate, headerAt, dropped]
      properties:
        rows:
          type: integer
        errors:
          type: integer
        duplicatesEstimate:
          type: integer
        newEstimate:
          type: integer
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
        headerAt:
          type: integer
          description: 1-based record of the header row; 0 = no header.
        dropped:
          type: integer
          description: Short summary rows left out.
    ImportSummary:
      type: object
      additionalProperties: false
      required: [id, filename, sizeBytes, status, mappingSource, createdAt, stats]
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        filename:
          type: string
        sizeBytes:
          type: integer
        status:
          type: string
          enum: [previewed, committing, committed, failed]
        mappingSource:
          type: string
          enum: [detected, profile, user]
        createdAt:
          type: string
          format: date-time
        committedAt:
          type: string
          format: date-time
        stats:
          type: object
          additionalProperties: true
          description: "{rows, errors, headerAt, dropped, dateFrom, dateTo} and, once committed, {new, duplicates}."
        profileLabel:
          type: string
          description: Source label (b1, b2, …) of the file layout, when the user has more than one layout.
        error:
          type: string
    ImportDetail:
      allOf:
        - $ref: "#/components/schemas/ImportSummary"
        - type: object
          required: [encoding, delimiter, headers, columnTypes, mapping, options]
          properties:
            encoding:
              type: string
            delimiter:
              type: string
            headers:
              type: array
              items:
                type: string
            columnTypes:
              type: array
              items:
                type: string
                enum: [date, number, text]
            mapping:
              $ref: "#/components/schemas/Mapping"
            options:
              $ref: "#/components/schemas/ImportOptions"
    ImportPreview:
      type: object
      additionalProperties: false
      required: [import, stats, suggestedAccount, sampleRows, tailRows, missing, warnings]
      properties:
        import:
          $ref: "#/components/schemas/ImportDetail"
        stats:
          $ref: "#/components/schemas/ImportStats"
        suggestedAccount:
          type: object
          additionalProperties: false
          description: The account matching the file's own-account column (pre-filled when unique), or a name for a new one.
          properties:
            id:
              type: string
              format: uuid
            createName:
              type: string
        sampleRows:
          type: array
          items: {$ref: "#/components/schemas/StagedRow"}
          description: The first 50 staged rows.
        tailRows:
          type: array
          items: {$ref: "#/components/schemas/StagedRow"}
          description: The last 5 staged rows, when the file has more than 55.
        missing:
          type: array
          items:
            type: string
          description: Required roles that are not mapped yet; the commit needs this empty.
        warnings:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
              code:
                type: string
              message:
                type: string
    ImportRowPage:
      type: object
      additionalProperties: false
      required: [rows, total]
      properties:
        rows:
          type: array
          items: {$ref: "#/components/schemas/StagedRow"}
        total:
          type: integer
          description: Rows in the import (errored rows only, with onlyErrors).
    ImportLines:
      type: object
      additionalProperties: false
      required: [encoding, delimiter, total, lines]
      properties:
        encoding:
          type: string
        delimiter:
          type: string
        total:
          type: integer
          description: Records in the file.
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [record, fields, status]
            properties:
              record:
                type: integer
                description: 1-based, as headerRow counts.
              fields:
                type: array
                items:
                  type: string
              status:
                type: string
                enum: [header, preamble, data, footer_dropped, blank, skipped]
    ImportChanges:
      type: object
      additionalProperties: false
      properties:
        accountId:
          type: string
          format: uuid
        mapping:
          $ref: "#/components/schemas/Mapping"
        options:
          $ref: "#/components/schemas/ImportOptions"
    CommitRequest:
      type: object
      additionalProperties: false
      properties:
        rememberMapping:
          type: boolean
          default: true
          description: Save the mapping and options for files with the same layout.
    DuplicateFileProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [existingImportId]
          properties:
            existingImportId:
              type: string
              format: uuid
    Money:
      type: object
      additionalProperties: false
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          format: int64
          description: Signed amount in minor units (grosze for PLN). Negative = money out.
          example: -4498
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 code.
          example: PLN
    ProblemCode:
      type: string
      description: Stable machine-readable error code.
      enum:
        - validation_failed
        - unauthenticated
        - forbidden
        - not_found
        - conflict
        - duplicate_file
        - import_not_committable
        - stale_version
        - rate_limited
        - payload_too_large
        - unsupported_file
        - not_implemented
        - internal
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          description: Dotted path of the offending field, e.g. `mapping.amount`.
        message:
          type: string
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: Relative URI reference `/problems/<code>`.
          example: /problems/validation_failed
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          example: 422
        code:
          $ref: "#/components/schemas/ProblemCode"
        detail:
          type: string
        instance:
          type: string
          description: Request path.
        requestId:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
