          items:
            type: string
            format: uuid
        weights:
          type: array
          maxItems: 100
          items:
            type: integer
            minimum: 1
            maximum: 1000
        exact:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [memberId, shareMinor]
            properties:
              memberId:
                type: string
                format: uuid
              shareMinor:
                type: integer
