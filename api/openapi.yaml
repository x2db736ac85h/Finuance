          minimum: 0
          maximum: 7
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: Create only (default PLN, or the linked group's currency).
        kind:
          $ref: "#/components/schemas/SharedGroupKind"
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        budgetMinor:
          type: integer
          format: int64
          minimum: 1
        archived:
          type: boolean
          description: Update only.
        fromGroupId:
          type: string
          format: uuid
          description: Create only; the personal group to share.
    SharedShare:
      type: object
      additionalProperties: false
      required: [memberId, shareMinor]
      properties:
        memberId:
          type: string
          format: uuid
        shareMinor:
          type: integer
          format: int64
        weight:
          type: integer
    SharedExpense:
      type: object
      additionalProperties: false
      required: [id, addedBy, paidBy, bookedOn, amountMinor, payee, category, note, origin, splitMode, shares, mine, sourceMissing]
      properties:
        id:
          type: string
          format: uuid
        addedBy:
          type: string
          format: uuid
        paidBy:
          type: string
          format: uuid
        bookedOn:
          type: string
          format: date
        amountMinor:
          type: integer
          format: int64
