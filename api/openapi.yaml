          $ref: "#/components/schemas/ThemeTokens"
    ThemeUpdateRequest:
      type: object
      additionalProperties: false
      required: [version, name, tokens]
      properties:
        version:
          type: integer
          format: int32
        name:
          type: string
          maxLength: 40
        tokens:
          $ref: "#/components/schemas/ThemeTokens"
    ThemeStatusRequest:
      type: object
      additionalProperties: false
      required: [version, status]
      properties:
        version:
          type: integer
          format: int32
        status:
          type: string
          enum: [draft, approved, retired]
    ContrastFailure:
      type: object
      additionalProperties: false
      required: [mode, fg, bg, ratio]
      properties:
        mode:
          type: string
        fg:
          type: string
        bg:
          type: string
        ratio:
          type: number
          format: double
    ProblemLimit:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name:
          type: string
          description: The `EffectiveLimits` field that was reached.
