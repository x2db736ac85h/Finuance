          format: uuid
        to:
          type: string
          format: uuid
        amountMinor:
          type: integer
          format: int64
        settledOn:
          type: string
          format: date
        note:
          type: string
        mine:
          type: boolean
    SharedSettlementInput:
      type: object
      additionalProperties: false
