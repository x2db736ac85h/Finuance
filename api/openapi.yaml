openapi: 3.0.3
info:
  title: Finuance API
  version: 0.0.0
  description: |
    Self-hosted personal finance for European bank CSV exports.

    Conventions (docs/PLAN.md §6.1): camelCase JSON; ids are UUID strings; dates are `YYYY-MM-DD`;
    timestamps are RFC 3339 UTC; money is `{amountMinor, currency}` in integer minor units.
    Errors are RFC 9457 `application/problem+json` with a stable `code`.
  license:
    name: MIT
    url: https://opensource.org/license/mit
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /meta:
    get:
      operationId: getMeta
      summary: Public instance information
      description: Unauthenticated. The web app reads it before login to decide which screens to show.
      tags: [meta]
      security: []
      responses:
        "200":
          description: Instance information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        default:
          $ref: "#/components/responses/Problem"
  /auth/signup:
    post:
      operationId: signup
      summary: Create an account and sign in
      description: |
        Disabled (`403 forbidden`) when `FINUANCE_ALLOW_SIGNUP` is false; use `finuance admin create-user`.
        Password: at least 12 characters, no composition rules. Rate-limited per IP and per (IP, email).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created; the session cookie is set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /auth/login:
    post:
      operationId: login
      summary: Sign in
      description: |
        A wrong password and an unknown email give the same `401` in the same time. Every login starts
        a new session; a session cookie sent with the request is revoked (rotation).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in; the session cookie is set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /auth/demo:
    post:
      operationId: startDemo
      summary: Try the demo
      description: |
        Only on a demo instance (`FINUANCE_DEMO_MODE`, see `GET /meta`): creates an ephemeral demo user
        with the demo year imported, and signs it in. The user and all of its data are deleted
        24 hours after creation. At most 5 per hour per client address. Elsewhere `404`.
      tags: [auth]
      security: []
      responses:
        "200":
          description: Signed in as a new demo user; the session cookie is set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out
      description: Deletes the current session (if any) and clears the cookie. Always succeeds.
      tags: [auth]
      security: []
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
        default:
          $ref: "#/components/responses/Problem"
  /me:
    get:
      operationId: getMe
      summary: The signed-in user
      tags: [me]
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMe
      summary: Change the display name
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteMe
      summary: Delete the account and all of its data
      description: Needs the current password. Every account, import, transaction and setting is deleted.
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteMeRequest"
      responses:
        "204":
          description: Deleted; the cookie is cleared.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /me/password:
    post:
      operationId: changePassword
      summary: Change the password
      description: |
        Needs the current password. Every session of the user is revoked, including this one, and a
        new session cookie is set for this browser.
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Changed; a new session cookie is set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /me/sessions:
    get:
      operationId: listSessions
      summary: The user's active sessions
      tags: [me]
      responses:
        "200":
          description: Sessions, most recently used first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
  /me/sessions/{id}:
    delete:
      operationId: revokeSession
      summary: Sign out one session
      tags: [me]
      parameters:
        - name: id
          in: path
          required: true
          description: Session id from the list (first 8 bytes of the token hash, hex).
          schema:
            type: string
            pattern: "^[0-9a-f]{16}$"
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Problem"
  /me/activity:
    get:
      operationId: listActivity
      summary: The user's activity log (Settings → Activity)
      description: >-
        Security-relevant actions of the account, newest first (PLAN 17.6): sign-ins and failed
        sign-ins, sign-outs, password changes, revoked sessions, imports committed or deleted,
        deleted accounts, exports, rule runs, legacy migrations, duplicate decisions and applied
        assistant proposals, with the address and a short browser name. Events are kept for one
        year and can't be changed or deleted by the user; deleting the account deletes them.
      tags: [me]
      parameters:
        - name: before
          in: query
          required: false
          description: Only events older than this event id (the previous page's `nextBefore`).
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        default:
          $ref: "#/components/responses/Problem"
  /me/export:
    get:
      operationId: exportMe
      summary: Download all of the user's data
      description: >-
        A zip stream: one JSON file per entity (accounts, categories, groups, budgets, annotations,
        dedupe overrides, imports, investments, preferences, rules, category aliases, the activity
        log), `transactions.csv` for every account and
        the original import files under `imports/`.
      tags: [me]
      responses:
        "200":
          description: Zip archive.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"
  /legacy-imports:
    get:
      operationId: listLegacyImports
      summary: The user's latest migrations from the single-file app, newest first
      tags: [legacy]
      responses:
        "200":
          description: At most 10 runs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegacyImport"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createLegacyImport
      summary: Migrate a backup of the single-file app
      description: |
        The browser reads the backup (and decrypts it; the passphrase never leaves the browser) and
        sends a `manifest` part (JSON, at most 16 MiB) plus one `file` part per legacy file, in the
        manifest's order, each at most `FINUANCE_MAX_UPLOAD_BYTES`. The run happens in the
        background (`202`); poll `GET /legacy-imports/{id}`. One run per user at a time
        (`409 migration_running`). Running the same backup again creates nothing new.
      tags: [legacy]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [manifest]
              properties:
                manifest:
                  type: string
                  description: JSON document (PLAN §4.10).
                file:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyImport"
        default:
          $ref: "#/components/responses/Problem"
  /legacy-imports/{id}:
    get:
      operationId: getLegacyImport
      summary: A migration's progress and report
      tags: [legacy]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyImport"
        default:
          $ref: "#/components/responses/Problem"
  /preferences:
    get:
      operationId: getPreferences
      summary: The user's UI preferences
      tags: [preferences]
      responses:
        "200":
          description: The document; version 0 and `{}` before the first save.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putPreferences
      summary: Replace the UI preferences
      description: |
        Optimistic concurrency: send the version you read (0 for the first save). A mismatch returns
        `409 stale_version` with the current document in `current`.
      tags: [preferences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Preferences"
      responses:
        "200":
          description: Saved; `version` is the new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "409":
          description: The stored version is not the one sent.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/StalePreferencesProblem"
        default:
          $ref: "#/components/responses/Problem"
  /accounts:
    get:
      operationId: listAccounts
      summary: The user's accounts
      description: Natural Polish order of names, with transaction counts and date ranges.
      tags: [accounts]
      responses:
        "200":
          description: Accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createAccount
      summary: Create an account
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Problem"
  /accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateAccount
      summary: Change an account
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAccount
      summary: Delete an account with its imports and transactions
      tags: [accounts]
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
  /imports:
    get:
      operationId: listImports
      summary: Imports, newest first
      tags: [imports]
      parameters:
        - name: accountId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Imports.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportSummary"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: uploadImport
      summary: Upload a bank export and get a preview
      description: |
        One CSV/TSV file per request, at most `FINUANCE_MAX_UPLOAD_BYTES` (20 MiB). Files with NUL bytes
        are refused (`415 unsupported_file`); identical bytes already imported give `409 duplicate_file`.
        A remembered profile for the file's layout is applied automatically (`mappingSource: profile`).
        With `autoCommit=true` a profile-matched, error-free file with a resolved account is committed
        right away (`202`); otherwise the preview is returned as usual (`201`).
      tags: [imports]
      parameters:
        - name: autoCommit
          in: query
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                accountId:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Previewed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        "202":
          description: Auto-committed (the commit job is running).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        "409":
          description: The same file was already imported.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DuplicateFileProblem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /imports/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getImport
      summary: One import
      tags: [imports]
      responses:
        "200":
          description: The import.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportDetail"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateImport
      summary: Change the account, mapping or options of a previewed import
      description: Re-reads the stored file with the new settings, re-stages it and returns the new preview.
      tags: [imports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportChanges"
      responses:
        "200":
          description: The new preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteImport
      summary: Delete an import (cancel a preview, or remove a committed import)
      description: Transactions that another import of the account also contains are kept.
      tags: [imports]
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
  /imports/{id}/rows:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listImportRows
      summary: Staged rows of an import
      tags: [imports]
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: onlyErrors
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: A page of rows in file order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRowPage"
        default:
          $ref: "#/components/responses/Problem"
  /imports/{id}/lines:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listImportLines
      summary: Decoded records of the file with their status (header-row picker)
      tags: [imports]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 18
      responses:
        "200":
          description: The first records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportLines"
        default:
          $ref: "#/components/responses/Problem"
  /imports/{id}/file:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getImportFile
      summary: The original file
      tags: [imports]
      responses:
        "200":
          description: The uploaded bytes.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"
  /imports/{id}/commit:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: commitImport
      summary: Commit a previewed import
      description: |
        Needs an account, the required columns and at least one valid row. The commit runs as a job;
        poll `GET /imports/{id}` until `committed` or `failed`. A failed import can be committed again;
        one that is committing or committed gets `409 import_not_committable`.
      tags: [imports]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitRequest"
      responses:
        "202":
          description: Committing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportDetail"
        default:
          $ref: "#/components/responses/Problem"
  /imports/{id}/reprocess:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: reprocessImport
      summary: Re-read a committed import with a new mapping or options
      description: Manual edits survive wherever a transaction's fingerprint is unchanged.
      tags: [imports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportChanges"
      responses:
        "202":
          description: Committing again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportDetail"
        default:
          $ref: "#/components/responses/Problem"
  /transactions:
    post:
      operationId: addTransaction
      summary: Add a transaction by hand to a cash account
      description: >-
        For cash accounts only (`422` for a bank account, whose transactions come from files). The
        transaction can be edited and deleted later; rules and transfer detection treat it like an
        imported one, but a category set here is a manual one and wins (ADR 0029).
      tags: [transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualTransactionInput"
      responses:
        "201":
          description: The new transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionDetail"
        default:
          $ref: "#/components/responses/Problem"
  /transactions/query:
    post:
      operationId: queryTransactions
      summary: A window of transactions with totals
      description: >-
        Compiles the QueryContext (accounts, search, column filters, period) and returns the rows of
        one window plus the total, stats, data range and resolved period (PLAN §4.5, ADR 0008).
        With `locateId` the window that contains that transaction is returned instead.
      tags: [transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionQuery"
      responses:
        "200":
          description: The window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
        default:
          $ref: "#/components/responses/Problem"
  /transactions/distinct:
    post:
      operationId: distinctValues
      summary: A column's values with counts (the value checklist)
      description: Computed over the context with this column's own filter removed, so unticked values stay listed. Ordered by count, then value.
      tags: [transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DistinctRequest"
      responses:
        "200":
          description: Values.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DistinctValue"
        default:
          $ref: "#/components/responses/Problem"
  /transactions/ids:
    post:
      operationId: transactionRange
      summary: Ids and amounts of a range of the ordered result (range selection)
      tags: [transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdsRequest"
      responses:
        "200":
          description: Ids and amounts in order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IdAmount"
        default:
          $ref: "#/components/responses/Problem"
  /transactions/bulk:
    post:
      operationId: bulkUpdateTransactions
      parameters:
        - $ref: "#/components/parameters/AssistantChatHeader"
        - $ref: "#/components/parameters/AssistantProposalHeader"
      summary: Change the group, category or transfer state of many transactions
      description: >-
        Applies exactly one action to the given transactions (at most 5,000) and keeps the change as
        annotations, so it survives deleting and re-importing the file: `set.groupId` (null removes
        the label), `category` (`id` sets a manual category, `reset` goes back to the bank's) or
        `transfer` (as on one transaction). Ids that are not the user's are ignored; `updated`
        counts the transactions changed.
      tags: [transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpdate"
      responses:
        "200":
          description: How many transactions changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResult"
        default:
          $ref: "#/components/responses/Problem"
  /transactions/export:
    post:
      operationId: exportTransactions
      summary: The filtered, sorted rows as CSV
      description: >-
        Streams `text/csv`: UTF-8 with BOM, `;` by default, the given columns in order, amounts with a
        comma decimal mark and dates as dd.mm.yyyy (ADR 0014). Text cells that would start a formula
        get a `'` prefix.
      tags: [transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "200":
          description: CSV.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"
  /transactions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getTransaction
      summary: One transaction with its raw fields and source imports
      tags: [transactions]
      responses:
        "200":
          description: The transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionDetail"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateTransaction
      summary: Set the category or the note, or change a transaction added by hand
      description: >-
        `categoryName` creates the category when it doesn't exist. A set category becomes a manual
        one; `resetCategory` goes back to the bank's category. Edits are kept as annotations, so they
        survive deleting and re-importing the file. `bookedOn`, `amountMinor`, `payee` and
        `description` change transactions added by hand only.
      tags: [transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionPatch"
      responses:
        "200":
          description: The updated transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionDetail"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteTransaction
      summary: Delete a transaction added by hand
      description: An imported transaction goes with its import (`409 conflict`).
      tags: [transactions]
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
  /categories:
    get:
      operationId: listCategories
      summary: Categories with counts and colour slots
      description: >-
        `txCount` counts the transactions of the given accounts (all when omitted). `colorSlot` ranks
        categories by all-time spending over those accounts: the top 7 get slots 1–7, the rest null
        (PLAN §4.6).
      tags: [categories]
      parameters:
        - name: accountIds
          in: query
          style: form
          explode: false
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              format: uuid
      responses:
        "200":
          description: Categories in natural order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createCategory
      summary: Create a category
      description: >-
        At most 80 characters, unique per user ignoring case and accents (`409 conflict`). A new
        category takes over its name: bank rows of that name come to it on the next import.
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: The new category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamedRef"
        default:
          $ref: "#/components/responses/Problem"
  /categories/stats:
    get:
      operationId: categoryStats
      summary: Every category with its counts (Settings → Categories)
      description: >-
        Transactions over all accounts, how many were categorised by hand and by rules, and the
        other bank category names that map to the category (left by renames and merges).
      tags: [categories]
      responses:
        "200":
          description: Categories in natural order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryStat"
        default:
          $ref: "#/components/responses/Problem"
  /categories/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: renameCategory
      summary: Rename a category
      description: >-
        The bank's rows of the old name keep coming to it. A name another category has is
        `409 conflict`: merge the two instead.
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: The category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamedRef"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteCategory
      summary: Delete a category (its transactions become uncategorised)
      description: >-
        Its transactions become uncategorised however they were categorised, its budget goes, rules
        that set it lose that action, and its bank name stays uncategorised on later imports.
      tags: [categories]
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
  /categories/{id}/merge:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: mergeCategory
      summary: Merge a category into another one and delete it
      description: >-
        Its transactions, manual categories, rules, bank names and (when the target has none) its
        budget move to `intoId`.
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [intoId]
              properties:
                intoId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: How many transactions moved.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [moved]
                properties:
                  moved:
                    type: integer
                    format: int64
        default:
          $ref: "#/components/responses/Problem"
  /rules:
    get:
      operationId: listRules
      summary: The rules in the order they apply
      tags: [rules]
      responses:
        "200":
          description: The rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rule"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createRule
      parameters:
        - $ref: "#/components/parameters/AssistantChatHeader"
        - $ref: "#/components/parameters/AssistantProposalHeader"
      summary: Create a rule (it goes last)
      description: >-
        A rule matches with the table's filter language and needs a search or a column filter, and
        an action. Every change to the rules re-applies all of them in the background (ADR 0017).
      tags: [rules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "201":
          description: The new rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        default:
          $ref: "#/components/responses/Problem"
  /rules/order:
    put:
      operationId: reorderRules
      summary: Set the order the rules apply in
      description: Every rule's id exactly once, first applies first (the last match wins).
      tags: [rules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ids]
              properties:
                ids:
                  type: array
                  maxItems: 200
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: The rules in their new order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rule"
        default:
          $ref: "#/components/responses/Problem"
  /rules/preview:
    post:
      operationId: previewRule
      summary: What a match selects now
      description: >-
        The number of matching transactions (all accounts, all time, transfers included), how many
        of them have a manual category (a category action leaves those alone), and the newest 10.
      tags: [rules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [match]
              properties:
                match:
                  $ref: "#/components/schemas/RuleMatch"
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulePreview"
        default:
          $ref: "#/components/responses/Problem"
  /rules/suggestions:
    get:
      operationId: ruleSuggestions
      summary: Rules worth creating (the toolbar card)
      description: >-
        Payee groups the user put in one category by hand at least 3 times, with the rule that
        would do it ("payee contains the group" → the category), most manual categorisations
        first, at most 5. A group a rule already handles (the same match and category) is left
        out; dismissing a suggestion is kept by the client (PLAN 15.10).
      tags: [rules]
      responses:
        "200":
          description: The suggestions.
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items:
                  $ref: "#/components/schemas/RuleSuggestion"
        default:
          $ref: "#/components/responses/Problem"
  /rules/apply:
    post:
      operationId: applyRules
      summary: Re-apply every rule and look for transfers again
      description: Queues the reclassification job; the table shows the result when it has run.
      tags: [rules]
      responses:
        "202":
          description: Queued.
        default:
          $ref: "#/components/responses/Problem"
  /rules/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateRule
      summary: Replace a rule (its position stays)
      tags: [rules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "200":
          description: The rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteRule
      summary: Delete a rule
      description: Its categories go back to the bank's, or to another matching rule's.
      tags: [rules]
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
  /groups:
    get:
      operationId: listGroups
      summary: Groups with their stats
      description: >-
        Every group in natural order with its transactions over all accounts, ignoring filters:
        count, money out and in (transfers included), first and last day (PLAN §4.7).
      tags: [groups]
      responses:
        "200":
          description: The groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createGroup
      summary: Create a group
      description: >-
        The name is unique per user (ignoring case and accents), at most 40 characters. Without
        `color` the group takes the first unused colour slot. `409 conflict` when the name is taken.
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: The new group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Problem"
  /groups/timeline:
    get:
      operationId: groupsTimeline
      summary: Personal and shared groups on one timeline
      description: >-
        Every personal group with transactions and every shared group the user is an active member
        of, newest first by their last day, with totals, the largest category and "next time" hints
        that compare a group with the others of the same kind (PLAN 19.9). A personal group linked
        to a shared group appears once, as the shared group. Totals of a shared group are the
        group's (every member's expenses).
      tags: [shared]
      responses:
        "200":
          description: The timeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupTimeline"
        default:
          $ref: "#/components/responses/Problem"
  /shared-groups:
    get:
      operationId: listSharedGroups
      summary: Your shared groups and invitations
      description: >-
        Shared groups the user owns, is a member of or is invited to (ADR 0028). `404` when the
        instance switched shared groups off and in demo mode.
      tags: [shared]
      responses:
        "200":
          description: The groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SharedGroup"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createSharedGroup
      summary: Create a shared group
      description: >-
        The caller becomes its owner. With `fromGroupId` the personal group is linked: its
        transactions are copied into the shared group (date, amount, payee, category, note; never
        the account or the bank's description) and follow it. `422 limit_reached` at the
        `maxSharedGroups` limit; `422` when a transaction of the group is in another currency.
      tags: [shared]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharedGroupInput"
      responses:
        "201":
          description: The new group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedGroup"
        default:
          $ref: "#/components/responses/Problem"
  /shared-groups/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getSharedGroup
      summary: A shared group with members, expenses, settlements and balances
      description: >-
        An invited user sees the group and its members only. Balances are paid − share − paid out
        + received per member and sum to zero; `transfers` settle them in at most n − 1 payments.
      tags: [shared]
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedGroupDetail"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateSharedGroup
      summary: Change or archive a shared group (owner)
      tags: [shared]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharedGroupInput"
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedGroup"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteSharedGroup
      summary: Delete a shared group (owner, only while nobody else joined)
      description: Once someone joined, archive the group instead (`409 conflict`).
      tags: [shared]
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
  /shared-groups/{id}/invites:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: inviteToSharedGroup
      summary: Invite a friend (owner)
      description: Only friends can be invited (`422`), and someone who is or was in the group only once (`409`).
      tags: [shared]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [friendId]
              properties:
                friendId:
                  type: string
                  format: uuid
      responses:
        "201":
          description: The invited member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedMember"
        default:
          $ref: "#/components/responses/Problem"
  /shared-groups/{id}/accept:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: acceptSharedGroup
      summary: Accept an invitation
      description: >-
        Joins the group and creates a personal group of the same name linked to it (or
        "<name> (shared)" when the name is taken), so the user can put their own transactions in.
      tags: [shared]
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedGroup"
        default:
          $ref: "#/components/responses/Problem"
  /shared-groups/{id}/decline:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: declineSharedGroup
      summary: Decline an invitation
      tags: [shared]
      responses:
        "204":
          description: Declined.
        default:
          $ref: "#/components/responses/Problem"
  /shared-groups/{id}/leave:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: leaveSharedGroup
      summary: Leave a shared group
      description: >-
        Needs a zero balance (`409 conflict`: settle up first); the owner archives instead.
        What the user shared stays in the group; their personal group is unlinked.
      tags: [shared]
      responses:
        "204":
          description: Left.
        default:
          $ref: "#/components/responses/Problem"
  /shared-groups/{id}/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: removeSharedMember
      summary: Withdraw an invitation or remove a member with a zero balance (owner)
      tags: [shared]
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"
  /shared-groups/{id}/expenses:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: addSharedExpense
      summary: Add an expense without a transaction
      description: >-
        Typed in the group, in its currency; split equally between the active members unless
        `split` says otherwise. The other members are notified.
      tags: [shared]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharedExpenseInput"
      responses:
        "201":
          description: The new expense's id.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
        default:
          $ref: "#/components/responses/Problem"
  /shared-groups/{id}/expenses/{expenseId}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: expenseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateSharedExpense
      summary: Change your own expense
      description: >-
        A typed expense takes every field (send them all); a copy of a transaction only its split
        (the rest follows the transaction). `403` for someone else's expense.
      tags: [shared]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharedExpenseInput"
      responses:
        "204":
          description: Changed.
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteSharedExpense
      summary: Delete your own typed expense
      description: A copy goes when its transaction leaves the group (`409 conflict` here).
      tags: [shared]
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
  /shared-groups/{id}/settlements:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: addSharedSettlement
      summary: Record a payment between two members (settle up)
      description: The caller must be the payer or the payee; the other one is notified.
      tags: [shared]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharedSettlementInput"
      responses:
        "201":
          description: The payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedSettlement"
        default:
          $ref: "#/components/responses/Problem"
  /shared-groups/{id}/settlements/{settlementId}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: settlementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteSharedSettlement
      summary: Delete a payment you recorded
      tags: [shared]
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
  /shared-groups/{id}/report:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: sharedGroupReport
      summary: A shared group's report (the group page's cards)
      description: >-
        Computed from the group's expenses: totals and span, spending per day, per category, top
        payees, the largest expenses and paid vs share per member.
      tags: [shared]
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedGroupReport"
        default:
          $ref: "#/components/responses/Problem"
  /shared-groups/{id}/export:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: exportSharedGroup
      summary: The group's expenses as CSV
      description: >-
        UTF-8 with BOM, `;`-separated: date, payee, category, amount, paid by, note and one column
        per member with their share; formula characters are neutralised like every export.
      tags: [shared]
      responses:
        "200":
          description: CSV.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"
  /groups/{id}/report:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: groupReport
      summary: A group's report (the group window)
      description: >-
        The group's transactions over all accounts, ignoring filters and with transfers included
        (like its stats): the group with its totals and budget, the date span and money out per
        day, money out per day, per category and for the top payees (PLAN 15.9).
      tags: [groups]
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupReport"
        default:
          $ref: "#/components/responses/Problem"
  /groups/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateGroup
      summary: Rename, recolour or budget a group
      description: The client renames view filters that mention the old name.
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteGroup
      summary: Delete a group (its labels only, never transactions)
      tags: [groups]
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
  /duplicates:
    get:
      operationId: listDuplicates
      summary: Duplicate groups with every version (the duplicates window)
      description: >-
        Fingerprints whose rows come from two or more committed imports of an account where rows
        were merged, or where the user decided (an override), newest first. Duplicates are found per
        account. `q` keeps the groups where a row contains every word (accent- and case-insensitive).
      tags: [duplicates]
      parameters:
        - name: accountIds
          in: query
          style: form
          explode: false
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              format: uuid
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 60
      responses:
        "200":
          description: One page of groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicatePage"
        default:
          $ref: "#/components/responses/Problem"
  /duplicates/{accountId}/{fingerprint}:
    parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: fingerprint
        in: path
        required: true
        description: The de-dupe key, as 64 lower-case hex digits.
        schema:
          type: string
          pattern: "^[0-9a-f]{64}$"
    put:
      operationId: decideDuplicate
      summary: Use one version, or keep both
      description: >-
        `prefer` shows the given import's version of every occurrence it contains; `keep_both` stops
        merging, so each import's rows become their own transactions. The transactions are rebuilt
        before the answer, which is the group as it is now.
      tags: [duplicates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuplicateDecision"
      responses:
        "200":
          description: The group after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateGroup"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: resetDuplicate
      summary: Back to the default merge ("Merge again")
      tags: [duplicates]
      responses:
        "200":
          description: The group after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateGroup"
        default:
          $ref: "#/components/responses/Problem"
  /insights/summary:
    post:
      operationId: insightSummary
      summary: Summary card (spent, income, net, average per day, largest expense)
      description: >-
        Over the period-scoped rows of the context. `days` is the period clipped to the data range
        (the context's accounts, ignoring filters); the spending delta compares with the previous
        period (`prevSpentMinor`, read without the period). PLAN §4.6, legacy CHARTS.sum.
      tags: [insights]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsightRequest"
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightSummary"
        default:
          $ref: "#/components/responses/Problem"
  /insights/categories:
    post:
      operationId: insightCategories
      summary: Spending by category, largest first
      description: Expenses of the period-scoped rows per category with shares and colour slots (the same ranking as `GET /categories`).
      tags: [insights]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsightRequest"
      responses:
        "200":
          description: Categories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightCategories"
        default:
          $ref: "#/components/responses/Problem"
  /insights/cashflow:
    post:
      operationId: insightCashflow
      summary: Money in and out per month
      description: >-
        Every month from the first to the last with data in the context without its period (empty
        months included); months inside the period are marked. The client cuts the list to its
        range setting.
      tags: [insights]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsightRequest"
      responses:
        "200":
          description: Months, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightCashflow"
        default:
          $ref: "#/components/responses/Problem"
  /insights/pace:
    post:
      operationId: insightPace
      summary: Cumulative spending through a month vs a comparison
      description: >-
        The target month is the period's month, else the month of the latest row shown. The
        comparison reads the context without its period. `target` is absent when there is no data.
      tags: [insights]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaceRequest"
      responses:
        "200":
          description: The pace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightPace"
        default:
          $ref: "#/components/responses/Problem"
  /insights/payees:
    post:
      operationId: insightPayees
      summary: Top payees by spending
      tags: [insights]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayeesRequest"
      responses:
        "200":
          description: Payees, largest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightPayees"
        default:
          $ref: "#/components/responses/Problem"
  /insights/daily:
    post:
      operationId: insightDaily
      summary: Spending per day for the calendar
      description: >-
        Days with spending in the calendar's range (`period` follows the period; `3m`/`6m`/`12m` are
        the last calendar months of the data; `all` the whole data). `from`/`to` are absent when there
        is nothing to show.
      tags: [insights]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyRequest"
      responses:
        "200":
          description: Days.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightDaily"
        default:
          $ref: "#/components/responses/Problem"
  /overview:
    post:
      operationId: overview
      summary: Everything the overview page shows for one month
      description: >-
        One call per screen (PLAN §4.6, legacy ovCtx and the o_* cards). The overview reads the
        context's filters and search but never its period. Lists are complete (e.g. every budget
        row, up to 40 largest expenses); the client cuts them for the card and the window. Without
        dated rows `data` is absent.
      tags: [overview]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OverviewRequest"
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
        default:
          $ref: "#/components/responses/Problem"
  /budgets:
    get:
      operationId: listBudgets
      summary: The budgets set by hand
      description: Monthly limits per category (global per category, legacy). Categories without one use the default budget.
      tags: [overview]
      responses:
        "200":
          description: Budgets, by category name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetList"
        default:
          $ref: "#/components/responses/Problem"
  /budgets/{categoryId}:
    put:
      operationId: putBudget
      summary: Set or reset a category's budget
      description: "`amountMinor: null` removes the budget (back to the default); removing a budget that isn't set is not an error."
      tags: [overview]
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetInput"
      responses:
        "204":
          description: Saved.
        default:
          $ref: "#/components/responses/Problem"
  /investments:
    get:
      operationId: getInvestments
      summary: The manual investment data
      description: PPK, positions, safe withdrawal rate and expected real return (PLAN §4.9); version 0 and the defaults before the first save.
      tags: [overview]
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investments"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putInvestments
      summary: Replace the investment data
      description: |
        Optimistic concurrency as preferences: send the version you read (0 for the first save). A
        mismatch returns `409 stale_version` with the current document in `current`. Position ids
        come from the client and must be unique.
      tags: [overview]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Investments"
      responses:
        "200":
          description: Saved; `version` is the new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investments"
        "409":
          description: The stored version is not the one sent.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/StaleInvestmentsProblem"
        default:
          $ref: "#/components/responses/Problem"
  /assistant/status:
    get:
      operationId: assistantStatus
      summary: The assistant's connections and their models
      description: >-
        Every connection the instance offers, with its chat models (embedding models and models
        outside the connection's allowlist are left out) and what each can do. The model lists are
        cached for 60 s (5 s after a failure); `refresh=true` checks again.
      tags: [assistant]
      parameters:
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: The connections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantStatus"
        default:
          $ref: "#/components/responses/Problem"
  /assistant/settings:
    get:
      operationId: getAssistantSettings
      summary: The user's assistant settings
      description: How long chats are kept and which cloud connections the user agreed to (defaults before the first save).
      tags: [assistant]
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantSettings"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putAssistantSettings
      summary: Save the assistant settings
      description: A shorter retention deletes the chats past it at once. `retentionDays` null keeps chats until they are deleted.
      tags: [assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantSettings"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantSettings"
        default:
          $ref: "#/components/responses/Problem"
  /assistant/chats:
    get:
      operationId: listAssistantChats
      summary: The user's chats, newest first
      tags: [assistant]
      responses:
        "200":
          description: Chats (expired ones are removed first).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantChatList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createAssistantChat
      summary: Start a chat
      description: The oldest chats beyond `FINUANCE_AI_MAX_CHATS` are deleted.
      tags: [assistant]
      responses:
        "201":
          description: The new chat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantChat"
        default:
          $ref: "#/components/responses/Problem"
  /assistant/chats/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getAssistantChat
      summary: A chat with its turns
      tags: [assistant]
      responses:
        "200":
          description: The chat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantChatDetail"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteAssistantChat
      summary: Delete a chat
      tags: [assistant]
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
  /assistant/chats/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: sendAssistantMessage
      summary: Ask a question; the answer streams back
      description: |
        Answers `text/event-stream` (PLAN §6.3): `step`, `reasoning`, `content`, `mode`, then `done` or
        `error`, as `event:`/`data:` pairs whose data is JSON (`AssistantStepEvent`, `AssistantDeltaEvent`,
        `AssistantModeEvent`, `AssistantDoneEvent`, `AssistantErrorEvent`). A comment line every 15 s
        keeps proxies from closing the stream. Closing the connection stops the run. Problems that keep
        a run from starting are answered as usual: `run_in_progress` (another reply is being written),
        `assistant_busy` (the server is at its limit), `consent_required` (a cloud connection the user
        hasn't agreed to), `assistant_unavailable` (no connection, or the model server can't be used),
        `rate_limited`.
      tags: [assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantMessageRequest"
      responses:
        "200":
          description: The run's events.
          content:
            text/event-stream:
              schema:
                type: string
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"
  /assistant/chats/{id}/stop:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: stopAssistant
      summary: Stop the reply being written
      description: Cancels the user's run (the model request too); nothing running is not an error.
      tags: [assistant]
      responses:
        "204":
          description: Stopped (or nothing was running).
        default:
          $ref: "#/components/responses/Problem"
  /demo-data:
    post:
      operationId: loadDemoData
      summary: Create a demo account with the generated demo year
      description: >-
        Creates "Demo account" (isDemo) and commits the fictional demo year (the legacy demo
        generator, dates shifted so the last day is yesterday) before answering. `409 conflict` when
        the user already has a demo account; it can be deleted like any other account.
      tags: [demo]
      responses:
        "201":
          description: Created and committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoData"
        default:
          $ref: "#/components/responses/Problem"
  /friends:
    get:
      operationId: listFriends
      summary: Your friends
      description: >-
        Friends see each other's display name, never the e-mail address (ADR 0027). `404` when the
        instance switched friends off, and in demo mode.
      tags: [friends]
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Friend"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: addFriend
      summary: Become friends by entering someone's code
      description: >-
        A wrong, expired or own code is `422 validation_failed` (one answer for all); friends already
        is `409 conflict`; without a display name `422 display_name_required`. At most 10 tries an
        hour per user and per address (`429`). The code's owner gets a notification, and the code is
        used up.
      tags: [friends]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendCodeInput"
      responses:
        "201":
          description: The new friend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Friend"
        default:
          $ref: "#/components/responses/Problem"
  /friends/code:
    post:
      operationId: newFriendCode
      summary: Make a code a friend can enter
      description: >-
        8 characters, valid until the end of this clock hour plus 10 minutes. Only its hash is
        stored, so it is shown once; a new code replaces the previous one.
      tags: [friends]
      responses:
        "201":
          description: The code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendCode"
        default:
          $ref: "#/components/responses/Problem"
  /friends/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: removeFriend
      summary: Remove a friend
      description: Either side can end a friendship; the other side gets a notification.
      tags: [friends]
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"
  /notifications:
    get:
      operationId: listNotifications
      summary: Your notifications, newest first, with the unread count
      description: In the app only (no e-mail); kept 90 days.
      tags: [notifications]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: The notifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        default:
          $ref: "#/components/responses/Problem"
  /notifications/read:
    post:
      operationId: markNotificationsRead
      summary: Mark notifications read
      description: The given ones, or every unread one when `ids` is left out.
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationsRead"
      responses:
        "204":
          description: Marked.
        default:
          $ref: "#/components/responses/Problem"
  /admin/users:
    get:
      operationId: adminListUsers
      summary: Accounts, newest first (administrators)
      description: |
        Administrators only; anyone else gets `404`. Each account carries counts of its data, never
        the data itself (ADR 0025).
      tags: [admin]
      parameters:
        - name: search
          in: query
          required: false
          description: Part of the e-mail address.
          schema:
            type: string
            maxLength: 254
        - name: cursor
          in: query
          required: false
          description: The `next` value of the previous page.
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: One page of accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: adminCreateUser
      summary: Create an account
      description: |
        Works when sign-up is off. Without a password a one-time password is generated, returned once,
        and must be replaced at the first sign-in.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateUserRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCreatedUser"
        default:
          $ref: "#/components/responses/Problem"
  /admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/AdminUserId"
    get:
      operationId: adminGetUser
      summary: One account with its usage
      tags: [admin]
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: adminUpdateUser
      summary: Change an account's role, state, name or limits
      description: |
        Disabling signs the account out everywhere. The last active administrator can't be demoted
        or disabled (`409 last_admin`); you can't disable yourself.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateUserRequest"
      responses:
        "200":
          description: The account as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: adminDeleteUser
      summary: Delete an account and all of its data
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDeleteUserRequest"
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
  /admin/users/{id}/reset-password:
    parameters:
      - $ref: "#/components/parameters/AdminUserId"
    post:
      operationId: adminResetPassword
      summary: Give an account a new one-time password
      description: Signs the account out everywhere; the password is returned once and must be replaced at the next sign-in.
      tags: [admin]
      responses:
        "200":
          description: The one-time password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneTimePassword"
        default:
          $ref: "#/components/responses/Problem"
  /admin/users/{id}/revoke-sessions:
    parameters:
      - $ref: "#/components/parameters/AdminUserId"
    post:
      operationId: adminRevokeSessions
      summary: Sign an account out everywhere
      tags: [admin]
      responses:
        "200":
          description: How many sessions ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokedSessions"
        default:
          $ref: "#/components/responses/Problem"
  /admin/settings:
    get:
      operationId: adminGetSettings
      summary: The instance settings (defaults, features, limits)
      tags: [admin]
      responses:
        "200":
          description: The document and its version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettingsDoc"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: adminPutSettings
      summary: Replace the instance settings
      description: Send the version you read; a mismatch is `409 stale_version`.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceSettingsDoc"
      responses:
        "200":
          description: Saved; `version` is the new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettingsDoc"
        default:
          $ref: "#/components/responses/Problem"
  /admin/usage:
    get:
      operationId: adminUsage
      summary: How the instance is used (counts only)
      tags: [admin]
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        "200":
          description: Totals and the last days' activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceUsage"
        default:
          $ref: "#/components/responses/Problem"
  /admin/themes:
    get:
      operationId: adminListThemes
      summary: Administrator-made themes (drafts, approved and retired)
      tags: [admin]
      responses:
        "200":
          description: Themes by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Theme"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: adminCreateTheme
      summary: Create a draft theme
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThemeCreateRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Theme"
        default:
          $ref: "#/components/responses/Problem"
  /admin/themes/{id}:
    parameters:
      - $ref: "#/components/parameters/ThemeId"
    put:
      operationId: adminUpdateTheme
      summary: Change a theme's name and colours
      description: An approved theme keeps being offered, so its new colours must pass the contrast check (`422 contrast_failed`).
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThemeUpdateRequest"
      responses:
        "200":
          description: The theme as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Theme"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: adminDeleteTheme
      summary: Delete a draft
      tags: [admin]
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
  /admin/themes/{id}/status:
    parameters:
      - $ref: "#/components/parameters/ThemeId"
    put:
      operationId: adminSetThemeStatus
      summary: Approve, retire or reopen a theme
      description: Approval needs every text colour to reach 4.5:1 on its surfaces in both variants (`422 contrast_failed` lists the pairs).
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThemeStatusRequest"
      responses:
        "200":
          description: The theme as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Theme"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    AdminUserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ThemeId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssistantChatHeader:
      name: X-Assistant-Chat
      in: header
      required: false
      description: >-
        Set by the assistant panel when the request applies one of the assistant's action proposals
        (PLAN 15.7): the chat it came from. The server records it in the user's activity log
        (PLAN 17.6); the request is otherwise an ordinary one.
      schema:
        type: string
        format: uuid
    AssistantProposalHeader:
      name: X-Assistant-Proposal
      in: header
      required: false
      description: >-
        With X-Assistant-Chat: the applied proposal's `key`, recorded in the activity log so the
        chat shows the proposal as applied after a reload (`appliedProposals`).
      schema:
        type: string
        pattern: "^[0-9a-f]{16}$"
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: finuance_session
      description: |
        HttpOnly session cookie set by signup and login. Unsafe methods also need the header
        `X-Finuance-Client: web` and, when sent, an `Origin` equal to the instance origin (CSRF, §6.1).
  headers:
    SetSessionCookie:
      description: "`finuance_session=…; Path=/; HttpOnly; SameSite=Lax` (+ `Secure` outside dev). Max-Age=0 clears it."
      schema:
        type: string
    RetryAfter:
      description: Seconds until the request may be retried.
      schema:
        type: integer
  responses:
    TooManyRequests:
      description: Rate limit exceeded (`rate_limited`).
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Meta:
      type: object
      additionalProperties: false
      required: [version, signupEnabled, demoMode, assistantEnabled, features, defaults, themes]
      properties:
        features:
          $ref: "#/components/schemas/Features"
        defaults:
          $ref: "#/components/schemas/ViewDefaults"
        themes:
          type: array
          description: Themes an administrator approved, offered next to the built-in ones.
          items:
            $ref: "#/components/schemas/PublicTheme"
        version:
          type: string
          description: Build version of the server.
          example: v0.1.0
        assistantEnabled:
          type: boolean
          description: Whether at least one assistant connection is configured.
        signupEnabled:
          type: boolean
          description: Whether new accounts can be created (`FINUANCE_ALLOW_SIGNUP`).
        demoMode:
          type: boolean
          description: Whether this is the public demo instance (`FINUANCE_DEMO_MODE`).
    User:
      type: object
      additionalProperties: false
      required: [id, email, displayName, isDemo, createdAt, isAdmin, mustChangePassword, limits]
      properties:
        isAdmin:
          type: boolean
        mustChangePassword:
          type: boolean
          description: Signed in with a one-time password; every route but `/me`, `/me/password` and sign-out answers `403 password_change_required` until it is changed.
        limits:
          $ref: "#/components/schemas/EffectiveLimits"
        id:
          type: string
          format: uuid
        email:
          type: string
          example: alex@example.com
        displayName:
          type: string
          maxLength: 80
        isDemo:
          type: boolean
        createdAt:
          type: string
          format: date-time
    SignupRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          description: At least 12 characters, at most 1024 bytes.
        displayName:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
    UpdateMeRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    DeleteMeRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
    ActivityPage:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEvent"
        nextBefore:
          type: integer
          format: int64
          description: Pass as `before` for the next page; absent on the last page.
    ActivityEvent:
      type: object
      additionalProperties: false
      required: [id, at, action]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        action:
          type: string
          enum:
            - auth.login
            - auth.login_failed
            - auth.logout
            - auth.password_changed
            - auth.session_revoked
            - import.committed
            - import.deleted
            - account.deleted
            - export.csv
            - export.data
            - rules.applied
            - legacy.import_started
            - duplicates.decided
            - duplicates.reset
            - assistant.action_applied
            - admin.user_created
            - admin.role_changed
            - admin.user_disabled
            - admin.user_enabled
            - admin.password_reset
            - admin.sessions_revoked
            - admin.limits_changed
            - admin.user_deleted
            - admin.settings_changed
            - admin.theme_approved
            - admin.theme_retired
            - transaction.added
            - transaction.edited
            - transaction.deleted
            - friend.added
            - friend.removed
            - friend.code_failed
            - shared.created
            - shared.deleted
            - shared.archived
            - shared.invited
            - shared.joined
            - shared.declined
            - shared.left
            - shared.member_removed
            - shared.settled
        entityId:
          type: string
          description: The affected record (import, account, session, chat …), if any.
        ip:
          type: string
          description: The client address; absent for actions of a background job.
        browser:
          type: string
          description: A short browser and system name, e.g. "Firefox on Linux".
        meta:
          type: object
          additionalProperties: true
          description: Small facts about the action (file name, counts, kind).
    Session:
      type: object
      additionalProperties: false
      required: [id, createdAt, lastSeenAt, expiresAt, userAgent, current]
      properties:
        id:
          type: string
          description: First 8 bytes of the token hash, hex. Not a credential.
          example: 3f2a9c0d11e4b7a5
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          description: Updated at most every 5 minutes.
        expiresAt:
          type: string
          format: date-time
          description: Absolute expiry; the idle timeout may end the session earlier.
        userAgent:
          type: string
        ip:
          type: string
        current:
          type: boolean
          description: True for the session making this request.
    Preferences:
      type: object
      additionalProperties: false
      required: [version, prefs]
      properties:
        version:
          type: integer
          format: int32
          minimum: 0
        prefs:
          type: object
          additionalProperties: true
          x-go-type: json.RawMessage # generated code already imports encoding/json
          description: UI settings document (theme, cards, per-view state, …); the web app owns its shape. At most 256 KiB.
    StalePreferencesProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [current]
          properties:
            current:
              $ref: "#/components/schemas/Preferences"
    Account:
      type: object
      additionalProperties: false
      required: [id, name, kind, currency, openingBalance, txCount, isDemo, archived, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/AccountKind"
        currency:
          type: string
        numberHint:
          type: string
          description: Last four digits of the account number.
        openingBalance:
          $ref: "#/components/schemas/Money"
        txCount:
          type: integer
          format: int64
        firstOn:
          type: string
          format: date
        lastOn:
          type: string
          format: date
        isDemo:
          type: boolean
        archived:
          type: boolean
        createdAt:
          type: string
          format: date-time
    AccountInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 80
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: Default PLN.
        numberHint:
          type: string
          pattern: "^([0-9]{4})?$"
        openingBalanceMinor:
          type: integer
          format: int64
        archived:
          type: boolean
        kind:
          $ref: "#/components/schemas/AccountKind"
    AccountKind:
      type: string
      enum: [bank, cash]
      description: >-
        A bank account takes imported files; a cash account takes transactions added by hand
        (ADR 0029). Chosen when the account is created (default `bank`); later changes are ignored.
    ColRef:
      type: object
      additionalProperties: false
      required: [index, header]
      properties:
        index:
          type: integer
          minimum: 0
        header:
          type: string
    Mapping:
      type: object
      additionalProperties: false
      description: Columns per canonical role (PLAN §4.3). An absent role is not mapped.
      x-go-type: ledger.MappingDoc
      x-go-type-import:
        path: github.com/x2db736ac85h/finuance/backend/internal/ledger
      properties:
        bookedOn: {$ref: "#/components/schemas/ColRef"}
        amount: {$ref: "#/components/schemas/ColRef"}
        payee: {$ref: "#/components/schemas/ColRef"}
        description: {$ref: "#/components/schemas/ColRef"}
        reference: {$ref: "#/components/schemas/ColRef"}
        category: {$ref: "#/components/schemas/ColRef"}
        currency: {$ref: "#/components/schemas/ColRef"}
        valueOn: {$ref: "#/components/schemas/ColRef"}
        txType: {$ref: "#/components/schemas/ColRef"}
        counterpartyAccount: {$ref: "#/components/schemas/ColRef"}
        ownAccount: {$ref: "#/components/schemas/ColRef"}
        balance: {$ref: "#/components/schemas/ColRef"}
        ignore:
          type: array
          items: {$ref: "#/components/schemas/ColRef"}
    ImportOptions:
      type: object
      additionalProperties: false
      description: How the file is read and staged (PLAN §4.3). headerRow is "auto", "none" or a 1-based record number.
      x-go-type: ledger.OptionsDoc
      x-go-type-import:
        path: github.com/x2db736ac85h/finuance/backend/internal/ledger
      properties:
        encoding:
          type: string
          enum: [auto, utf-8, windows-1250, iso-8859-2, windows-1252]
        delimiter:
          type: string
          enum: [auto, ";", ",", "\\t", "|"]
        headerRow:
          oneOf:
            - type: string
              enum: [auto, none]
            - type: integer
              minimum: 1
        skipRows:
          type: integer
          minimum: 0
        dropShort:
          type: boolean
        dateOrder:
          type: string
          enum: [dmy, mdy]
        stripQuote:
          type: boolean
        invertSign:
          type: boolean
        amountMode:
          type: string
          enum: [single, debit_credit]
        debitColumn: {$ref: "#/components/schemas/ColRef"}
        creditColumn: {$ref: "#/components/schemas/ColRef"}
        currencyFallback:
          type: string
    RawField:
      type: object
      additionalProperties: false
      required: [header, value]
      properties:
        header:
          type: string
        value:
          type: string
    StagedRow:
      type: object
      additionalProperties: false
      required: [rowIndex, payee, description, reference, txType, bankCategory, counterpartyAccount, raw, duplicate]
      properties:
        rowIndex:
          type: integer
          description: 0-based data row of the file.
        bookedOn:
          type: string
          format: date
        valueOn:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/Money"
        balance:
          $ref: "#/components/schemas/Money"
        payee:
          type: string
        description:
          type: string
        reference:
          type: string
        txType:
          type: string
        bankCategory:
          type: string
        counterpartyAccount:
          type: string
        raw:
          type: array
          items: {$ref: "#/components/schemas/RawField"}
        error:
          type: string
          description: Why the row can't be imported (it is never committed).
        duplicate:
          type: boolean
          description: Before the commit, the account already has this transaction; after it, the row merged into another import's transaction.
        transactionId:
          type: string
          format: uuid
    ImportStats:
      type: object
      additionalProperties: false
      required: [rows, errors, duplicatesEstimate, newEstimate, headerAt, dropped]
      properties:
        rows:
          type: integer
        errors:
          type: integer
        duplicatesEstimate:
          type: integer
        newEstimate:
          type: integer
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
        headerAt:
          type: integer
          description: 1-based record of the header row; 0 = no header.
        dropped:
          type: integer
          description: Short summary rows left out.
    ImportSummary:
      type: object
      additionalProperties: false
      required: [id, filename, sizeBytes, status, mappingSource, createdAt, stats]
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        filename:
          type: string
        sizeBytes:
          type: integer
        status:
          type: string
          enum: [previewed, committing, committed, failed]
        mappingSource:
          type: string
          enum: [detected, profile, user]
        createdAt:
          type: string
          format: date-time
        committedAt:
          type: string
          format: date-time
        stats:
          type: object
          additionalProperties: true
          description: "{rows, errors, headerAt, dropped, dateFrom, dateTo} and, once committed, {new, duplicates}."
        profileLabel:
          type: string
          description: Source label (b1, b2, …) of the file layout, when the user has more than one layout.
        error:
          type: string
    ImportDetail:
      allOf:
        - $ref: "#/components/schemas/ImportSummary"
        - type: object
          required: [encoding, delimiter, headers, columnTypes, mapping, options]
          properties:
            encoding:
              type: string
            delimiter:
              type: string
            headers:
              type: array
              items:
                type: string
            columnTypes:
              type: array
              items:
                type: string
                enum: [date, number, text]
            mapping:
              $ref: "#/components/schemas/Mapping"
            options:
              $ref: "#/components/schemas/ImportOptions"
    ImportPreview:
      type: object
      additionalProperties: false
      required: [import, stats, suggestedAccount, sampleRows, tailRows, missing, warnings, detected]
      properties:
        import:
          $ref: "#/components/schemas/ImportDetail"
        stats:
          $ref: "#/components/schemas/ImportStats"
        suggestedAccount:
          type: object
          additionalProperties: false
          description: The account matching the file's own-account column (pre-filled when unique), or a name for a new one.
          properties:
            id:
              type: string
              format: uuid
            createName:
              type: string
        sampleRows:
          type: array
          items: {$ref: "#/components/schemas/StagedRow"}
          description: The first 50 staged rows.
        tailRows:
          type: array
          items: {$ref: "#/components/schemas/StagedRow"}
          description: The last 5 staged rows, when the file has more than 55.
        missing:
          type: array
          items:
            type: string
          description: Required roles that are not mapped yet; the commit needs this empty.
        detected:
          $ref: "#/components/schemas/Mapping"
          description: What automatic detection maps for the current options (the preview's "auto" hints and "Use detected meanings").
        warnings:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
              code:
                type: string
              message:
                type: string
    ImportRowPage:
      type: object
      additionalProperties: false
      required: [rows, total]
      properties:
        rows:
          type: array
          items: {$ref: "#/components/schemas/StagedRow"}
        total:
          type: integer
          description: Rows in the import (errored rows only, with onlyErrors).
    ImportLines:
      type: object
      additionalProperties: false
      required: [encoding, delimiter, total, lines]
      properties:
        encoding:
          type: string
        delimiter:
          type: string
        total:
          type: integer
          description: Records in the file.
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [record, fields, status]
            properties:
              record:
                type: integer
                description: 1-based, as headerRow counts.
              fields:
                type: array
                items:
                  type: string
              status:
                type: string
                enum: [header, preamble, data, footer_dropped, blank, skipped]
    ImportChanges:
      type: object
      additionalProperties: false
      properties:
        accountId:
          type: string
          format: uuid
        mapping:
          $ref: "#/components/schemas/Mapping"
        options:
          $ref: "#/components/schemas/ImportOptions"
    CommitRequest:
      type: object
      additionalProperties: false
      properties:
        rememberMapping:
          type: boolean
          default: true
          description: Save the mapping and options for files with the same layout.
    DuplicateFileProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [existingImportId]
          properties:
            existingImportId:
              type: string
              format: uuid
    FilterColumn:
      type: string
      description: A filterable, sortable column (PLAN §4.5).
      enum: [bookedOn, valueOn, amount, balanceAfter, currency, payee, description, category, bankCategory, txType, reference, counterpartyAccount, account, group, note]
    ColumnFilter:
      type: object
      additionalProperties: false
      required: [column]
      properties:
        column:
          $ref: "#/components/schemas/FilterColumn"
        cond:
          type: string
          maxLength: 500
          description: Filter language (`>100`, `-50..50`, `2025-03`, `=x`, `!kino` …).
        excluded:
          type: array
          maxItems: 5000
          description: Display values unticked in the value checklist.
          items:
            type: string
            maxLength: 1000
    Period:
      type: object
      additionalProperties: false
      description: Exactly one of preset, month, year or from/to (to exclusive). Omit the period for all time.
      properties:
        preset:
          type: string
          enum: [l30, l3m, l12m, ytd]
        month:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
        year:
          type: integer
          minimum: 1000
          maximum: 9998
        from:
          type: string
          format: date
        to:
          type: string
          format: date
    ToolFilter:
      type: object
      additionalProperties: false
      description: The assistant's lookup filter (PLAN §4.8), shown as a removable chip.
      properties:
        query:
          type: string
          maxLength: 500
        payee:
          type: string
          maxLength: 500
        category:
          type: string
          maxLength: 500
        group:
          type: string
          maxLength: 500
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
          description: Inclusive.
        type:
          type: string
          enum: [expense, income, any]
        minAmount:
          type: string
          pattern: "^-?[0-9]{1,15}([.][0-9]{1,6})?$"
          description: Absolute amount in major units.
        maxAmount:
          type: string
          pattern: "^-?[0-9]{1,15}([.][0-9]{1,6})?$"
          description: Absolute amount in major units.
        label:
          type: string
          maxLength: 200
    QueryContext:
      type: object
      additionalProperties: false
      properties:
        accountIds:
          type: array
          maxItems: 100
          description: Empty or omitted = every account.
          items:
            type: string
            format: uuid
        search:
          type: string
          maxLength: 500
        filters:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/ColumnFilter"
        period:
          $ref: "#/components/schemas/Period"
        includeTransfers:
          type: boolean
        groupId:
          type: string
          format: uuid
          description: Only this group's transactions (the group window's export).
        toolFilter:
          $ref: "#/components/schemas/ToolFilter"
    Sort:
      type: object
      additionalProperties: false
      required: [column]
      properties:
        column:
          $ref: "#/components/schemas/FilterColumn"
        dir:
          type: string
          enum: [asc, desc]
          default: asc
    TransactionQuery:
      type: object
      additionalProperties: false
      required: [context, limit]
      properties:
        context:
          $ref: "#/components/schemas/QueryContext"
        sort:
          $ref: "#/components/schemas/Sort"
        offset:
          type: integer
          minimum: 0
          default: 0
        limit:
          type: integer
          minimum: 1
          maximum: 500
        statColumn:
          type: string
          enum: [amount, balanceAfter]
        locateId:
          type: string
          format: uuid
        includeTotals:
          type: boolean
          default: true
          description: >-
            false skips total, stats, dataRange and duplicatesSkipped (they are omitted from the
            response). The grid sends it for the windows after the first while scrolling: those
            numbers don't change with the window (Phase 7 decision; docs/perf.md).
    NamedRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    TransactionRow:
      type: object
      additionalProperties: false
      required: [id, accountId, accountName, bookedOn, amount, payee, description, categorySource, bankCategory, txType, reference, counterpartyAccount, note, isTransfer]
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        accountName:
          type: string
        bookedOn:
          type: string
          format: date
        valueOn:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/Money"
        balanceAfter:
          $ref: "#/components/schemas/Money"
        payee:
          type: string
        description:
          type: string
        category:
          $ref: "#/components/schemas/NamedRef"
        categorySource:
          type: string
          enum: [none, bank, rule, manual]
        bankCategory:
          type: string
        txType:
          type: string
        reference:
          type: string
        counterpartyAccount:
          type: string
        note:
          type: string
        isTransfer:
          type: boolean
        group:
          $ref: "#/components/schemas/NamedRef"
    ResolvedPeriod:
      type: object
      additionalProperties: false
      required: [kind, from, to, label]
      properties:
        kind:
          type: string
          enum: [range, month, year]
        from:
          type: string
          format: date
        to:
          type: string
          format: date
          description: Exclusive.
        label:
          type: string
    DateRange:
      type: object
      additionalProperties: false
      required: [min, max]
      properties:
        min:
          type: string
          format: date
        max:
          type: string
          format: date
    ColumnStats:
      type: object
      additionalProperties: false
      required: [column]
      description: Over the period-scoped rows, in minor units; absent when no row has a value.
      properties:
        column:
          type: string
          enum: [amount, balanceAfter]
        sum:
          type: integer
          format: int64
        avg:
          type: integer
          format: int64
          description: Rounded to whole minor units.
        min:
          type: integer
          format: int64
        max:
          type: integer
          format: int64
    TransactionPage:
      type: object
      additionalProperties: false
      description: total, stats, dataRange and duplicatesSkipped are present unless the request set includeTotals to false.
      required: [rows, offset]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/TransactionRow"
        total:
          type: integer
          description: Rows in the period-scoped result.
        offset:
          type: integer
          description: The offset of `rows` (moved to the located row's window with `locateId`).
        period:
          $ref: "#/components/schemas/ResolvedPeriod"
        dataRange:
          $ref: "#/components/schemas/DateRange"
        stats:
          $ref: "#/components/schemas/ColumnStats"
        duplicatesSkipped:
          type: integer
          format: int64
        locatedOffset:
          type: integer
    DistinctRequest:
      type: object
      additionalProperties: false
      required: [context, column]
      properties:
        context:
          $ref: "#/components/schemas/QueryContext"
        column:
          $ref: "#/components/schemas/FilterColumn"
        search:
          type: string
          maxLength: 500
        limit:
          type: integer
          minimum: 1
          maximum: 600
          default: 600
    DistinctValue:
      type: object
      additionalProperties: false
      required: [value, count]
      properties:
        value:
          type: string
        count:
          type: integer
    IdsRequest:
      type: object
      additionalProperties: false
      required: [context, limit]
      properties:
        context:
          $ref: "#/components/schemas/QueryContext"
        sort:
          $ref: "#/components/schemas/Sort"
        offset:
          type: integer
          minimum: 0
          default: 0
        limit:
          type: integer
          minimum: 1
          maximum: 5000
    IdAmount:
      type: object
      additionalProperties: false
      required: [id, amountMinor]
      properties:
        id:
          type: string
          format: uuid
        amountMinor:
          type: integer
          format: int64
        groupId:
          type: string
          format: uuid
    ExportRequest:
      type: object
      additionalProperties: false
      required: [context, columns]
      properties:
        context:
          $ref: "#/components/schemas/QueryContext"
        sort:
          $ref: "#/components/schemas/Sort"
        columns:
          type: array
          minItems: 1
          maxItems: 15
          items:
            $ref: "#/components/schemas/FilterColumn"
        delimiter:
          type: string
          enum: [';', ',', '\t', '|']
          x-enum-varnames: [DelimiterSemicolon, DelimiterComma, DelimiterTab, DelimiterPipe]
          default: ';'
          description: '`\t` (backslash, t) means a tab.'
        view:
          type: string
          maxLength: 60
          description: Names the file (`finuance-<view>-<yyyy-mm-dd>.csv`); default `transactions`.
    TransactionSource:
      type: object
      additionalProperties: false
      required: [importId, filename, rowIndex, raw]
      properties:
        importId:
          type: string
          format: uuid
        filename:
          type: string
        committedAt:
          type: string
          format: date-time
        rowIndex:
          type: integer
        raw:
          type: array
          items:
            $ref: "#/components/schemas/RawField"
    TransactionDetail:
      allOf:
        - $ref: "#/components/schemas/TransactionRow"
        - type: object
          required: [origin, raw, sources, createdAt, updatedAt]
          properties:
            origin:
              type: string
              enum: [import, manual]
            raw:
              type: array
              items:
                $ref: "#/components/schemas/RawField"
            sources:
              type: array
              items:
                $ref: "#/components/schemas/TransactionSource"
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            transferSource:
              type: string
              enum: [none, pair, rule, manual]
              description: Why isTransfer is what it is (ADR 0018).
            transferPeer:
              $ref: "#/components/schemas/TransferPeer"
            categoryRule:
              $ref: "#/components/schemas/NamedRef"
    TransferPeer:
      type: object
      additionalProperties: false
      required: [id, accountName, bookedOn, amount]
      description: The other half of a detected transfer pair.
      properties:
        id:
          type: string
          format: uuid
        accountName:
          type: string
        bookedOn:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/Money"
    TransactionPatch:
      type: object
      additionalProperties: false
      properties:
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
          minLength: 1
          maxLength: 80
        resetCategory:
          type: boolean
          description: Back to the bank's category (or none).
        note:
          type: string
          maxLength: 2000
        transfer:
          type: string
          enum: ["yes", "no", auto]
          description: >-
            The user's transfer decision: `yes` marks it, `no` says it isn't one (a detected pair is
            unpaired on both sides), `auto` hands it back to the rules and the detection.
        bookedOn:
          type: string
          format: date
          description: Transactions added by hand only (`422` for imported ones), like the three below.
        amountMinor:
          type: integer
          format: int64
          description: Negative = money out; never zero.
        payee:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 500
    Friend:
      type: object
      additionalProperties: false
      required: [id, displayName, since]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        since:
          type: string
          format: date-time
    FriendCode:
      type: object
      additionalProperties: false
      required: [code, expiresAt]
      properties:
        code:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}$"
          example: K7Q4-9MZD
        expiresAt:
          type: string
          format: date-time
    FriendCodeInput:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 20
          description: Case, spaces and dashes don't matter.
    NotificationKind:
      type: string
      enum: [friend.added, friend.removed, shared.invited, shared.joined, shared.left, shared.expense_added, shared.settled]
    SharedGroupKind:
      type: string
      enum: [trip, household, event, other]
    SharedMember:
      type: object
      additionalProperties: false
      required: [id, displayName, role, state, isMe, former]
      description: Someone in a group as the others see them; never an e-mail address.
      properties:
        id:
          type: string
          format: uuid
          description: The member id (not a user id).
        displayName:
          type: string
        role:
          type: string
          enum: [owner, member]
        state:
          type: string
          enum: [invited, active, left]
        isMe:
          type: boolean
        former:
          type: boolean
          description: The user deleted their account ("Former member").
    SharedGroup:
      type: object
      additionalProperties: false
      required: [id, name, color, currency, kind, archived, createdAt, me]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: integer
          minimum: 0
          maximum: 7
        currency:
          type: string
        kind:
          $ref: "#/components/schemas/SharedGroupKind"
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        budgetMinor:
          type: integer
          format: int64
        archived:
          type: boolean
        createdAt:
          type: string
          format: date-time
        me:
          $ref: "#/components/schemas/SharedMember"
        linkedGroupId:
          type: string
          format: uuid
          description: The caller's own personal group linked to this one, if any.
    SharedGroupInput:
      type: object
      additionalProperties: false
