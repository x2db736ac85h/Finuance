        day:
          type: string
          format: date
        imports:
          type: integer
          format: int64
        questions:
          type: integer
          format: int64
          description: Questions asked to the assistant.
    InstanceUsage:
      type: object
      additionalProperties: false
      required: [totals, accounts, transactions, imports, storedBytes, days]
      properties:
        totals:
          $ref: "#/components/schemas/UserTotals"
        accounts:
          type: integer
          format: int64
        transactions:
          type: integer
          format: int64
        imports:
          type: integer
          format: int64
        storedBytes:
          type: integer
          format: int64
        days:
          type: array
          items:
            $ref: "#/components/schemas/DayUsage"
    ThemeColours:
      type: object
