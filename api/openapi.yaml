        days:
          type: integer
    TimelineHint:
      type: object
      additionalProperties: false
      required: [groupId, kind, ratio]
      description: >-
        A "next time" fact; the browser writes the sentence. `category_high`: this group's
        spending per day on `category` was `ratio` × the average of the other groups of its kind.
        `per_day_high`: its spending per day was `ratio` × their median. `over_budget`: spent
        `ratio` × its budget.
      properties:
        groupId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [category_high, per_day_high, over_budget]
        category:
          type: string
        ratio:
          type: number
          format: double
    GroupTimeline:
      type: object
      additionalProperties: false
      required: [groups, years, hints]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/TimelineGroup"
        years:
          type: array
          items:
            $ref: "#/components/schemas/TimelineYear"
        hints:
          type: array
          items:
            $ref: "#/components/schemas/TimelineHint"
    Notification:
      type: object
      additionalProperties: false
