      properties:
        from:
          type: string
          format: uuid
        to:
          type: string
          format: uuid
        amountMinor:
          type: integer
          format: int64
          minimum: 1
        settledOn:
          type: string
          format: date
        note:
          type: string
          maxLength: 500
    SharedBalance:
      type: object
      additionalProperties: false
      required: [memberId, balanceMinor]
      properties:
        memberId:
          type: string
          format: uuid
