        bookedOn:
          type: string
          format: date
        amountMinor:
          type: integer
          format: int64
        payee:
          type: string
          maxLength: 200
        category:
          type: string
          maxLength: 80
        note:
          type: string
          maxLength: 2000
        paidBy:
          type: string
          format: uuid
          description: A member id; default the caller.
