# CI / E2E overlay (PLAN task 8.13): images built from this checkout, a throwaway database volume,
# FINUANCE_ENV=test, web on :8000. Used by `make test-e2e` and the CI e2e job.
name: finuance-ci
services:
  db:
    ports: !reset []
    volumes: !override
      - ../db/bootstrap.sql:/finuance/bootstrap.sql:ro
      - ../db/initdb:/docker-entrypoint-initdb.d:ro
    tmpfs: [/var/lib/postgresql]
  api:
    ports: !reset []
    environment:
      FINUANCE_ENV: test
      FINUANCE_ALLOW_SIGNUP: "true"
      # E2E talks to the mock model server (PLAN task 13.8); no real model is needed in CI.
      FINUANCE_AI_BASE_URL: http://ai-mock:11434/v1
      FINUANCE_AI_DEFAULT_MODEL: mock-tools
      # the Developer section, checked by e2e/admin (docs/admin.md)
      FINUANCE_DEVELOPER_MODE: "true"
      FINUANCE_DEVELOPER_LINKS_FILE: /etc/finuance/developer/links.example.json
  ai-mock:
    profiles: !reset []
  worker:
    ports: !reset []
    environment:
      FINUANCE_ENV: test
  web:
    ports: !override
      - "127.0.0.1:8000:8080"
