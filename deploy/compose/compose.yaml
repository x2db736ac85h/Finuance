# Development stack: db → migrate (one-shot) → api + worker → web (http://localhost:8000).
# Run through the Makefile (make up / down / logs, make db-up …), which passes --env-file .env.
# The api (:8080) and admin (:9090, :9091) ports are published on localhost for debugging;
# compose.prod.yaml publishes only web.
name: finuance

services:
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      FINUANCE_OWNER_PASSWORD: ${FINUANCE_OWNER_PASSWORD:?set FINUANCE_OWNER_PASSWORD in .env}
      FINUANCE_APP_PASSWORD: ${FINUANCE_APP_PASSWORD:?set FINUANCE_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:${FINUANCE_DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep data under a major-version subdirectory of /var/lib/postgresql.
      - db-data:/var/lib/postgresql
      - ../db/bootstrap.sql:/finuance/bootstrap.sql:ro
      - ../db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d finuance"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    image: finuance-backend:dev
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    command: ["migrate", "up"]
    environment:
      FINUANCE_MIGRATE_DATABASE_URL: postgres://finuance_owner:${FINUANCE_OWNER_PASSWORD}@db:5432/finuance?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: finuance-backend:dev
    command: ["serve"]
    environment:
      FINUANCE_ENV: ${FINUANCE_ENV:-dev}
      FINUANCE_LOG_LEVEL: ${FINUANCE_LOG_LEVEL:-info}
      FINUANCE_PUBLIC_ORIGIN: ${FINUANCE_PUBLIC_ORIGIN:-http://localhost:8000}
      FINUANCE_DATABASE_URL: postgres://finuance_app:${FINUANCE_APP_PASSWORD}@db:5432/finuance?sslmode=disable
      FINUANCE_COOKIE_SECURE: ${FINUANCE_COOKIE_SECURE:-false}
      FINUANCE_ALLOW_SIGNUP: ${FINUANCE_ALLOW_SIGNUP:-true}
      FINUANCE_OTEL_EXPORTER_OTLP_ENDPOINT: ${FINUANCE_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # web (nginx) forwards the client address; trust it from the Compose network only.
      FINUANCE_TRUSTED_PROXIES: ${FINUANCE_TRUSTED_PROXIES:-172.16.0.0/12}
      # Assistant (docs/assistant.md): one server, or a connections file mounted into the container.
      # With `--profile ai-mock`, point FINUANCE_AI_BASE_URL at http://ai-mock:11434/v1.
      FINUANCE_AI_BASE_URL: ${FINUANCE_AI_BASE_URL:-}
      FINUANCE_AI_API: ${FINUANCE_AI_API:-}
      FINUANCE_AI_API_KEY: ${FINUANCE_AI_API_KEY:-}
      FINUANCE_AI_DEFAULT_MODEL: ${FINUANCE_AI_DEFAULT_MODEL:-}
      FINUANCE_AI_ALLOW_REMOTE: ${FINUANCE_AI_ALLOW_REMOTE:-}
      FINUANCE_AI_CONNECTIONS_FILE: ${FINUANCE_AI_CONNECTIONS_FILE:-}
    ports:
      - "127.0.0.1:8080:8080" # API
      - "127.0.0.1:9090:9090" # admin (/metrics, pprof) — published in dev only, never via an ingress
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/finuance", "healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  worker:
    image: finuance-backend:dev
    command: ["worker"]
    environment:
      FINUANCE_ENV: ${FINUANCE_ENV:-dev}
      FINUANCE_LOG_LEVEL: ${FINUANCE_LOG_LEVEL:-info}
      FINUANCE_DATABASE_URL: postgres://finuance_app:${FINUANCE_APP_PASSWORD}@db:5432/finuance?sslmode=disable
      FINUANCE_OTEL_EXPORTER_OTLP_ENDPOINT: ${FINUANCE_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # The worker serves only the admin port; point the healthcheck subcommand at it.
      FINUANCE_HTTP_ADDR: ":9090"
    ports:
      - "127.0.0.1:9091:9090" # admin (/metrics, /readyz) — dev only
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/finuance", "healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # A mock model server (testutil/llmmock) for UI work and E2E without a model: docker compose
  # --profile ai-mock up, with FINUANCE_AI_BASE_URL=http://ai-mock:11434/v1.
  ai-mock:
    image: finuance-llmmock:dev
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
      target: llmmock
    profiles: [ai-mock]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  web:
    image: finuance-web:dev
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    environment:
      FINUANCE_API_UPSTREAM: api:8080
    ports:
      - "127.0.0.1:${FINUANCE_WEB_PORT:-8000}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped
    read_only: true
    # nginx writes its config (from the template), pid file and temp files here
    tmpfs: ["/etc/nginx/conf.d:uid=101,gid=101", "/tmp:uid=101,gid=101"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  db-data:
