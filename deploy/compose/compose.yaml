# Development stack: db → migrate (one-shot) → api. The worker joins in Phase 6, web in Phase 8.
# Run through the Makefile (make up / down / logs, make db-up …), which passes --env-file .env.
name: finuance

services:
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      FINUANCE_OWNER_PASSWORD: ${FINUANCE_OWNER_PASSWORD:?set FINUANCE_OWNER_PASSWORD in .env}
      FINUANCE_APP_PASSWORD: ${FINUANCE_APP_PASSWORD:?set FINUANCE_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:${FINUANCE_DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep data under a major-version subdirectory of /var/lib/postgresql.
      - db-data:/var/lib/postgresql
      - ../db/bootstrap.sql:/finuance/bootstrap.sql:ro
      - ../db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d finuance"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    image: finuance-backend:dev
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    command: ["migrate", "up"]
    environment:
      FINUANCE_MIGRATE_DATABASE_URL: postgres://finuance_owner:${FINUANCE_OWNER_PASSWORD}@db:5432/finuance?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: finuance-backend:dev
    command: ["serve"]
    environment:
      FINUANCE_ENV: ${FINUANCE_ENV:-dev}
      FINUANCE_LOG_LEVEL: ${FINUANCE_LOG_LEVEL:-info}
      FINUANCE_PUBLIC_ORIGIN: ${FINUANCE_PUBLIC_ORIGIN:-http://localhost:8000}
      FINUANCE_DATABASE_URL: postgres://finuance_app:${FINUANCE_APP_PASSWORD}@db:5432/finuance?sslmode=disable
      FINUANCE_COOKIE_SECURE: ${FINUANCE_COOKIE_SECURE:-false}
      FINUANCE_ALLOW_SIGNUP: ${FINUANCE_ALLOW_SIGNUP:-true}
      FINUANCE_OTEL_EXPORTER_OTLP_ENDPOINT: ${FINUANCE_OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:8080:8080" # API
      - "127.0.0.1:9090:9090" # admin (/metrics, pprof) — published in dev only, never via an ingress
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/finuance", "healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  db-data:
