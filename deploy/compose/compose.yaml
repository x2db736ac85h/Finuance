# Development stack. Phase 0: database only; api, worker and web services arrive in Phases 2 and 8.
# Run through the Makefile (make db-up / db-down / db-reset / db-psql), which passes --env-file .env.
name: finuance

services:
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      FINUANCE_OWNER_PASSWORD: ${FINUANCE_OWNER_PASSWORD:?set FINUANCE_OWNER_PASSWORD in .env}
      FINUANCE_APP_PASSWORD: ${FINUANCE_APP_PASSWORD:?set FINUANCE_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:${FINUANCE_DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep data under a major-version subdirectory of /var/lib/postgresql.
      - db-data:/var/lib/postgresql
      - ../db/bootstrap.sql:/finuance/bootstrap.sql:ro
      - ../db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d finuance"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  db-data:
