# Prometheus of the local observability profile (compose.observability.yaml, PLAN 17.3): the
# grafana/otel-lgtm 0.36.0 image's own configuration (OTLP receiver settings below, unchanged) plus
# scrapes of the api and worker with the job and namespace labels the Kubernetes PodMonitor sets,
# and the chart's recording and alert rules (rules.yaml, rendered by tools/check-observability.sh),
# so the same dashboards work here and on the cluster.
global:
  scrape_native_histograms: true
otlp:
  keep_identifying_resource_attributes: true
  # Recommended attributes to be promoted to labels.
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment # backward compatibility
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - host.name
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name
    - database # used by otelcol/receiver/mongodb
    - kafka.cluster.alias
storage:
  tsdb:
    # A 10min time window is enough because it can easily absorb retries and network delays.
    out_of_order_time_window: 10m

rule_files: [/finuance/rules.yaml]
scrape_configs:
  - job_name: finuance-api
    scrape_interval: 15s
    static_configs:
      - targets: ["api:9090"]
        labels: { namespace: finuance, pod: api }
  - job_name: finuance-worker
    scrape_interval: 15s
    static_configs:
      - targets: ["worker:9090"]
        labels: { namespace: finuance, pod: worker }
