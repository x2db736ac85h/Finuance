# Generated by tools/check-observability.sh from deploy/k8s/observability (ci/compose-values.yaml).
# UPDATE=1 tools/check-observability.sh rewrites it.
groups:
  - name: finuance-slo.rules
    rules:
      # "or vector(0)": with no 5xx at all the series doesn't exist, and the ratio would be empty
      # instead of 0 (no burn rate, blank dashboards).
      - record: finuance:slo_availability:error_ratio_rate5m
        expr: |
          (sum(rate(http_server_requests_total{job="finuance-api",namespace="finuance",route!~"GET /(healthz|readyz)|.*/assistant/.*|unmatched",status_class="5xx"}[5m])) or vector(0))
          /
          sum(rate(http_server_requests_total{job="finuance-api",namespace="finuance",route!~"GET /(healthz|readyz)|.*/assistant/.*|unmatched"}[5m]))
      - record: finuance:slo_latency:error_ratio_rate5m
        expr: |
          1 - (
            sum(rate(http_server_request_duration_seconds_bucket{job="finuance-api",namespace="finuance",route=~"POST /api/v1/(transactions/query|insights/.*)",le="0.3"}[5m]))
            /
            sum(rate(http_server_request_duration_seconds_count{job="finuance-api",namespace="finuance",route=~"POST /api/v1/(transactions/query|insights/.*)"}[5m]))
          )
      # "or vector(0)": with no 5xx at all the series doesn't exist, and the ratio would be empty
      # instead of 0 (no burn rate, blank dashboards).
