          /
          sum(rate(http_server_requests_total{job="finuance-api",namespace="finuance",route!~"GET /(healthz|readyz)|.*/assistant/.*|unmatched"}[30m]))
      - record: finuance:slo_latency:error_ratio_rate30m
        expr: |
          1 - (
