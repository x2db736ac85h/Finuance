# Finuance web server (PLAN task 8.11, §8.1). A template: the image substitutes FINUANCE_* variables
# at start-up (FINUANCE_API_UPSTREAM, FINUANCE_MAX_BODY) into /etc/nginx/conf.d/default.conf.

# Hashed assets never change; everything else is revalidated. API responses keep their own
# Cache-Control (an empty value adds no header).
map $uri $finuance_cache {
    ~^/api/         "";
    ~^/assets/      "public, max-age=31536000, immutable";
    default         "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Uploads: FINUANCE_MAX_UPLOAD_BYTES (20 MiB by default) plus the multipart framing.
    client_max_body_size ${FINUANCE_MAX_BODY};

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/csv;

    # Security headers (§8.1). `always` adds them to error responses too. HSTS belongs to the ingress.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control $finuance_cache always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://${FINUANCE_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Streams (CSV export, zip export, the assistant's server-sent events) go straight through;
        # the assistant sends a comment every 15 s, well inside the read timeout.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        # The API sets its own caching and security headers.
        proxy_hide_header X-Powered-By;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # The single-page app: any other path is a client-side route.
    location / {
        try_files $uri /index.html;
    }
}
