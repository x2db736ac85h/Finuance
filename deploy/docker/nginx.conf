# Finuance web server (PLAN task 8.11, §8.1). A template: the image substitutes FINUANCE_* variables
# at start-up (FINUANCE_API_UPSTREAM, FINUANCE_MAX_BODY) into /etc/nginx/conf.d/default.conf.

# Hashed assets never change; everything else is revalidated. API responses keep their own
# Cache-Control (an empty value adds no header).
map $uri $finuance_cache {
    ~^/api/         "";
    ~^/assets/      "public, max-age=31536000, immutable";
    default         "no-cache";
}

# The api, through a pool of kept-alive connections (proxy_http_version 1.1 and an empty
# Connection header below). Without the pool, every request opened a new connection, and each
# closed one held a local port for a minute (TIME_WAIT): the weekly ZAP scan's request rate used
# up all of them, and nginx answered 502 ("connect() failed (99: Address not available)").
# nginx closes idle connections after 60 s, before the api's own 120 s idle timeout, so it never
# reuses one that the api is closing.
upstream finuance_api {
    server ${FINUANCE_API_UPSTREAM};
    keepalive 32;
    keepalive_timeout 60s;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Its own redirects (/api → /api/) are relative: an absolute one would name the container's
    # port 8080, not the public address (found by the Phase 17 ZAP run).
    absolute_redirect off;
    # Uploads: FINUANCE_MAX_UPLOAD_BYTES (20 MiB by default) plus the multipart framing.
    client_max_body_size ${FINUANCE_MAX_BODY};

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/csv;

    # Security headers (§8.1). `always` adds them to error responses too. HSTS belongs to the ingress.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Nothing is loaded from or by another origin: other sites may not embed these responses, and
    # pages load only resources that allow it (all of them same-origin). Found by the weekly ZAP run.
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cache-Control $finuance_cache always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://finuance_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Streams (CSV export, zip export, the assistant's server-sent events) go straight through;
        # the assistant sends a comment every 15 s, well inside the read timeout.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        # The API sets its own caching headers. Of its security headers, drop the ones this server
        # adds itself (above), so each arrives once (found by the Phase 17 ZAP run).
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # The single-page app: any other path is a client-side route.
    location / {
        try_files $uri /index.html;
    }
}
