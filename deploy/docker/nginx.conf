# Finuance web server (PLAN task 8.11, §8.1). A template: the image substitutes FINUANCE_* variables
# at start-up (FINUANCE_API_UPSTREAM, FINUANCE_MAX_BODY, FINUANCE_MAX_LEGACY_BODY) into
# /etc/nginx/conf.d/default.conf.

# Hashed assets never change; everything else is revalidated. API responses keep their own
# Cache-Control (an empty value adds no header).
map $uri $finuance_cache {
    ~^/api/         "";
    ~^/assets/      "public, max-age=31536000, immutable";
    default         "no-cache";
}

# The access log, one JSON object per request (PLAN 23.4). It names the path without its query
# string ($uri, never $request or $args: a search is typed into the query string) and neither the
# referrer nor the user agent. $request_id is passed to the api as X-Request-ID, so a request has
# one id in this log, in the api's log and in the response.
log_format finuance escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,"bytes_sent":$body_bytes_sent,'
    '"request_length":$request_length,"request_time":$request_time,"upstream_time":"$upstream_response_time"}';

# The api, through a pool of kept-alive connections (proxy_http_version 1.1 and an empty
# Connection header below). Without the pool, every request opened a new connection, and each
# closed one held a local port for a minute (TIME_WAIT): the weekly ZAP scan's request rate used
# up all of them, and nginx answered 502 ("connect() failed (99: Address not available)").
# nginx closes idle connections after 60 s, before the api's own 120 s idle timeout, so it never
# reuses one that the api is closing.
upstream finuance_api {
    server ${FINUANCE_API_UPSTREAM};
    keepalive 32;
    keepalive_timeout 60s;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /var/log/nginx/access.log finuance;
    # Its own redirects (/api → /api/) are relative: an absolute one would name the container's
    # port 8080, not the public address (found by the Phase 17 ZAP run).
    absolute_redirect off;
    # Uploads: FINUANCE_MAX_UPLOAD_BYTES (20 MiB by default) plus the multipart framing.
    client_max_body_size ${FINUANCE_MAX_BODY};

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/csv;

    # Security headers (§8.1). `always` adds them to error responses too. HSTS belongs to the ingress.
    # Trusted Types: the app writes no HTML or script text into the page, and with this a line that
    # ever tries (a DOM sink fed with a string) fails instead of running. img-src keeps data: and
    # blob: for the receipt preview. A violation is reported to the api, which counts it and keeps
    # nothing of the report (PLAN 24.8); report-uri is for browsers that don't know report-to yet.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; worker-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; require-trusted-types-for 'script'; report-uri /api/v1/csp-reports; report-to csp" always;
    add_header Reporting-Endpoints 'csp="/api/v1/csp-reports"' always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Nothing is loaded from or by another origin: other sites may not embed these responses, and
    # pages load only resources that allow it (all of them same-origin). Found by the weekly ZAP run.
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cache-Control $finuance_cache always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://finuance_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # this server's id for the request, whatever the client sent
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        # Streams (CSV export, zip export, the assistant's server-sent events) go straight through;
        # the assistant sends a comment every 15 s, well inside the read timeout.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        # The API sets its own caching headers. Of its security headers, drop the ones this server
        # adds itself (above), so each arrives once (found by the Phase 17 ZAP run).
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;

        # The migration from the single-file app sends up to four files and their manifest in one
        # request (the api's own limit: 4 × the upload limit + 16 MiB). Everything else keeps the
        # server's limit above. The proxy settings are inherited; proxy_pass is not.
        location = /api/v1/legacy-imports {
            client_max_body_size ${FINUANCE_MAX_LEGACY_BODY};
            proxy_pass http://finuance_api;
        }
    }

    location /assets/ {
        try_files $uri =404;
    }

    # The single-page app: any other path is a client-side route.
    location / {
        try_files $uri /index.html;
    }
}
