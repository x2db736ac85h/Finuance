# Argo CD for the homelab (Phase 18, ADR 0022): chart argo/argo-cd 10.11.6 (Argo CD v3.5.6).
# helm upgrade --install argocd argo/argo-cd --version 10.11.6 -n argocd --create-namespace \
#   -f deploy/environments/homelab/argocd-values.yaml --wait   (docs/RUNBOOK.md "Bootstrap on single-node k3s")
# The UI is not exposed: `kubectl -n argocd port-forward svc/argocd-server 18443:443` (not 8443, see the
# RUNBOOK).

# no SSO: the built-in admin is the only user (single-person homelab)
dex:
  enabled: false

# alerts go through Alertmanager (deploy/k8s/observability), not Argo CD notifications
notifications:
  enabled: false

# the app-of-apps uses plain Applications only
applicationSet:
  replicas: 0

configs:
  cm:
    # Applications get a health status, so the root app's sync waves wait for each child app
    # (Argo CD's documented snippet; docs/RUNBOOK.md "Bootstrap (first install)" step 1).
    # "Missing" (a child app that hasn't synced yet, e.g. the manually synced finuance-db) counts as
    # Progressing, so the next waves wait for it instead of going ahead.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then hs.message = obj.status.health.message end
      end
      if hs.status == "Missing" then
        hs.status = "Progressing"
        hs.message = "waiting for the application's first sync"
      end
      return hs
