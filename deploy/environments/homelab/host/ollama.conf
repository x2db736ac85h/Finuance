# systemd drop-in for the distribution's ollama.service:
# /etc/systemd/system/ollama.service.d/finuance.conf
# (docs/RUNBOOK.md "Bootstrap on single-node k3s", ADR 0020/0022).
[Service]
# Listen on every address so pods reach it through the host's tailnet address. The host firewall
# must drop input from the LAN; pods are allowed on cni0, and tailnet devices can reach it.
Environment="OLLAMA_HOST=0.0.0.0:11434"
# Small GPUs (4 GB): flash attention + an 8-bit KV cache keep a ~4B model with the app's
# 8,192-token context fully on the GPU (check `ollama ps`: 100% GPU). An fp16 cache spills layers
# to the CPU and roughly halves the output speed.
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
# Keep the model loaded between assistant questions (reloading takes seconds).
Environment="OLLAMA_KEEP_ALIVE=30m"
