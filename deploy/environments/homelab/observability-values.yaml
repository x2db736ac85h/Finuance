# Finuance's dashboards, SLO and alert rules and the alert receiver (deploy/k8s/observability) for the
# homelab (Phase 18.6; Argo CD app deploy/k8s/argocd/apps/finuance-observability.yaml). The e-mail
# receiver (provider and addresses) is switched on by the private overlay (ADR 0023; shape:
# observability-values.example.yaml); its password is the SealedSecret monitoring/finuance-alert-smtp
# (deploy/environments/homelab/monitoring/).
appNamespace: finuance
# k3s's bundled Traefik (kube-system), with router labels (host/traefik-config.yaml)
ingress:
  traefik:
    enabled: true
alerting:
  email:
    enabled: false
