# Homelab values for the Finuance chart (deploy/helm/finuance), applied by the Argo CD application
# deploy/k8s/argocd/apps/finuance.yaml. A merged change to this file is what deploys (GitOps).
# Per-machine values (host name, the model server's address) come from the private environment
# repository as a second Argo CD source (ADR 0023; example: host-values.example.yaml) and win.

image:
  # Bumped by release.yml (a pull request per release, vX.Y.Z tags only).
  tag: "0.3.0"
# The images are private: a registry login that may only read packages
# (tools/seal-secrets.sh homelab pull → secrets/ghcr-pull.sealed.yaml).
imagePullSecrets:
  - name: ghcr-pull

# Set by the private overlay (<host>); the placeholders here keep a render without it obviously wrong.
publicOrigin: https://finuance.homelab.invalid
ingress:
  className: traefik
  # k3s's Traefik: HTTPS only; port 80 ("web") just redirects (host/traefik-config.yaml)
  entryPoints: [websecure]
  host: finuance.homelab.invalid
  tls:
    # The host's Tailscale *.ts.net certificate (ADR 0022), put into this secret by
    # tools/tailscale-cert.sh on the host and renewed by its timer (docs/RUNBOOK.md).
    mode: secret
    secretName: finuance-tls

allowSignup: false
# The cluster's pod CIDR (k3s), where Traefik's pods live.
trustedProxies: "10.42.0.0/16"

database:
  host: finuance-db-rw

networkPolicy:
  enabled: true
  # k3s's bundled Traefik (checked on the cluster: kube-system, app.kubernetes.io/name=traefik).
  ingressController:
    namespaceSelector:
      matchLabels: { kubernetes.io/metadata.name: kube-system }
    podSelector:
      matchLabels: { app.kubernetes.io/name: traefik }

assistant:
  # Ollama on the host (ADR 0020/0022); its connections file and egress rule come from the overlay.
  enabled: true

# Administration → Developer (docs/admin.md): administrators see the build and these links. Every
# tool is reached through a port-forward from the machine (none is exposed), so the links point at
# localhost and the notes say how to get in; credentials are read from the cluster, never written here.
developer:
  enabled: true
  source: https://github.com/x2db736ac85h/finuance
  links:
    - group: Observability
      name: Grafana
      url: http://localhost:3000
      note: Dashboards, traces (Tempo) and the SLOs. Start the port-forward on the machine, then open the link. User admin; the second command prints the password (sealed secret grafana-admin).
      commands:
        - kubectl -n monitoring port-forward svc/kube-prometheus-stack-grafana 3000:80
        - kubectl -n monitoring get secret grafana-admin -o jsonpath='{.data.admin-password}' | base64 -d; echo
    - group: Observability
      name: Prometheus
      url: http://localhost:9090
      note: Targets, rules and queries. No sign-in; only through the port-forward.
      commands:
        - kubectl -n monitoring port-forward svc/kube-prometheus-stack-prometheus 9090:9090
    - group: Observability
      name: Alertmanager
      url: http://localhost:9093
      note: Firing alerts and silences; alerts are e-mailed (docs/RUNBOOK.md step 13). No sign-in; only through the port-forward.
      commands:
        - kubectl -n monitoring port-forward svc/kube-prometheus-stack-alertmanager 9093:9093
    - group: Deployment
      name: Argo CD
      url: https://localhost:8443
      note: Sync state of every app. User admin with the password chosen at the bootstrap (the initial secret is deleted; it lives in your password manager). The certificate is self-signed.
      commands:
        - kubectl -n argocd port-forward svc/argocd-server 8443:443
    - group: CI/CD
      name: Actions
      url: https://github.com/x2db736ac85h/finuance/actions
      note: CI, releases, the weekly scans and the kind rehearsal. Needs a GitHub account that can read the repository.
    - group: CI/CD
      name: Releases
      url: https://github.com/x2db736ac85h/finuance/releases
    - group: CI/CD
      name: Pull requests
      url: https://github.com/x2db736ac85h/finuance/pulls
      note: Merging a release's gitops-bump pull request deploys it; reverting it rolls back (docs/RUNBOOK.md).
    - group: CI/CD
      name: Container images
      url: https://github.com/x2db736ac85h?tab=packages
      note: finuance-api and finuance-web on ghcr.io, signed with cosign.

otel:
  # Tempo in the monitoring namespace (OTLP over HTTP; deploy/k8s/argocd/apps/tempo.yaml).
  endpoint: http://tempo.monitoring.svc:4318/v1/traces
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
          podSelector:
            matchLabels: { app.kubernetes.io/name: tempo }
      ports: [4318]

podMonitor:
  # kube-prometheus-stack (deploy/k8s/argocd/apps/kube-prometheus-stack.yaml) scrapes api and worker.
  enabled: true
