# Homelab values for the Finuance chart (deploy/helm/finuance), applied by the Argo CD application
# deploy/k8s/argocd/apps/finuance.yaml. A merged change to this file is what deploys (GitOps).
# Per-machine values (host name, the model server's address) come from the private environment
# repository as a second Argo CD source (ADR 0023; example: host-values.example.yaml) and win.

image:
  # Bumped by release.yml (a pull request per release, vX.Y.Z tags only).
  tag: "0.1.0"

# Set by the private overlay (<host>); the placeholders here keep a render without it obviously wrong.
publicOrigin: https://finuance.homelab.invalid
ingress:
  className: traefik
  host: finuance.homelab.invalid
  tls:
    # The host's Tailscale *.ts.net certificate (ADR 0022), put into this secret by
    # tools/tailscale-cert.sh on the host and renewed by its timer (docs/RUNBOOK.md).
    mode: secret
    secretName: finuance-tls

allowSignup: false
# The cluster's pod CIDR (k3s), where Traefik's pods live.
trustedProxies: "10.42.0.0/16"

database:
  host: finuance-db-rw

networkPolicy:
  enabled: true
  # k3s's bundled Traefik (checked on the cluster: kube-system, app.kubernetes.io/name=traefik).
  ingressController:
    namespaceSelector:
      matchLabels: { kubernetes.io/metadata.name: kube-system }
    podSelector:
      matchLabels: { app.kubernetes.io/name: traefik }

assistant:
  # Ollama on the host (ADR 0020/0022); its connections file and egress rule come from the overlay.
  enabled: true

otel:
  # Phase 18.6: the collector of the observability stack.
  endpoint: ""

podMonitor:
  # Phase 18.6: on once the Prometheus Operator runs.
  enabled: false
