# Rendered by the CI helm job: every optional part on.
publicOrigin: https://finuance.example.com
ingress:
  host: finuance.example.com
  tls:
    mode: certManager
    clusterIssuer: letsencrypt
assistant:
  enabled: true
  connectionsFile: |
    {"connections":[{"name":"lmstudio","label":"LM Studio","api":"openai","baseUrl":"http://192.168.1.20:1234/v1"}]}
  envSecret: finuance-assistant
  instanceKeySecret: finuance-instance-key
  egress:
    - cidr: 192.168.1.20/32
      ports: [1234]
otel:
  endpoint: http://otel-collector.observability:4318/v1/traces
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: observability }
      ports: [4318]
podMonitor:
  enabled: true
extraEnv:
  FINUANCE_AI_RATE_PER_HOUR: "60"
developer:
  enabled: true
  source: https://github.com/example/finuance
  links:
    - group: Observability
      name: Grafana
      url: http://localhost:3000
      note: User admin; the second command prints the password.
      commands:
        - kubectl -n monitoring port-forward svc/kube-prometheus-stack-grafana 3000:80
        - kubectl -n monitoring get secret grafana-admin -o jsonpath='{.data.admin-password}' | base64 -d
    - name: Actions
      url: https://github.com/example/finuance/actions
