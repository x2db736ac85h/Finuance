{{- $name := include "finuance.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-api
  labels:
    {{- include "finuance.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  # A new pod must be ready (migrations applied: /readyz) before an old one stops.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "finuance.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "finuance.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "finuance.podSecurity" (dict "uid" 65532) | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "finuance.selector" (dict "root" . "component" "api") | nindent 14 }}
      containers:
        - name: api
          image: {{ include "finuance.image" (dict "root" . "name" .Values.image.api) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 9090 }
          envFrom:
            - configMapRef:
                name: {{ $name }}-env
            {{- if and .Values.assistant.enabled .Values.assistant.envSecret }}
            - secretRef:
                name: {{ .Values.assistant.envSecret }}
            {{- end }}
          env:
            {{- include "finuance.dbPassword" .Values.database.app | nindent 12 }}
            {{- if and .Values.assistant.enabled .Values.assistant.connectionsFile }}
            # Only the api mounts the connections file (the worker would fail its config check
            # on a path it doesn't have).
            - name: FINUANCE_AI_CONNECTIONS_FILE
              value: /etc/finuance/connections.json
            {{- end }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          # /readyz gives its checks 2 s and reports a database that only answers slowly as busy, not
          # down (httpapi busyGrace): under load every replica waits on the same database, and a 1 s
          # probe took them all out of the Service at once (Phase 18 load test).
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.api.preStopSleep }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "finuance.containerSecurity" . | nindent 12 }}
          {{- if and .Values.assistant.enabled .Values.assistant.connectionsFile }}
          volumeMounts:
            - name: assistant
              mountPath: /etc/finuance
              readOnly: true
          {{- end }}
      {{- if and .Values.assistant.enabled .Values.assistant.connectionsFile }}
      volumes:
        - name: assistant
          configMap:
            name: {{ $name }}-assistant
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-api
  labels:
    {{- include "finuance.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "finuance.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: metrics, port: 9090, targetPort: metrics }
