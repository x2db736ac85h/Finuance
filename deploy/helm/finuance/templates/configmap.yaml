apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "finuance.fullname" . }}-env
  labels:
    {{- include "finuance.labels" . | nindent 4 }}
data:
  FINUANCE_ENV: prod
  FINUANCE_LOG_LEVEL: {{ .Values.logLevel | quote }}
  FINUANCE_PUBLIC_ORIGIN: {{ required "publicOrigin is required (e.g. https://finance.example.com)" .Values.publicOrigin | quote }}
  FINUANCE_COOKIE_SECURE: "true"
  FINUANCE_ALLOW_SIGNUP: {{ .Values.allowSignup | quote }}
  FINUANCE_TRUSTED_PROXIES: {{ .Values.trustedProxies | quote }}
  FINUANCE_MAX_UPLOAD_BYTES: {{ .Values.maxUploadBytes | int64 | quote }}
  FINUANCE_DB_MAX_CONNS: {{ .Values.database.maxConns | quote }}
  FINUANCE_DATABASE_URL: {{ include "finuance.dbURL" (dict "root" . "user" .Values.database.app.user) | quote }}
  {{- with .Values.otel.endpoint }}
  FINUANCE_OTEL_EXPORTER_OTLP_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- if and .Values.assistant.enabled .Values.assistant.connectionsFile }}
  FINUANCE_AI_CONNECTIONS_FILE: /etc/finuance/connections.json
  {{- end }}
  {{- range $k, $v := .Values.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- if and .Values.assistant.enabled .Values.assistant.connectionsFile }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "finuance.fullname" . }}-assistant
  labels:
    {{- include "finuance.labels" . | nindent 4 }}
data:
  connections.json: |
    {{- .Values.assistant.connectionsFile | nindent 4 }}
{{- end }}
