{{- range $component := list "api" "web" }}
{{- with (index $.Values $component).podDisruptionBudget }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "finuance.fullname" $ }}-{{ $component }}
  labels:
    {{- include "finuance.labels" $ | nindent 4 }}
spec:
  minAvailable: {{ .minAvailable }}
  selector:
    matchLabels:
      {{- include "finuance.selector" (dict "root" $ "component" $component) | nindent 6 }}
{{- end }}
{{- end }}
