apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "finuance.fullname" . }}
  labels:
    {{- include "finuance.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No pod talks to the Kubernetes API.
automountServiceAccountToken: false
