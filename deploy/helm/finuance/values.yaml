# Finuance Helm chart (PLAN task 16.1). The database is not part of the chart: it comes from the
# CloudNativePG cluster in deploy/k8s/db (or any PostgreSQL prepared with deploy/db/bootstrap.sql).
# Homelab-specific values live in deploy/environments/homelab/values.yaml.

image:
  registry: ghcr.io/x2db736ac85h
  api: finuance-api
  web: finuance-web
  # Empty: the chart's appVersion.
  tag: ""
  # Deploy by digest: set both (sha256:…, the multi-platform index the release signed). The images
  # are then registry/name@digest, and the tag only labels the release. release.yml writes them
  # into an environment's values together with the tag (tools/bump-homelab-tag.sh).
  digests:
    api: ""
    web: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The address users open, e.g. https://finance.example.com (cookies, CSRF origin check). Required.
publicOrigin: ""
logLevel: info
# /debug/pprof on the admin port of the api and the worker (FINUANCE_PPROF). Off: whoever may scrape
# the metrics could otherwise also pull heap dumps. Switch it on for a profiling session, then off.
profiling: false
# New accounts can sign up when true; otherwise an admin creates them (finuance admin create-user).
allowSignup: false
# A lab for the traffic simulator (PLAN 25.9, ADR 0043): synthetic users can exist and sign in, and
# /meta says so. Never on an instance with real data. With a seed secret, a job makes the
# simulator's personas after every install and upgrade (finuance admin synthetic-users; a second
# run changes nothing). deploy/environments/lab/ sets both.
simulation:
  enabled: false
  syntheticUsers:
    count: 10
    # the simulator's seed (FINUANCE_SIM_SEED), a key of an existing Secret; empty name: no job
    seedSecret: { name: "", key: seed }
# Addresses whose X-Forwarded-For is trusted (the ingress controller's pods). k3s pods use
# 10.42.0.0/16 by default. A range is safe only because the network policies let nothing but the
# ingress controller and the web pods reach the api; the chart refuses a range with them off.
trustedProxies: "10.42.0.0/16"
# Upload limit for one CSV file (bytes); the ingress must allow at least this much.
maxUploadBytes: 20971520
# Further non-secret settings, FINUANCE_* name → value (strings).
extraEnv: {}

database:
  # The CloudNativePG read-write service (<cluster>-rw), or any PostgreSQL host.
  host: finuance-db-rw
  port: 5432
  name: finuance
  # require encrypts without checking who answers. verify-full also checks the server's certificate
  # and name against the authority in caSecret; use it wherever the database offers one
  # (CloudNativePG keeps its authority in the secret <cluster>-ca, key ca.crt).
  sslmode: require
  caSecret:
    name: ""
    key: ca.crt
  maxConns: 10
  # Passwords come from basic-auth secrets (keys username/password), the same ones the CNPG managed
  # roles use. They reach the processes as PGPASSWORD, so the URLs never hold a password.
  app:
    user: finuance_app
    passwordSecret: finuance-db-app
    passwordKey: password
  owner:
    user: finuance_owner
    passwordSecret: finuance-db-owner
    passwordKey: password

assistant:
  enabled: false
  # The connections file (JSON, docs/assistant.md), mounted at /etc/finuance/connections.json.
  connectionsFile: ""
  # An existing secret whose keys become environment variables (the API keys the file names with
  # apiKeyEnv). Empty: none.
  envSecret: ""
  # A secret holding FINUANCE_INSTANCE_KEY (tools/seal-secrets.sh <env> instance-key), which seals the
  # API keys of connections added in Administration → Assistant (ADR 0035). Empty: such keys can't be
  # stored (connections without a key still can).
  instanceKeySecret: ""
  # Where the api and the worker (digests) may connect when the assistant is on (NetworkPolicy egress): the model servers,
  # as a `cidr` outside the cluster or `to` peers inside it.
  egress: []
  #  - cidr: 192.168.1.20/32
  #    ports: [1234]
  #  - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ollama } } }]
  #    ports: [11434]

developer:
  # Administration → Developer (docs/admin.md): the build, the source repository and links to the
  # tools around the instance, each with a note on how to get in; administrators only (everyone
  # else gets 404). Never on a public demo: the app refuses it together with FINUANCE_DEMO_MODE.
  enabled: false
  # The source repository (http/https); on GitHub the build's commit and release are linked too.
  source: ""
  # Up to 40 links: group (heading), name, url (http/https, no user:password), note (how to get in
  # or where the credentials are; never the credential itself), commands (up to 4, each with Copy).
  # Mounted for the api only at /etc/finuance-developer/links.json.
  links: []
  #  - group: Observability
  #    name: Grafana
  #    url: http://localhost:3000
  #    note: User admin; the second command prints the password.
  #    commands:
  #      - kubectl -n monitoring port-forward svc/kube-prometheus-stack-grafana 3000:80
  #      - kubectl -n monitoring get secret grafana-admin -o jsonpath='{.data.admin-password}' | base64 -d

otel:
  # The full OTLP/HTTP traces URL, path included, e.g. http://tempo.monitoring.svc:4318/v1/traces:
  # the app sends to exactly this URL (a bare host:4318 gets 404 from the collector; the schema
  # refuses it). Empty: off.
  endpoint: ""
  # The share of requests that are traced, 0 to 1. A request is traced whole or not at all, and a
  # job follows the request that queued it. 1 (everything) suits a small instance.
  sampleRatio: 1
  # More resource attributes for every span, as a map (e.g. region: home). The chart already adds
  # the pod, the namespace and service.instance.id from the pod's own fields.
  resourceAttributes: {}
  # NetworkPolicy egress to the collector: entries with ports and `to` (peers, e.g. a
  # namespaceSelector) or a `cidr` outside the cluster.
  egress: []

api:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    minAvailable: 1
  # Seconds a stopping pod keeps serving after it leaves the endpoints (lets Traefik notice).
  preStopSleep: 5
  terminationGracePeriodSeconds: 45

worker:
  # One replica: each one writes the assistant's digests one at a time (ADR 0033).
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  terminationGracePeriodSeconds: 45

web:
  replicas: 2
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }
  preStopSleep: 5
  podDisruptionBudget:
    minAvailable: 1

migrations:
  # Runs `finuance migrate up` as the owner role before every install and upgrade (Helm hook and
  # Argo CD PreSync).
  enabled: true
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400

ingress:
  enabled: true
  className: traefik
  # Traefik entry points the routers attach to (e.g. [websecure]); empty: every entry point. A TLS
  # router on the plain-HTTP entry point would also answer TLS on port 80 (OpenVAS, Phase 18.8).
  entryPoints: []
  # The host name, e.g. finance.example.com or finuance.<tailnet>.ts.net. Required when enabled.
  host: ""
  tls:
    # certManager: cert-manager issues the certificate (clusterIssuer); traefik: Traefik's own ACME
    # resolver does (certResolver, configured in Traefik); secret: an existing TLS secret (e.g.
    # made by the Tailscale operator or by hand); none: plain HTTP (testing only).
    mode: certManager
    clusterIssuer: ""
    certResolver: ""
    secretName: finuance-tls
  # Strict-Transport-Security through a Traefik Middleware (traefik.io/v1alpha1).
  hsts:
    enabled: true
    maxAge: 31536000
  # Limits per client address at the ingress (Traefik Middlewares; PLAN 23.6, docs/deploying.md).
  # The application's own limiters count per replica and in memory (ADR 0012); these count once,
  # in front of every replica. Off by default: switch them on for an instance that the internet
  # can reach. Behind one shared address (a company NAT, a tunnel) every user counts as one client.
  limits:
    enabled: false
    # How Traefik finds the client's address: 0 is the address of the connection; N takes the Nth
    # address from the right of X-Forwarded-For, for N trusted proxies in front of Traefik.
    forwardedDepth: 0
    # Everything except /api/v1/auth/: `average` requests per `period`, with bursts up to `burst`.
    requests: { average: 50, period: 1s, burst: 200 }
    # /api/v1/auth/ (sign-in, sign-up, sign-out): a person needs a handful per session.
    auth: { average: 20, period: 1m, burst: 20 }
    # Requests in flight at once; an upload, an export and a streamed answer each hold one.
    inFlight: 50
  annotations: {}

# The pods' Kubernetes service account. Its annotations are how a cloud gives the pods an identity
# without a key (on Google Kubernetes Engine: iam.gke.io/gcp-service-account, for the assistant's
# connection to Vertex AI, ADR 0045). The pods never get a token for the Kubernetes API.
serviceAccount:
  annotations: {}

# The front door as Gateway API routes instead of the Ingress above (PLAN 27.1): for a cluster whose
# gateway controller is not Traefik, such as Google Kubernetes Engine's. Set ingress.enabled: false
# with it. The Gateway (address, listener, certificate) is the platform's; the chart attaches an
# HTTPRoute for /api/ and / to it. Limits per client address are then the gateway's or the cloud's
# (ingress.limits are Traefik middlewares and don't apply).
gateway:
  enabled: false
  # The host name the routes answer for. Required when enabled.
  host: ""
  # The Gateway to attach to: its name, its namespace when it is not the release's, and the
  # listener (sectionName) when the routes should use only one of several.
  parentRef:
    name: ""
    namespace: ""
    sectionName: ""
  # Strict-Transport-Security, added to every response by the route itself.
  hsts:
    enabled: true
    maxAge: 31536000
  # The longest /api/ request the gateway lets through (a Gateway API duration such as 3600s);
  # empty: the implementation's default. A streamed answer or an export can take minutes.
  apiTimeout: ""
  # Google Kubernetes Engine: its load balancer checks every backend itself and has its own timeout
  # per backend, set with GKE's policy kinds (networking.gke.io/v1).
  gke:
    enabled: false
    apiTimeoutSec: 3600
    # The name of a Cloud Armor security policy to put in front of both backends; empty: none.
    securityPolicy: ""

networkPolicy:
  enabled: true
  # The default deny selects every pod of the release's namespace, not only this chart's: a pod
  # there that no policy names has no network at all. Anything else that runs in the namespace
  # needs its own policy (the database chart in deploy/k8s/db brings one for its pods). Set it to
  # false only while such a policy is missing.
  namespaceWide: true
  # Only with enabled: false: accept a range in trustedProxies although nothing keeps other pods
  # of the cluster away from the api (the chart refuses that otherwise).
  allowWideTrustedProxies: false
  # Where names are resolved: the cluster's DNS pods, in its own namespace only.
  dns:
    namespaceSelector:
      matchLabels: { kubernetes.io/metadata.name: kube-system }
    podSelector:
      matchLabels: { k8s-app: kube-dns }
  # Who may reach web and api: the ingress controller's pods. Null where there are none (a cloud
  # load balancer in front of a Gateway: see frontDoorCIDRs).
  ingressController:
    namespaceSelector:
      matchLabels: { kubernetes.io/metadata.name: kube-system }
    podSelector:
      matchLabels: { app.kubernetes.io/name: traefik }
  # Address ranges that may also reach web and api: a cloud load balancer that talks to the pods
  # directly has no pods of its own to select (on Google Cloud: the load balancer's and health
  # checks' ranges, and the proxy-only subnet of a regional gateway). Empty: the pods above only.
  frontDoorCIDRs: []
  # The database pods (CloudNativePG labels its instances with cnpg.io/cluster). An empty
  # namespaceSelector means the release's own namespace; name another one with matchLabels.
  database:
    namespaceSelector: {}
    podSelector:
      matchLabels: { cnpg.io/cluster: finuance-db }
  # Who may scrape the metrics ports (9090): Prometheus's pods and nothing else in that namespace.
  # The port has no sign-in and must never be exposed outside the cluster. Both empty: nobody.
  monitoring:
    namespaceSelector:
      matchLabels: { kubernetes.io/metadata.name: monitoring }
    podSelector:
      matchLabels: { app.kubernetes.io/name: prometheus }

podMonitor:
  # Scrapes the api and the worker (job finuance-api / finuance-worker); needs the Prometheus
  # Operator CRDs. Dashboards and alert rules: deploy/k8s/observability.
  enabled: false
  interval: 30s
  labels: {}
