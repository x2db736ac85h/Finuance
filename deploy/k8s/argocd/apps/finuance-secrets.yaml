# The homelab's SealedSecrets (database roles, backup store, assistant keys). Synced before the
# database and the app need them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finuance-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: finuance
  source:
    repoURL: git@github.com:x2db736ac85h/Finuance.git
    targetRevision: main
    path: deploy/environments/homelab/secrets
    directory:
      include: "*.sealed.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: finuance
  syncPolicy:
    automated:
      # A secret removed from git is not deleted from the cluster by accident: prune by hand.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # The first app in the namespace creates it: every pod there (app, migrations, PostgreSQL)
    # must meet the "restricted" Pod Security Standard.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
