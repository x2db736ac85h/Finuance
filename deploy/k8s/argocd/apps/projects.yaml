# Two projects: "platform" for the operators (they need cluster-wide resources: CRDs, cluster
# roles, webhooks) and "finuance" for the app, its database and its secrets (namespaced only).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Operators Finuance depends on (CloudNativePG, Barman Cloud plugin, Sealed Secrets) and the monitoring stack.
  sourceRepos:
    - https://cloudnative-pg.github.io/charts
    - https://bitnami.github.io/sealed-secrets
    - https://prometheus-community.github.io/helm-charts
    # the monitoring stack's values and Tempo's manifests (deploy/environments/homelab, deploy/k8s/tempo)
    - git@github.com:x2db736ac85h/Finuance.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: cnpg-system
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: monitoring
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: finuance
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: The Finuance app, its PostgreSQL cluster, its backup bucket and its sealed secrets.
  sourceRepos:
    - git@github.com:x2db736ac85h/Finuance.git
    # the private environment repository with the per-machine overlay (ADR 0023)
    - git@github.com:x2db736ac85h/finuance-env.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: finuance
    # the backup bucket (RustFS) on clusters without an outside store (ADR 0022)
    - server: https://kubernetes.default.svc
      namespace: s3
    # Finuance's dashboards, rules and alert receiver next to the monitoring stack
    - server: https://kubernetes.default.svc
      namespace: monitoring
  # Only the namespace itself is cluster-scoped; everything else stays inside it.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
