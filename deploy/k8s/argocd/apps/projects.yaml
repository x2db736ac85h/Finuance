# Three projects: "platform" for the operators' Helm charts (they need cluster-wide resources:
# CRDs, cluster roles, webhooks), "platform-manifests" for the plain manifests kept in this
# repository (exactly the kinds they use), and "finuance" for the app, its database and its
# secrets (namespaced only).
#
# What the projects don't do: this file and the applications next to it come from the same
# repository, so whoever can change `main` can change them too. The projects bound a mistake in
# one folder; the repository's rules guard the rest (docs/THREAT-MODEL.md).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Operators Finuance depends on (CloudNativePG, Barman Cloud plugin, Sealed Secrets, Sigstore policy-controller) and the monitoring stack.
  sourceRepos:
    - https://cloudnative-pg.github.io/charts
    - https://bitnami.github.io/sealed-secrets
    - https://prometheus-community.github.io/helm-charts
    - https://sigstore.github.io/helm-charts
    # values files for the charts (deploy/environments/homelab) and the image policies next to the
    # policy-controller; the plain manifests are in the project "platform-manifests"
    - git@github.com:x2db736ac85h/Finuance.git
    # Grafana's sealed admin login in the private environment repository (ADR 0023)
    - git@github.com:x2db736ac85h/finuance-env.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: cnpg-system
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: monitoring
    # Sigstore policy-controller (image signatures, ADR 0039)
    - server: https://kubernetes.default.svc
      namespace: cosign-system
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-manifests
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Plain manifests from this repository (the admission policy, Tempo). Only the kinds they use; nothing that grants rights.
  sourceRepos:
    - git@github.com:x2db736ac85h/Finuance.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: monitoring
  # tools/check-helm.sh compares both lists with the manifests under deploy/k8s/admission and
  # deploy/k8s/tempo: a new kind there has to be added here on purpose.
  clusterResourceWhitelist:
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicyBinding
    # Tempo's application creates its namespace when it is missing
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: NetworkPolicy
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: finuance
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: The Finuance app, its PostgreSQL cluster, its backup bucket and its sealed secrets.
  sourceRepos:
    - git@github.com:x2db736ac85h/Finuance.git
    # the private environment repository with the per-machine overlay and the sealed secrets (ADR 0023)
    - git@github.com:x2db736ac85h/finuance-env.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: finuance
    # the backup bucket (RustFS) on clusters without an outside store (ADR 0022)
    - server: https://kubernetes.default.svc
      namespace: s3
    # Finuance's dashboards, rules and alert receiver next to the monitoring stack
    - server: https://kubernetes.default.svc
      namespace: monitoring
  # Only the namespace itself is cluster-scoped; everything else stays inside it.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
