# The app-of-apps (PLAN task 16.4). Applied once by hand when Argo CD is bootstrapped (Phase 18,
# docs/RUNBOOK.md "Bootstrap"); from then on Argo CD keeps everything under apps/ in sync with main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finuance-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:x2db736ac85h/Finuance.git
    # While a phase is being tried on the cluster, the apps follow its branch; everything that reaches
    # main follows main again (tools/check-helm.sh fails otherwise).
    targetRevision: phase/18-homelab-rollout
    path: deploy/k8s/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
