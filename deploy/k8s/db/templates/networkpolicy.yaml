{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
# Who may reach the database pods, and what they may reach. The app chart's default deny selects
# every pod of the namespace, so the instances' egress is allowed here: the Kubernetes API (the
# instance manager), the other instances and the object store. An API server has no pod to select
# and its address differs per cluster, so the default rule is "anywhere"; networkPolicy.egress
# replaces it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.cluster.name }}
  labels:
    {{- include "db.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.cluster.name }}
  policyTypes: [Ingress, Egress]
  egress:
    {{- toYaml ($np.egress | default (list (dict))) | nindent 4 }}
  ingress:
    # The app's pods that use the database.
    - from:
        {{- toYaml $np.clients | nindent 8 }}
      ports:
        - { port: 5432, protocol: TCP }
    # The other instances (streaming replication, instance manager).
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Values.cluster.name }}
    # The operator and the Barman Cloud plugin: the instance manager's status port and PostgreSQL.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.operatorNamespace }}
      ports:
        - { port: 8000, protocol: TCP }
        - { port: 5432, protocol: TCP }
    {{- with $np.monitoringNamespace }}
    # The exporter, for Prometheus's pods.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
          podSelector: {{- toYaml $np.monitoringPodSelector | nindent 12 }}
      ports:
        - { port: 9187, protocol: TCP }
    {{- end }}
{{- end }}
