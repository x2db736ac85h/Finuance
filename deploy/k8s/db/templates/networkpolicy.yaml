{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
# Who may reach the database pods. Egress stays open: the instances talk to the Kubernetes API and
# the object store.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.cluster.name }}
  labels:
    {{- include "db.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.cluster.name }}
  policyTypes: [Ingress]
  ingress:
    # The app's pods.
    - from:
        {{- toYaml $np.clients | nindent 8 }}
      ports:
        - { port: 5432, protocol: TCP }
    # The other instances (streaming replication, instance manager).
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Values.cluster.name }}
    # The operator and the Barman Cloud plugin (status on 8000, connections on 5432).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.operatorNamespace }}
    {{- with $np.monitoringNamespace }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      ports:
        - { port: 9187, protocol: TCP }
    {{- end }}
{{- end }}
