{{- if include "db.objectStoreUsed" . }}
{{- $os := .Values.objectStore }}
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ include "db.store" . }}
  labels:
    {{- include "db.labels" . | nindent 4 }}
spec:
  retentionPolicy: {{ $os.retention | quote }}
  configuration:
    destinationPath: {{ required "objectStore.destinationPath is required when backup or recovery is on (e.g. s3://finuance-backups/)" $os.destinationPath | quote }}
    {{- with $os.endpointURL }}
    endpointURL: {{ . | quote }}
    {{- end }}
    {{- if $os.endpointCA.name }}
    endpointCA:
      name: {{ $os.endpointCA.name }}
      key: {{ $os.endpointCA.key }}
    {{- end }}
    {{- if eq $os.auth "gke" }}
    {{- if not (hasPrefix "gs://" $os.destinationPath) }}
    {{- fail "objectStore.auth gke is for Google Cloud Storage: objectStore.destinationPath must start with gs://" }}
    {{- end }}
    # Google Cloud Storage with the pods' own identity (workload identity, PLAN 27.1): no key; the
    # cluster's service account names the Google service account (cluster.serviceAccountAnnotations)
    googleCredentials:
      gkeEnvironment: true
    {{- else }}
    s3Credentials:
      accessKeyId:
        name: {{ $os.credentialsSecret }}
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: {{ $os.credentialsSecret }}
        key: ACCESS_SECRET_KEY
      {{- with $os.regionKey }}
      region:
        name: {{ $os.credentialsSecret }}
        key: {{ . }}
      {{- end }}
    {{- end }}
    wal:
      compression: {{ $os.compression }}
      maxParallel: 2
    data:
      compression: {{ $os.compression }}
      jobs: 2
{{- end }}
