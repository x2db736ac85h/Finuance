{{- /* The one e-mail receiver, shared by the routes below. */ -}}
{{- define "obs.emailReceiver" -}}
- name: email
  emailConfigs:
    - to: {{ .to | quote }}
      from: {{ .from | quote }}
      smarthost: {{ .smarthost | quote }}
      {{- with .authUsername }}
      authUsername: {{ . | quote }}
      authPassword:
        name: {{ $.passwordSecret.name }}
        key: {{ $.passwordSecret.key }}
      {{- end }}
      requireTLS: {{ .requireTLS }}
      sendResolved: true
{{- end }}
{{- with .Values.alerting.email }}
{{- if .enabled }}
{{- if not (and .to .from .smarthost) }}
{{- fail "alerting.email needs to, from and smarthost (e.g. smtp.example.com:587)" }}
{{- end }}
# Every Finuance alert goes by e-mail (Phase 17 decision): pages at once and repeated hourly,
# tickets grouped and repeated daily. The SMTP password is a Secret in the same namespace
# (sealed in Phase 18).
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: {{ $.Release.Name }}-email
  labels:
    {{- include "obs.labels" $ | nindent 4 }}
    {{- with $.Values.alerting.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  route:
    receiver: email
    matchers:
      - { name: alertname, matchType: "=~", value: "Finuance.*" }
      - { name: alertname, matchType: "!=", value: FinuanceDailyDigest }
    groupBy: [alertname, severity]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 24h
    routes:
      - receiver: email
        matchers:
          - { name: severity, matchType: "=", value: page }
        groupWait: 10s
        repeatInterval: 1h
  receivers:
    {{- include "obs.emailReceiver" . | nindent 4 }}
{{- with $.Values.alerting.platform }}
{{- if .severities }}
---
# The monitoring stack's own alerts (kube-prometheus-stack: nodes, disks, Kubernetes, Prometheus)
# of these severities go by e-mail too, repeated every 4 hours; the warnings stay on the dashboards.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: {{ $.Release.Name }}-platform
  labels:
    {{- include "obs.labels" $ | nindent 4 }}
    {{- with $.Values.alerting.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  route:
    receiver: email
    matchers:
      - { name: severity, matchType: "=~", value: {{ join "|" .severities | quote }} }
      - { name: alertname, matchType: "!~", value: "Finuance.*|Watchdog|InfoInhibitor" }
    groupBy: [alertname, namespace]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
  receivers:
    {{- include "obs.emailReceiver" $.Values.alerting.email | nindent 4 }}
{{- end }}
{{- end }}
{{- if $.Values.digest.enabled }}
---
# The daily digest (docs/SLO.md): the FinuanceDailyDigest alert fires once a day for 15 minutes;
# its text is the e-mail, sent once (no repeat within 24 hours, no "resolved").
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: {{ $.Release.Name }}-digest
  labels:
    {{- include "obs.labels" $ | nindent 4 }}
    {{- with $.Values.alerting.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  route:
    receiver: digest
    matchers:
      - { name: alertname, matchType: "=", value: FinuanceDailyDigest }
    groupBy: [alertname]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 24h
  receivers:
    - name: digest
      emailConfigs:
        {{- with $.Values.alerting.email }}
        - to: {{ .to | quote }}
          from: {{ .from | quote }}
          smarthost: {{ .smarthost | quote }}
          {{- with .authUsername }}
          authUsername: {{ . | quote }}
          authPassword:
            name: {{ $.Values.alerting.email.passwordSecret.name }}
            key: {{ $.Values.alerting.email.passwordSecret.key }}
          {{- end }}
          requireTLS: {{ .requireTLS }}
          sendResolved: false
          headers:
            - { key: Subject, value: {{ `{{ .CommonAnnotations.summary }}` | quote }} }
          # the digest is laid out in columns: plain text, and monospace in HTML (html/template escapes it)
          text: {{ `{{ range .Alerts }}{{ .Annotations.digest }}{{ end }}` | quote }}
          html: {{ `{{ range .Alerts }}<pre style="font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap">{{ .Annotations.digest }}</pre>{{ end }}` | quote }}
        {{- end }}
{{- end }}
{{- with $.Values.alerting.heartbeat }}
{{- if .enabled }}
---
# A sign of life: the always-firing Watchdog alert by e-mail once a week (the active window, UTC,
# with a 24-hour repeat). If it doesn't arrive, the path is broken (machine, Alertmanager, SMTP).
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: {{ $.Release.Name }}-heartbeat
  labels:
    {{- include "obs.labels" $ | nindent 4 }}
    {{- with $.Values.alerting.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  route:
    receiver: email
    matchers:
      - { name: alertname, matchType: "=", value: Watchdog }
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 24h
    activeTimeIntervals: [heartbeat-window]
  muteTimeIntervals:
    - name: heartbeat-window
      timeIntervals:
        - weekdays: [{{ .weekday | quote }}]
          times:
            - { startTime: {{ .startTime | quote }}, endTime: {{ .endTime | quote }} }
  receivers:
    {{- include "obs.emailReceiver" $.Values.alerting.email | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
