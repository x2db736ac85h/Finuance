{{- if .Values.dashboards.enabled }}
{{- range $path, $_ := .Files.Glob "files/dashboards/*.json" }}
# Grafana dashboard {{ base $path }}, picked up by Grafana's dashboard sidecar (PLAN 17.3).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-{{ base $path | trimSuffix ".json" }}
  labels:
    {{- include "obs.labels" $ | nindent 4 }}
    {{- toYaml $.Values.dashboards.labels | nindent 4 }}
  annotations:
    {{ $.Values.dashboards.folderAnnotation }}: {{ $.Values.dashboards.folder | quote }}
data:
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
---
{{- end }}
{{- end }}
