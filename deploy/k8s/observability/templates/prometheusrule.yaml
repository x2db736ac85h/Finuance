{{- if .Values.rules.enabled }}
{{- $ns := .Values.appNamespace }}
{{- /* Requests that count for availability: every API route except health checks, the
       assistant (its failures are the model server's; FinuanceAssistantModelErrors covers them)
       and unmatched paths. */}}
{{- $avail := printf `job="finuance-api",namespace="%s",route!~"GET /(healthz|readyz)|.*/assistant/.*|unmatched"` $ns }}
{{- /* Requests that count for latency: the table query and the insight charts (docs/SLO.md). */}}
{{- $lat := printf `job="finuance-api",namespace="%s",route=~"POST /api/v1/(transactions/query|insights/.*)"` $ns }}
# Recording rules and alerts for Finuance (PLAN 17.4, docs/SLO.md). Burn-rate alerts follow the
# multi-window, multi-burn-rate pattern of the Google SRE workbook: "page" when 2 % of the 30-day
# budget burns in an hour (14.4×, 1 h and 5 m windows), "ticket" when 5 % burns in 6 hours (6×,
# 6 h and 30 m windows). tests/rules.test.yaml checks each alert with promtool.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "obs.labels" . | nindent 4 }}
    {{- with .Values.rules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: finuance-slo.rules
      rules:
        {{- range $w := list "5m" "30m" "1h" "6h" "3d" }}
        # "or vector(0)": with no 5xx at all the series doesn't exist, and the ratio would be empty
        # instead of 0 (no burn rate, blank dashboards).
        - record: finuance:slo_availability:error_ratio_rate{{ $w }}
          expr: |
            (sum(rate(http_server_requests_total{ {{- $avail }},status_class="5xx"}[{{ $w }}])) or vector(0))
            /
            sum(rate(http_server_requests_total{ {{- $avail }}}[{{ $w }}]))
        - record: finuance:slo_latency:error_ratio_rate{{ $w }}
          expr: |
            1 - (
              sum(rate(http_server_request_duration_seconds_bucket{ {{- $lat }},le="0.3"}[{{ $w }}]))
              /
              sum(rate(http_server_request_duration_seconds_count{ {{- $lat }}}[{{ $w }}]))
            )
        {{- end }}
    - name: finuance-slo.alerts
      rules:
        - alert: FinuanceAvailabilityBurnFast
          expr: |
            finuance:slo_availability:error_ratio_rate1h > (14.4 * 0.005)
            and
            finuance:slo_availability:error_ratio_rate5m > (14.4 * 0.005)
          labels: { severity: page, slo: availability }
          annotations:
            summary: >-
              Finuance API errors burn the 30-day availability budget 14× too fast
            description: >-
              {{`More than {{ $value | humanizePercentage }} of API requests failed with 5xx in the last hour (SLO 99.5 %). RUNBOOK: "api not ready", recent deploys.`}}
        - alert: FinuanceAvailabilityBurnSlow
          expr: |
            finuance:slo_availability:error_ratio_rate6h > (6 * 0.005)
            and
            finuance:slo_availability:error_ratio_rate30m > (6 * 0.005)
          labels: { severity: ticket, slo: availability }
          annotations:
            summary: >-
              Finuance API errors burn the 30-day availability budget 6× too fast
            description: >-
              {{`{{ $value | humanizePercentage }} of API requests failed with 5xx over 6 hours (SLO 99.5 %).`}}
        - alert: FinuanceLatencyBurnFast
          expr: |
            finuance:slo_latency:error_ratio_rate1h > (14.4 * 0.05)
            and
            finuance:slo_latency:error_ratio_rate5m > (14.4 * 0.05)
          labels: { severity: page, slo: latency }
          annotations:
            summary: >-
              Table and chart requests are slow (latency budget burning 14× too fast)
            description: >-
              {{`{{ $value | humanizePercentage }} of /transactions/query and /insights requests took over 300 ms in the last hour (SLO: 95 % under 300 ms).`}}
        - alert: FinuanceLatencyBurnSlow
          expr: |
            finuance:slo_latency:error_ratio_rate6h > (6 * 0.05)
            and
            finuance:slo_latency:error_ratio_rate30m > (6 * 0.05)
          labels: { severity: ticket, slo: latency }
          annotations:
            summary: >-
              Table and chart requests are slow (latency budget burning 6× too fast)
            description: >-
              {{`{{ $value | humanizePercentage }} of /transactions/query and /insights requests took over 300 ms over 6 hours.`}}
    - name: finuance-app.alerts
      rules:
        - alert: FinuanceTargetDown
          expr: up{job=~"finuance-(api|worker)",namespace="{{ $ns }}"} == 0
          for: 5m
          labels: { severity: page }
          annotations:
            summary: >-
              {{`{{ $labels.job }} pod {{ $labels.pod }} can't be scraped`}}
            description: >-
              Prometheus has failed to scrape it for 5 minutes; the pod is down or its metrics port is blocked.
        - alert: FinuanceApiAbsent
          expr: absent(up{job="finuance-api",namespace="{{ $ns }}"} == 1)
          for: 10m
          labels: { severity: page }
          annotations:
            summary: >-
              No Finuance api pod is up
            description: >-
              No api target has answered for 10 minutes (or the PodMonitor is missing).
        - alert: FinuanceImportFailed
          expr: increase(finuance_imports_total{job="finuance-worker",namespace="{{ $ns }}",result="failed"}[1h]) > 0
          labels: { severity: ticket }
          annotations:
            summary: >-
              An import commit failed after all its retries
            description: >-
              {{`{{ $value | humanize }} import(s) failed in the last hour; the user sees "Try again". Check the worker's log line "commit_import failed".`}}
        - alert: FinuanceJobsFailing
          expr: |
            sum by (kind) (rate(finuance_jobs_total{job="finuance-worker",namespace="{{ $ns }}",result="error"}[15m]))
            /
            sum by (kind) (rate(finuance_jobs_total{job="finuance-worker",namespace="{{ $ns }}"}[15m]))
            > 0.1
          for: 15m
          labels: { severity: ticket }
          annotations:
            summary: >-
              {{`More than 10 % of {{ $labels.kind }} jobs fail`}}
            description: >-
              {{`{{ $value | humanizePercentage }} of {{ $labels.kind }} jobs returned an error over 15 minutes (River retries them).`}}
        - alert: FinuanceDatabasePoolSaturated
          expr: |
            max by (job, pod) (pgxpool_acquired_conns{namespace="{{ $ns }}"} / pgxpool_max_conns{namespace="{{ $ns }}"}) > 0.9
          for: 10m
          labels: { severity: ticket }
          annotations:
            summary: >-
              {{`{{ $labels.pod }} uses over 90 % of its database connections`}}
            description: >-
              Requests wait for connections; raise FINUANCE_DB_MAX_CONNS or find the slow queries.
        - alert: FinuanceAssistantModelErrors
          expr: |
            sum by (connection) (rate(finuance_assistant_model_requests_total{job="finuance-api",namespace="{{ $ns }}",result!="ok"}[15m]))
            /
            sum by (connection) (rate(finuance_assistant_model_requests_total{job="finuance-api",namespace="{{ $ns }}"}[15m]))
            > 0.5
          for: 15m
          labels: { severity: ticket }
          annotations:
            summary: >-
              {{`The model server of the assistant connection {{ $labels.connection }} fails`}}
            description: >-
              {{`{{ $value | humanizePercentage }} of model requests failed over 15 minutes (outside the SLO; the rest of the app is unaffected).`}}
    {{- if .Values.rules.database }}
    - name: finuance-database.alerts
      rules:
        - alert: FinuancePostgresDown
          expr: cnpg_collector_up{job="finuance-db",namespace="{{ $ns }}"} == 0
          for: 5m
          labels: { severity: page }
          annotations:
            summary: >-
              {{`PostgreSQL on {{ $labels.pod }} is down`}}
            description: >-
              The instance manager reports PostgreSQL not running for 5 minutes. RUNBOOK "Postgres down".
        - alert: FinuancePostgresAbsent
          expr: absent(cnpg_collector_up{job="finuance-db",namespace="{{ $ns }}"} == 1)
          for: 10m
          labels: { severity: page }
          annotations:
            summary: >-
              No PostgreSQL instance of Finuance is up
            description: >-
              No instance has reported PostgreSQL running for 10 minutes (or the database PodMonitor is missing).
        - alert: FinuancePostgresReplicationLag
          expr: max by (pod) (cnpg_pg_replication_lag{job="finuance-db",namespace="{{ $ns }}"}) > 300
          for: 10m
          labels: { severity: ticket }
          annotations:
            summary: >-
              {{`The replica {{ $labels.pod }} is {{ $value | humanizeDuration }} behind`}}
            description: >-
              A switch-over now would lose that much. Check the replica's disk and network.
        - alert: FinuanceWalArchivingFailing
          expr: |
            increase(cnpg_pg_stat_archiver_failed_count{job="finuance-db",namespace="{{ $ns }}"}[30m]) > 0
            or
            max by (pod) (cnpg_collector_pg_wal_archive_status{job="finuance-db",namespace="{{ $ns }}",value="ready"}) > 10
          for: 30m
          labels: { severity: page }
          annotations:
            summary: >-
              WAL archiving to the backup bucket is failing
            description: >-
              Point-in-time recovery stops at the last archived WAL, and pg_wal grows until the disk is full. Check the bucket and its credentials.
    {{- end }}
    {{- if .Values.rules.backups }}
    - name: finuance-backup.alerts
      rules:
        - alert: FinuanceBackupTooOld
          expr: |
            time() - max(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{job="finuance-db",namespace="{{ $ns }}"}) > 26 * 3600
          for: 15m
          labels: { severity: page }
          annotations:
            summary: >-
              The last successful backup is older than 26 hours
            description: >-
              {{`The newest base backup is {{ $value | humanizeDuration }} old (daily ScheduledBackup). RUNBOOK "Backups".`}}
        - alert: FinuanceBackupMetricsAbsent
          expr: absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{job="finuance-db",namespace="{{ $ns }}"})
          for: 2h
          labels: { severity: ticket }
          annotations:
            summary: >-
              No backup has been reported
            description: >-
              The Barman Cloud plugin reports no available backup (none taken yet, the plugin isn't running, or the database PodMonitor is missing).
    {{- end }}
    {{- if .Values.rules.kubernetes }}
    - name: finuance-kubernetes.alerts
      rules:
        - alert: FinuancePodCrashLooping
          expr: max by (namespace, pod, container) (kube_pod_container_status_waiting_reason{namespace="{{ $ns }}",reason="CrashLoopBackOff"}) == 1
          for: 5m
          labels: { severity: page }
          annotations:
            summary: >-
              {{`{{ $labels.pod }} ({{ $labels.container }}) is crash-looping`}}
            description: >-
              {{`kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c {{ $labels.container }} --previous`}}
        # No api replica ready: the ingress has nowhere to send requests and refuses them (503),
        # which the api's own metrics never see (Phase 18 load test).
        - alert: FinuanceApiNoReadyPods
          expr: max by (namespace, deployment) (kube_deployment_status_replicas_available{namespace="{{ $ns }}",deployment=~".+-api"}) == 0
          for: 1m
          labels: { severity: page }
          annotations:
            summary: >-
              {{`No {{ $labels.deployment }} pod is ready: requests are refused at the ingress`}}
            description: >-
              {{`kubectl -n {{ $labels.namespace }} get pods; curl the api's /readyz (docs/RUNBOOK.md "api not ready")`}}
    {{- end }}
    {{- if .Values.ingress.traefik.enabled }}
    - name: finuance-ingress.alerts
      rules:
        # 5xx answered at the ingress for Finuance's routers, the requests refused there included.
        - alert: FinuanceIngressErrors
          expr: >-
            (sum(rate(traefik_router_requests_total{job="traefik",router=~"([a-z0-9]+-)?{{ $ns }}-.+",code=~"5.."}[5m])) or vector(0))
            / sum(rate(traefik_router_requests_total{job="traefik",router=~"([a-z0-9]+-)?{{ $ns }}-.+"}[5m])) > 0.05
          for: 5m
          labels: { severity: page }
          annotations:
            summary: >-
              {{`{{ $value | humanizePercentage }} of Finuance's requests fail at the ingress`}}
            description: >-
              {{`Compare with the api's 5xx (SLO dashboard): failures only here mean requests that never reached the api (no ready pod, timeouts).`}}
    {{- end }}
    {{- with .Values.digest }}
    {{- if .enabled }}
    {{- /* The digest's figures over the trailing 24 hours, one series per indicator (unit: how to
           show it; requests are the ones that count for availability, so no health checks; peaks
           are of 15-minute averages). Kept every 10 minutes, so the 7-day baselines below are cheap
           to read. */}}
    {{- $ind := list
      (dict "name" "availability" "unit" "ratio" "expr" (printf `1 - ((sum(increase(http_server_requests_total{%s,status_class="5xx"}[24h])) or vector(0)) / sum(increase(http_server_requests_total{%s}[24h])))` $avail $avail))
      (dict "name" "latency_p95" "unit" "seconds" "expr" (printf `histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{%s}[24h])))` $lat))
      (dict "name" "latency_within_slo" "unit" "ratio" "expr" (printf `sum(increase(http_server_request_duration_seconds_bucket{%s,le="0.3"}[24h])) / sum(increase(http_server_request_duration_seconds_count{%s}[24h]))` $lat $lat))
      (dict "name" "requests" "unit" "count" "expr" (printf `sum(increase(http_server_requests_total{%s}[24h]))` $avail))
      (dict "name" "peak_rate" "unit" "rate" "expr" (printf `max_over_time(sum(rate(http_server_requests_total{%s}[15m]))[24h:5m])` $avail))
      (dict "name" "errors_5xx" "unit" "count" "expr" (printf `sum(increase(http_server_requests_total{%s,status_class="5xx"}[24h])) or vector(0)` $avail))
      (dict "name" "imports" "unit" "count" "expr" (printf `sum(increase(finuance_imports_total{namespace="%s",result="committed"}[24h])) or vector(0)` $ns))
      (dict "name" "imports_failed" "unit" "count" "expr" (printf `sum(increase(finuance_imports_total{namespace="%s",result="failed"}[24h])) or vector(0)` $ns))
      (dict "name" "jobs_failed" "unit" "count" "expr" (printf `sum(increase(finuance_jobs_total{namespace="%s",result="error"}[24h])) or vector(0)` $ns))
      (dict "name" "assistant_runs" "unit" "count" "expr" (printf `sum(increase(finuance_assistant_runs_total{namespace="%s"}[24h])) or vector(0)` $ns))
    }}
    {{- if $.Values.rules.database }}
    {{- $ind = append $ind (dict "name" "database_growth" "unit" "bytes" "expr" (printf `max(cnpg_pg_database_size_bytes{job="finuance-db",namespace="%s",datname="finuance"}) - max(cnpg_pg_database_size_bytes{job="finuance-db",namespace="%s",datname="finuance"} offset 24h)` $ns $ns)) }}
    {{- end }}
    {{- if $.Values.rules.kubernetes }}
    {{- $ind = append $ind (dict "name" "restarts" "unit" "count" "expr" `sum(increase(kube_pod_container_status_restarts_total[24h])) or vector(0)`) }}
    {{- end }}
    {{- if .node }}
    {{- $ind = append $ind (dict "name" "cpu_peak" "unit" "ratio" "expr" `max_over_time((1 - avg(rate(node_cpu_seconds_total{mode="idle"}[15m])))[24h:5m])`) }}
    {{- $ind = append $ind (dict "name" "memory_peak" "unit" "ratio" "expr" `max_over_time((1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes))[24h:5m])`) }}
    {{- end }}
    {{- if $.Values.ingress.traefik.enabled }}
    {{- $ind = append $ind (dict "name" "ingress_5xx" "unit" "count" "expr" (printf `sum(increase(traefik_router_requests_total{job="traefik",router=~"([a-z0-9]+-)?%s-.+",code=~"5.."}[24h])) or vector(0)` $ns)) }}
    {{- end }}
    {{- $base := `finuance:digest_24h[7d] offset 1d` }}
    {{- $enough := printf `finuance:digest_24h:stddev7d > 0 and finuance:digest_24h:samples7d >= %d` (div (mul .anomalies.minHistoryHours 3600) 600) }}
    - name: finuance-digest.rules
      interval: 10m
      rules:
        {{- range $ind }}
        - record: finuance:digest_24h
          labels: { indicator: {{ .name }}, unit: {{ .unit }} }
          expr: {{ .expr | toJson }}
        {{- end }}
        # the breakdowns the digest lists, recorded with their totals so both are of the same moment
        - record: finuance:digest_24h_failed_jobs:by_kind
          expr: sum by (kind) (increase(finuance_jobs_total{namespace="{{ $ns }}",result="error"}[24h]))
        {{- if $.Values.rules.kubernetes }}
        - record: finuance:digest_24h_restarts:by_namespace
          expr: sum by (namespace) (increase(kube_pod_container_status_restarts_total[24h]))
        {{- end }}
        # the previous 7 days of each figure (the last day left out, so a spike doesn't hide itself)
        - record: finuance:digest_24h:avg7d
          expr: avg_over_time({{ $base }})
        - record: finuance:digest_24h:stddev7d
          expr: stddev_over_time({{ $base }})
        - record: finuance:digest_24h:samples7d
          expr: count_over_time({{ $base }})
        # far from its usual: more than {{ .anomalies.sigma }} standard deviations, or, with a flat or
        # short history, a change of more than {{ mulf .anomalies.change 100 }} % (a figure with no history at all isn't judged)
        - record: finuance:digest_anomaly
          expr: |
            (
              abs(finuance:digest_24h - finuance:digest_24h:avg7d) > {{ .anomalies.sigma }} * finuance:digest_24h:stddev7d
              and on (indicator, unit) ({{ $enough }})
            )
            or
            (
              abs(finuance:digest_24h - finuance:digest_24h:avg7d) > {{ .anomalies.change }} * abs(finuance:digest_24h:avg7d)
              unless on (indicator, unit) ({{ $enough }})
            )
    - name: finuance-digest.alerts
      rules:
        {{- /* The local hour in UTC, standard time and (with EU summer time) summer time. */}}
        {{- $std := mod (add 24 (sub .hour .utcOffsetHours)) 24 }}
        {{- $sum := mod (add 23 (sub .hour .utcOffsetHours)) 24 }}
        # Fires for the first 15 minutes of {{ .hour }}:00 local time ({{ $std }}:00 UTC{{ if .euSummerTime }}, {{ $sum }}:00 UTC in
        # EU summer time: from the last Sunday of March to the last Sunday of October, both switching at
        # 01:00 UTC, so at this hour the day's offset is already in force{{ end }}). One e-mail a day: the
        # route doesn't repeat within 24 hours and sends no "resolved".
        - alert: FinuanceDailyDigest
          expr: |
            vector(1) and on () minute() < 15 and on () (
            {{- if .euSummerTime }}
                (hour() == {{ $std }} and on () (month() < 3 or month() > 10 or (month() == 3 and (day_of_month() - day_of_week()) < 25) or (month() == 10 and (day_of_month() - day_of_week()) >= 25)))
              or
                (hour() == {{ $sum }} and on () ((month() > 3 and month() < 10) or (month() == 3 and (day_of_month() - day_of_week()) >= 25) or (month() == 10 and (day_of_month() - day_of_week()) < 25)))
            {{- else }}
                hour() == {{ $std }}
            {{- end }}
            )
          labels: { severity: digest }
          annotations:
            summary: {{ $.Files.Get "files/digest-summary.tmpl" | trim | replace "__NS__" $ns | replace "__EVAL__" (toString .evaluationSeconds) | toJson }}
            digest: |
              {{- $.Files.Get "files/digest.tmpl" | replace "__NS__" $ns | replace "__EVAL__" (toString .evaluationSeconds) | replace "__DATABASE__" (toString $.Values.rules.database) | replace "__BACKUPS__" (toString $.Values.rules.backups) | replace "__KUBERNETES__" (toString $.Values.rules.kubernetes) | replace "__NODE__" (toString .node) | replace "__INGRESS__" (toString $.Values.ingress.traefik.enabled) | replace "__SIGMA__" (toString .anomalies.sigma) | replace "__CHANGE__" (toString (mulf .anomalies.change 100)) | nindent 14 }}
    {{- end }}
    {{- end }}
{{- end }}
