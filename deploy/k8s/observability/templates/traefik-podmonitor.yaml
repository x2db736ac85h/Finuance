{{- with .Values.ingress.traefik }}
{{- if .enabled }}
# Traefik's metrics (ingress.traefik): what users get at the ingress, including requests refused
# before they reach the api. Lives next to the stack; selects the Traefik pods in their namespace.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $.Release.Name }}-traefik
  labels:
    {{- include "obs.labels" $ | nindent 4 }}
spec:
  jobLabel: ""
  namespaceSelector:
    matchNames: [{{ .namespace | quote }}]
  selector:
    matchLabels:
      {{- toYaml .selector | nindent 6 }}
  podMetricsEndpoints:
    - port: {{ .port | quote }}
      interval: 30s
      relabelings:
        - { targetLabel: job, replacement: traefik }
      # only the request series; Traefik's Go and process metrics aren't used
      metricRelabelings:
        - { sourceLabels: [__name__], regex: "traefik_(router|entrypoint|service)_.*|traefik_config_last_reload_success|traefik_tls_certs_not_after", action: keep }
{{- end }}
{{- end }}
