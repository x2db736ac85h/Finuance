# Dashboards, recording and alerting rules, and the e-mail receiver for one Finuance installation
# (PLAN 17.3, 17.4; docs/SLO.md). Needs the Prometheus Operator CRDs and Grafana's dashboard
# sidecar. The app chart's PodMonitor (podMonitor.enabled) and the database chart's
# (cluster.podMonitor) must be on, so the series below exist.

# Where Finuance runs: the namespace of the app and database charts.
appNamespace: finuance

dashboards:
  enabled: true
  # Labels Grafana's sidecar looks for (kube-prometheus-stack: grafana.sidecar.dashboards.label).
  labels:
    grafana_dashboard: "1"
  # Grafana folder (sidecar folderAnnotation).
  folder: Finuance
  folderAnnotation: grafana_folder

rules:
  enabled: true
  # Labels the Prometheus ruleSelector matches (kube-prometheus-stack: release: <release name>).
  labels: {}
  # Alerts on the database and its backups (off when the database isn't CloudNativePG with the
  # Barman Cloud plugin).
  database: true
  backups: true
  # Pods in CrashLoopBackOff (needs kube-state-metrics).
  kubernetes: true

# The ingress in front of Finuance, measured where users connect: a request the ingress refuses
# (e.g. 503 when no api pod is ready) never reaches the api's own metrics, so the SLO panels and
# rules (measured at the api) can't see it (Phase 18 load test).
ingress:
  traefik:
    # A PodMonitor for Traefik (job "traefik"), the "At the ingress" panels' data and the
    # FinuanceIngressErrors alert. Traefik must label its metrics per router
    # (metrics.prometheus.addRoutersLabels); Finuance's routers are named
    # "[<entry point>-]<appNamespace>-<ingress>-…@kubernetes".
    enabled: false
    namespace: kube-system
    selector: { app.kubernetes.io/name: traefik }
    port: metrics

alerting:
  # An AlertmanagerConfig that sends every Finuance alert by e-mail (Phase 17 decision). The SMTP
  # password comes from a Secret (sealed in Phase 18: tools/seal-secrets.sh).
  email:
    enabled: false
    to: ""
    from: ""
    smarthost: ""            # host:port, e.g. smtp.example.com:587
    authUsername: ""
    passwordSecret: { name: finuance-alert-smtp, key: password }
    requireTLS: true
  # With the e-mail receiver on: the monitoring stack's own alerts (kube-prometheus-stack) of these
  # severities by e-mail too (Phase 18: only Finuance's were routed). Empty: none.
  platform:
    severities: [critical]
  # A weekly sign of life: the always-firing Watchdog alert by e-mail in this window (UTC), so a
  # broken path (machine off, Alertmanager down, SMTP refused) doesn't look like a quiet week.
  heartbeat:
    enabled: true
    weekday: monday
    startTime: "06:00"
    endTime: "08:00"
  # Labels the Alertmanager's alertmanagerConfigSelector matches.
  labels: {}
