# Which images may run in a namespace labelled `policy.sigstore.dev/include: "true"` (PLAN 23.2,
# ADR 0039). The registry list of deploy/k8s/admission/image-policy.yaml stays the first check;
# these policies add the signature.
#
# Finuance's own images: a keyless cosign signature made by this repository's release workflow on
# a version tag, the identity release.yml verifies before it publishes and SECURITY.md documents.
# A copy of an image pushed by anyone else, an image built by another workflow or branch, and an
# unsigned image are refused. The controller resolves a tag to its digest before checking it.
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: finuance-images
  labels: { app.kubernetes.io/part-of: finuance }
spec:
  images:
    - glob: "ghcr.io/x2db736ac85h/**"
  authorities:
    - name: release-workflow
      keyless:
        url: https://fulcio.sigstore.dev
        identities:
          - issuer: https://token.actions.githubusercontent.com
            subjectRegExp: '^https://github\.com/x2db736ac85h/Finuance/\.github/workflows/release\.yml@refs/tags/v[0-9].*$'
      ctlog:
        url: https://rekor.sigstore.dev
---
# CloudNativePG's images (the operator's instance manager, PostgreSQL, the backup sidecar) run in
# the same namespaces. They are admitted on the registry list alone: checking their publisher's
# signatures would tie this cluster's database to the layout of someone else's release workflow.
# Without this entry the controller would refuse them (no-match-policy: deny).
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: cloudnative-pg-images
  labels: { app.kubernetes.io/part-of: finuance }
spec:
  images:
    - glob: "ghcr.io/cloudnative-pg/**"
  authorities:
    - name: allowed-by-registry
      static:
        action: pass
