{{- $logs := .Values.logs.enabled }}
# Alloy, one replica: the traces of the app's api and worker (always) and the logs of the pods in
# logs.namespaces (with logs on). Its configuration is the files in files/, read as one directory;
# the addresses come from the environment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
data:
  traces.alloy: |
    {{- .Files.Get "files/traces.alloy" | nindent 4 }}
  {{- if $logs }}
  logs.alloy: |
    {{- .Files.Get "files/logs.alloy" | nindent 4 }}
  stages.alloy: |
    {{- .Files.Get "files/stages.alloy" | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
# the token is mounted only for reading logs (templates/rbac.yaml grants it that, nothing else)
automountServiceAccountToken: {{ $logs }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/name: alloy
spec:
  # One replica: two would read every log twice (no clustering here). An update stops the old pod
  # first, so no line is read by both; the app's exporter retries the traces of that moment.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: alloy }
  template:
    metadata:
      labels: { app.kubernetes.io/name: alloy }
      annotations:
        checksum/config: {{ printf "%s%s%s%t" (.Files.Get "files/traces.alloy") (.Files.Get "files/logs.alloy") (.Files.Get "files/stages.alloy") $logs | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: alloy
      automountServiceAccountToken: {{ $logs }}
      # above 10000 (Trivy KSV-0020/0021; the image's own alloy user is 473): Alloy needs nothing of
      # the image's but the binary, and its data folder is the volume below
      securityContext:
        {{- include "telemetry.podSecurity" (dict "uid" 10473) | nindent 8 }}
      containers:
        - name: alloy
          image: {{ .Values.alloy.image }}
          args:
            - run
            - /etc/alloy
            - --storage.path=/var/lib/alloy/data
            - --server.http.listen-addr=0.0.0.0:12345
            - --disable-reporting
          env:
            - { name: TEMPO_OTLP_ENDPOINT, value: {{ .Values.traces.endpoint | quote }} }
            {{- if $logs }}
            - { name: LOKI_PUSH_URL, value: "http://loki.{{ .Release.Namespace }}.svc:3100/loki/api/v1/push" }
            - { name: LOG_NAMESPACES, value: {{ join "," .Values.logs.namespaces | quote }} }
            {{- end }}
          ports:
            - { name: otlp-http, containerPort: 4318 }
            - { name: http, containerPort: 12345 }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.alloy.resources | nindent 12 }}
          securityContext:
            {{- include "telemetry.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/alloy, readOnly: true }
            # where each log was read up to; a new pod starts again from what the API still has
            - { name: data, mountPath: /var/lib/alloy }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: alloy }
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: alloy }
  ports:
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
---
# Traces only from the senders (the app's api and worker); out to Tempo, and with logs on to Loki and
# the Kubernetes API; names through the cluster's DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: alloy }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- toYaml .Values.traces.senders | nindent 8 }}
      ports:
        - { port: 4318, protocol: TCP }
  egress:
    {{- include "telemetry.dnsEgress" . | nindent 4 }}
    - to:
        - podSelector: {{- toYaml .Values.traces.tempoPodSelector | nindent 12 }}
      ports:
        - { port: 4318, protocol: TCP }
    {{- if $logs }}
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: loki }
      ports:
        - { port: 3100, protocol: TCP }
    - ports:
        {{- range .Values.kubernetesAPI.ports }}
        - { port: {{ . }}, protocol: TCP }
        {{- end }}
      {{- with .Values.kubernetesAPI.to }}
      to: {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
