{{- $d := .Values.grafana.datasource }}
{{- if and .Values.logs.enabled $d.enabled }}
# Grafana's Loki data source, read by Grafana's datasource sidecar: a line's trace_id (structured
# metadata, files/stages.alloy) opens the trace in Tempo. Tempo's link back to the logs is in
# Tempo's own data source (deploy/environments/homelab/monitoring-values.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
    {{ $d.label }}: {{ $d.labelValue | quote }}
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        url: http://loki.{{ .Release.Namespace }}.svc:3100
        access: proxy
        jsonData:
          derivedFields:
            - name: trace_id
              matcherType: label
              matcherRegex: trace_id
              datasourceUid: {{ $d.tempoUid }}
              url: "$${__value.raw}"
              urlDisplayLabel: Trace
{{- end }}
