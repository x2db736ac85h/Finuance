{{- if .Values.logs.enabled }}
{{- range .Values.logs.namespaces }}
# Alloy may list the pods of {{ . }} and read their logs; nothing else (tools/check-helm.sh checks
# that every Role of this chart grants read verbs on pods and pods/log only).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy-logs
  namespace: {{ . }}
  labels:
    {{- include "telemetry.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-logs
  namespace: {{ . }}
  labels:
    {{- include "telemetry.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy-logs
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: {{ $.Release.Namespace }}
---
{{- end }}
{{- end }}
