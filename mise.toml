# Local toolchain for mise users, the same as CI:
# - Go: the toolchain in backend/go.mod (CI's go-version-file) and Dockerfile.backend's build image;
#   tools/check-toolchain.sh (make check) fails when the three differ, and Renovate updates them in one
#   pull request.
# - Node: CI's node-version 22 and the web image's build stage. Moving to Node 26 LTS is in
#   docs/PROGRESS.md (Backlog).
[tools]
go = "1.27.3"
node = "22"
